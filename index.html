<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Tools — ツール一覧</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧰%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="lib/ui.css">
<style>
  /* ハブ固有のコンテンツ描画スタイル（ui.css クラスの再定義はしない）。
     2026-08-18: 名前だけのチップ配置に変更 — 16本を1画面に収めて「探す」を無くす（HUB-17/18）。
     説明と用途は画面から消し、マウスを乗せたとき（title 属性）と検索にだけ残す */
  #search { width: 100%; max-width: 420px; padding: 9px 14px; font-size: 14px; border-radius: 999px; }
  .category-title {
    font-size: 11px; color: var(--muted); margin: 16px 0 6px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
  }
  ul.tool-list, ul.recent-list {
    display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0;
  }
  ul.tool-list li, ul.recent-list li { margin: 0; }
  /* リンクがチップいっぱいに広がる = 余白を押しても開く（HUB-14） */
  ul.tool-list a, ul.recent-list a {
    display: block;
    padding: 7px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow);
    color: var(--text);
    font-weight: 600;
    font-size: 13.5px;
    text-decoration: none;
    transition: border-color .15s, color .15s, box-shadow .15s, transform .1s;
  }
  ul.tool-list a:hover, ul.recent-list a:hover {
    border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
    color: var(--accent);
    box-shadow: var(--shadow-hover);
    transform: translateY(-1px);
  }
  /* 最近使った: 同じ形のまま色だけ変えて「別の並び」だと分かるようにする */
  #recent { margin-top: 16px; }
  .recent-title {
    font-size: 11px; color: var(--muted); margin: 0 0 6px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
  }
  ul.recent-list a { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); color: var(--accent); }
  #empty-msg { color: var(--muted); margin-top: 24px; }
</style>
</head>
<body>
<main class="app">
  <h1>Personal Tools</h1>
  <p class="subtitle">打ち始めると絞り込み・Enter で先頭を開く（説明はマウスを乗せると出ます）</p>
  <input type="text" id="search" placeholder="検索（名前・説明・用途・カテゴリ。/ でフォーカス）" autocomplete="off">
  <div id="recent" hidden>
    <p class="recent-title">最近使った</p>
    <ul class="recent-list"></ul>
  </div>
  <div id="list"></div>
  <p id="empty-msg" hidden></p>
</main>

<script src="lib/storage.js"></script>
<script>
'use strict';

// ツール登録: 1行追加するだけで一覧に載る。
// スキーマ: { name: 表示名（動詞＋名詞の英語2語）, alias: 英名, path: index.html からの相対パス,
//            desc: 1行説明, category: タスク|変換・比較|設計|発想|画像|整理|PM,
//            when: いつ使うかの一言（省略可） }
// 配列の順序が同一カテゴリ内の表示順になる。最も使うものを先頭に置く
// name だけで何をするツールか分かるようにする（ブックマーク・タブ・履歴では desc が消えて
// 名前しか残らない）。規約の正本は CLAUDE.md「命名規約」
// **desc / when は画面に出さない**（2026-08-18 — 16本で縦2.3画面になり探すのが面倒になったため
// 名前だけのチップ表示にした）。両者は「マウスを乗せたときの title」と「検索の当たり」に効く。
// したがって desc は**短くしない** — 機能名・別名を盛り込むほど検索で辿り着ける（HUB-11 参照）
// alias はファイル名・spec 名・localStorage キー・window フックと同じ英小文字名で、
// 画面には出さず検索にだけ効かせる（過去のメモは英名で書かれている）
const TOOLS = [
  { name: 'Plan Tasks', alias: 'taskboard', path: 'web/taskboard.html', desc: 'vault の tasks.md（正本）を表形式で閲覧・編集 — 完了・開始日・期限・優先度、計画ビュー（タイムライン）、Excel用コピー', category: 'タスク', when: '朝の計画と期限付け・週次の棚卸し・大きなタスクの期間管理・Excel報告への転記' },
  { name: 'Convert Table', alias: 'excel2md', path: 'web/excel2md.html', desc: 'Excelのセル範囲（TSV）⇔ Markdownテーブル 双方向変換 — 結合セルの展開・表プレビュー上で列の揃え指定', category: '変換・比較', when: 'Excel の表を設計書や議事録の Markdown に貼るとき／その逆' },
  { name: 'Convert Data', alias: 'devpad', path: 'web/devpad.html', desc: '開発ユーティリティ集 — JSON・XML・SQL の整形・エスケープ・URL・Base64・正規表現・基数変換・Unix時刻・UUID・文字数カウント', category: '変換・比較', when: 'API レスポンスの整形・エンコード・時刻変換・正規表現の動作確認をその場で済ませたいとき' },
  { name: 'Normalize Text', alias: 'norm', path: 'web/norm.html', desc: '日本語表記の正規化（全角半角・ハイフン・波ダッシュ・空白・NFKC）変更箇所ハイライト付き', category: '変換・比較', when: '顧客提供テキストや仕様書の表記ゆれを揃えるとき' },
  { name: 'Compare Text', alias: 'diff', path: 'web/diff.html', desc: 'テキスト比較 — 行単位差分＋文字単位ハイライト、空白無視・全半角同一視オプション', category: '変換・比較', when: '文言修正の前後比較や設計記述の突き合わせ' },
  { name: 'Unify Terms', alias: 'terms', path: 'web/terms.html', desc: '用語統一表（変換前→変換後）を原稿へ一括適用 — 同時置換・長い語優先、ルール別件数と未適用の表示', category: '変換・比較', when: '顧客の用語集・表記ルールに原稿を合わせるとき' },
  { name: 'Fill Template', alias: 'fill', path: 'web/fill.html', desc: '定型文テンプレの差し込み — 本文の {{変数}} から入力フォームを自動生成、埋めて完成文をコピー（{{今日}} は日付を自動セット）', category: '変換・比較', when: '日報・週報・議事録の送付文・依頼文など、毎回少しだけ変わる定型連絡を作るとき' },
  { name: 'Document Schema', alias: 'ddl2spec', path: 'web/ddl2spec.html', desc: 'PostgreSQL の DDL（CREATE TABLE ＋ COMMENT ON）⇔ テーブル定義書（Markdown表）双方向変換 — 論理名・複合キー・FK・CHECK・Excel用コピー', category: '設計', when: '既存 DDL から定義書を起こすとき／定義書から DDL を作るとき（正本は DDL 側）' },
  { name: 'Export Outline', alias: 'doc2xl', path: 'web/doc2xl.html', desc: 'Markdown 文書の見出し階層 → Excel 用の階層表（大項目/中項目/小項目＋内容）— Markdown表・TSV 出力', category: '設計', when: '設計書を Markdown で下書きして、納品時に Excel の階層表へ移すとき' },
  { name: 'Draw Diagram', alias: 'diagram', path: 'web/diagram.html', desc: 'テキストから図を描く（mermaid 同梱・オフライン）— フローチャート・シーケンス図・状態遷移図を書いて PNG コピー/SVG 保存', category: '設計', when: 'draw.io を開くほどでもない図を資料や Teams に貼るとき' },
  { name: 'Draw Mindmap', alias: 'mindmap', path: 'web/mindmap.html', desc: '箇条書き → マインドマップ描画（mermaid 同梱）— 1行目が中心テーマ・タブで階層。PNG コピー/テキストはそのままノートへ', category: '発想', when: 'ブレインストーミングや打ち合わせ前の論点洗い出しに' },
  { name: 'Sort Ideas', alias: 'board', path: 'web/board.html', desc: '付箋ボード — ダブルクリックで付箋を置いて直接入力・ドラッグで並べ・色で分け・線で結ぶ → md アウトライン書き出し/PNG コピー', category: '発想', when: 'ブレインストーミングで出した発想を、並べて・まとめて・ノートに持ち帰るとき' },
  { name: 'Mask Image', alias: 'mask', path: 'web/mask.html', desc: 'スクショのマスキングと注釈 — 貼り付け → モザイク/黒塗り/白塗り・枠・矢印・テキスト・番号スタンプ・切り抜き → PNG コピー（画像は保存しない）', category: '画像', when: 'スクショを Teams・設計書に貼る前の機密隠しと説明入れ' },
  { name: 'Check Vault', alias: 'vaultlint', path: 'web/vaultlint.html', desc: 'Obsidian vault の健全性チェック — リンク切れ・添付消失・ファイル名の罠・Inbox のデイリーを検出し、承認した修復（テキスト化・リネーム追随・アーカイブ移動）まで実行（Chrome 限定）', category: '整理', when: 'vault の棚卸しと掃除に。設定した非公開フォルダは読み込まない・実行前に git コミット' },
  { name: 'Calc Dates', alias: 'dates', path: 'web/dates.html', desc: '日付・営業日・工数の計算 — N営業日後・期限の逆算・期間の営業日数・和暦/年度・人日⇄時間⇄人月換算（祝日2020〜2027年を同梱）', category: 'PM', when: '納期やレビュー期限の逆算と、見積の工数換算に' },
  { name: 'Draw Gantt', alias: 'gantt', path: 'web/gantt.html', desc: 'タスクと期間の表 → ガントチャート画像（PNG コピー・mermaid 同梱）— 管理はしない・資料貼り付け用', category: 'PM', when: 'スケジュール感を資料や Teams でさっと共有したいとき' },
];

// カテゴリの表示順。最も使う「タスク」を先頭に置く。
// 「変換・比較」は Diff が変換ではなく比較のため（英語にすると Convert ツールと衝突する）
const CATEGORY_ORDER = ['タスク', '変換・比較', '設計', '発想', '画像', '整理', 'PM'];

// 検索: 表示名＋英名（alias）＋説明＋用途（when）＋カテゴリの部分一致（大文字小文字無視）。
// 純関数（テストフック用）
function filter(query) {
  const q = query.trim().toLowerCase();
  if (q === '') return TOOLS.slice();
  return TOOLS.filter(t =>
    t.name.toLowerCase().includes(q) || (t.alias || '').toLowerCase().includes(q) ||
    t.desc.toLowerCase().includes(q) || (t.when || '').toLowerCase().includes(q) ||
    (t.category || '').toLowerCase().includes(q));
}

const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty-msg');
const searchEl = document.getElementById('search');
const recentEl = document.getElementById('recent');
const recentListEl = recentEl.querySelector('ul.recent-list');

/* ---------- 最近使った（tools:hub） ----------
   16本になり「カテゴリの中から目で探す」のが面倒になったため（利用者 2026-08-18）。
   記録はハブ経由で開いたときだけ（ブックマークから直接開いた分は載らない）。 */
const RECENT_MAX = 5;
let recent = [];

function loadRecent() {
  const data = ToolStorage.load('hub');
  const list = data && Array.isArray(data.recent) ? data.recent : [];
  // 型と値域のガード（未知の英名・文字列以外は捨てる — 改名や手書きの残骸で壊れない）
  recent = list.filter(a => typeof a === 'string' && TOOLS.some(t => t.alias === a)).slice(0, RECENT_MAX);
}

function recordUse(alias) {
  if (!TOOLS.some(t => t.alias === alias)) return;
  recent = [alias].concat(recent.filter(a => a !== alias)).slice(0, RECENT_MAX);
  ToolStorage.save('hub', { recent });
  renderRecent();
}

// ツール1つ分のチップ（リンクが li いっぱいに広がる = 余白を押しても開く HUB-14）
function makeChip(tool) {
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.href = tool.path;
  a.textContent = tool.name;
  // 説明と用途は画面に出さず、ここ（マウスオーバー）と検索にだけ残す
  a.title = tool.desc + (tool.when ? '\nいつ使う: ' + tool.when : '');
  a.addEventListener('click', () => recordUse(tool.alias));
  li.appendChild(a);
  return li;
}

function renderRecent() {
  recentListEl.textContent = '';
  recentEl.hidden = recent.length === 0;
  for (const alias of recent) {
    const t = TOOLS.find(x => x.alias === alias);
    if (t) recentListEl.appendChild(makeChip(t));
  }
}

// `/` で検索へフォーカス（HUB-13）。入力欄の中で押した `/` は文字として通す
document.addEventListener('keydown', e => {
  if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t === searchEl || (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA'))) return;
  e.preventDefault();
  searchEl.focus();
});

function render(tools) {
  listEl.textContent = '';
  if (TOOLS.length === 0) {
    emptyEl.textContent = 'ツールはまだ登録されていません';
    emptyEl.hidden = false;
    return;
  }
  if (tools.length === 0) {
    emptyEl.textContent = '該当なし';
    emptyEl.hidden = false;
    return;
  }
  emptyEl.hidden = true;

  const renderGroup = (title, items) => {
    if (items.length === 0) return;
    const titleEl = document.createElement('p');
    titleEl.className = 'category-title';
    titleEl.textContent = title;
    listEl.appendChild(titleEl);

    const ul = document.createElement('ul');
    ul.className = 'tool-list';
    for (const t of items) ul.appendChild(makeChip(t));
    listEl.appendChild(ul);
  };

  for (const cat of CATEGORY_ORDER) {
    renderGroup(cat, tools.filter(t => t.category === cat));
  }
  // CATEGORY_ORDER 外のカテゴリ（typo 等）を無言で落とさない
  renderGroup('その他', tools.filter(t => !CATEGORY_ORDER.includes(t.category)));
}

searchEl.addEventListener('input', () => render(filter(searchEl.value)));

// Enter で先頭のツールを開く（打つ → Enter だけで到達できる）。
// **IME ガード必須** — 変換確定の Enter でページ遷移させない（taskboard TB-I の教訓）
searchEl.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  const first = listEl.querySelector('ul.tool-list a');
  if (!first) return;
  e.preventDefault();
  first.click();
});

loadRecent();
renderRecent();
render(TOOLS);
ToolStorage.mountWarning();
searchEl.focus();   // 開いた瞬間から打てる（探すより打つ方が速い）

// テスト用フック。CATEGORY_ORDER も公開する — ハーネスが「描画されたグループが
// TOOLS × CATEGORY_ORDER どおりか」を**導出して**照合するため（期待値の二重管理を避ける）
window.hub = { TOOLS, CATEGORY_ORDER, filter, recordUse };
</script>
</body>
</html>
