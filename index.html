<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Tools — ツール一覧</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧰%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="lib/ui.css">
<style>
  /* ハブ固有のコンテンツ描画スタイル（ui.css クラスの再定義はしない） */
  #search { width: 100%; max-width: 420px; padding: 8px 12px; font-size: 14px; }
  .category-title { font-size: 14px; color: var(--muted); margin: 24px 0 6px; font-weight: 600; }
  ul.tool-list { list-style: none; margin: 0; padding: 0; }
  ul.tool-list li {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin: 6px 0;
  }
  ul.tool-list a { color: var(--accent); font-weight: 600; text-decoration: none; }
  ul.tool-list a:hover { text-decoration: underline; }
  ul.tool-list .desc { color: var(--muted); font-size: 13px; margin-left: 8px; }
  ul.tool-list .when { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #empty-msg { color: var(--muted); margin-top: 24px; }
</style>
</head>
<body>
<main class="app">
  <h1>Personal Tools</h1>
  <p class="subtitle">業務効率化ツール一覧 — ツール名・説明・用途でインクリメンタル検索</p>
  <input type="text" id="search" placeholder="検索（ツール名・説明・用途）" autocomplete="off">
  <div id="list"></div>
  <p id="empty-msg" hidden></p>
</main>

<script>
'use strict';

// ツール登録: 1行追加するだけで一覧に載る。
// スキーマ: { name: 表示名, path: index.html からの相対パス, desc: 1行説明,
//            category: 変換|タスク|設計|PM, when: いつ使うかの一言（省略可） }
const TOOLS = [
  { name: 'excel2md', path: 'web/excel2md.html', desc: 'Excelのセル範囲（TSV）⇔ Markdownテーブル 双方向変換 — 結合セルの展開・表プレビュー上で列の揃え指定', category: '変換', when: 'Excel の表を設計書や議事録の Markdown に貼るとき／その逆' },
  { name: 'devpad', path: 'web/devpad.html', desc: 'JSON整形・エスケープ・URL・Base64・Unix時刻・UUID・文字数カウント', category: '変換', when: 'API レスポンスの整形・エンコード・時刻変換をその場で済ませたいとき' },
  { name: 'norm', path: 'web/norm.html', desc: '日本語表記の正規化（全角半角・ハイフン・波ダッシュ・空白・NFKC）変更箇所ハイライト付き', category: '変換', when: '顧客提供テキストや仕様書の表記ゆれを揃えるとき' },
  { name: 'diff', path: 'web/diff.html', desc: 'テキスト比較 — 行単位差分＋文字単位ハイライト、空白無視・全半角同一視オプション', category: '変換', when: '文言修正の前後比較や設計記述の突き合わせ' },
  { name: 'taskboard', path: 'web/taskboard.html', desc: 'vault の tasks.md（正本）を表形式で閲覧・編集 — 完了・期限・優先度・Excel用コピー', category: 'タスク', when: '朝の計画と期限付け・週次の棚卸し・Excel報告への転記' },
];

const CATEGORY_ORDER = ['変換', 'タスク', '設計', 'PM'];

// 検索: ツール名＋説明＋用途（when）の部分一致（大文字小文字無視）。純関数（テストフック用）
function filter(query) {
  const q = query.trim().toLowerCase();
  if (q === '') return TOOLS.slice();
  return TOOLS.filter(t =>
    t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) ||
    (t.when || '').toLowerCase().includes(q));
}

const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty-msg');
const searchEl = document.getElementById('search');

function render(tools) {
  listEl.textContent = '';
  if (TOOLS.length === 0) {
    emptyEl.textContent = 'ツールはまだ登録されていません';
    emptyEl.hidden = false;
    return;
  }
  if (tools.length === 0) {
    emptyEl.textContent = '該当なし';
    emptyEl.hidden = false;
    return;
  }
  emptyEl.hidden = true;

  const renderGroup = (title, items) => {
    if (items.length === 0) return;
    const titleEl = document.createElement('p');
    titleEl.className = 'category-title';
    titleEl.textContent = title;
    listEl.appendChild(titleEl);

    const ul = document.createElement('ul');
    ul.className = 'tool-list';
    for (const t of items) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = t.path;
      a.textContent = t.name;
      const desc = document.createElement('span');
      desc.className = 'desc';
      desc.textContent = t.desc;
      li.appendChild(a);
      li.appendChild(desc);
      if (t.when) {
        const when = document.createElement('div');
        when.className = 'when';
        when.textContent = 'いつ使う: ' + t.when;
        li.appendChild(when);
      }
      ul.appendChild(li);
    }
    listEl.appendChild(ul);
  };

  for (const cat of CATEGORY_ORDER) {
    renderGroup(cat, tools.filter(t => t.category === cat));
  }
  // CATEGORY_ORDER 外のカテゴリ（typo 等）を無言で落とさない
  renderGroup('その他', tools.filter(t => !CATEGORY_ORDER.includes(t.category)));
}

searchEl.addEventListener('input', () => render(filter(searchEl.value)));
render(TOOLS);

// テスト用フック
window.hub = { TOOLS, filter };
</script>
</body>
</html>
