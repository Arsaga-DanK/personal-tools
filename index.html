<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Tools — ツール一覧</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧰%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="lib/ui.css">
<style>
  /* ハブ固有のコンテンツ描画スタイル（ui.css クラスの再定義はしない） */
  #search { width: 100%; max-width: 420px; padding: 9px 14px; font-size: 14px; border-radius: 999px; }
  .category-title {
    font-size: 12px; color: var(--muted); margin: 26px 0 8px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
  }
  ul.tool-list { list-style: none; margin: 0; padding: 0; }
  ul.tool-list li {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin: 8px 0;
    box-shadow: var(--shadow);
    transition: box-shadow .15s, border-color .15s, transform .1s;
    cursor: pointer;   /* カード全体がクリック可能（HUB-14） */
  }
  ul.tool-list li:hover {
    border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
    box-shadow: var(--shadow-hover);
    transform: translateY(-1px);
  }
  ul.tool-list a { color: var(--accent); font-weight: 650; font-size: 15px; text-decoration: none; }
  ul.tool-list a:hover { text-decoration: underline; }
  ul.tool-list .desc { color: var(--muted); font-size: 13px; margin-left: 8px; }
  ul.tool-list .when { color: var(--muted); font-size: 12px; margin-top: 4px; }
  #empty-msg { color: var(--muted); margin-top: 24px; }
</style>
</head>
<body>
<main class="app">
  <h1>Personal Tools</h1>
  <p class="subtitle">業務効率化ツール一覧 — ツール名・説明・用途でインクリメンタル検索</p>
  <input type="text" id="search" placeholder="検索（ツール名・説明・用途・カテゴリ。/ でフォーカス）" autocomplete="off">
  <div id="list"></div>
  <p id="empty-msg" hidden></p>
</main>

<script>
'use strict';

// ツール登録: 1行追加するだけで一覧に載る。
// スキーマ: { name: 表示名（短い英語1語）, alias: 英名, path: index.html からの相対パス,
//            desc: 1行説明, category: 変換・比較|タスク|設計|PM, when: いつ使うかの一言（省略可） }
// 配列の順序が同一カテゴリ内の表示順になる。最も使うものを先頭に置く
// name は領域を指すラベルに留め、説明は desc と when が担う（名前で説明しようとすると長くなる）。
// alias はファイル名・spec 名・localStorage キー・window フックと同じ英小文字名で、
// 画面には出さず検索にだけ効かせる（過去のメモは英名で書かれている）
const TOOLS = [
  { name: 'Tasks', alias: 'taskboard', path: 'web/taskboard.html', desc: 'vault の tasks.md（正本）を表形式で閲覧・編集 — 完了・開始日・期限・優先度、計画ビュー（タイムライン）、Excel用コピー', category: 'タスク', when: '朝の計画と期限付け・週次の棚卸し・大きなタスクの期間管理・Excel報告への転記' },
  { name: 'Tables', alias: 'excel2md', path: 'web/excel2md.html', desc: 'Excelのセル範囲（TSV）⇔ Markdownテーブル 双方向変換 — 結合セルの展開・表プレビュー上で列の揃え指定', category: '変換・比較', when: 'Excel の表を設計書や議事録の Markdown に貼るとき／その逆' },
  { name: 'Convert', alias: 'devpad', path: 'web/devpad.html', desc: '開発ユーティリティ集 — JSON・XML・SQL の整形・エスケープ・URL・Base64・正規表現・基数変換・Unix時刻・UUID・文字数カウント', category: '変換・比較', when: 'API レスポンスの整形・エンコード・時刻変換・正規表現の動作確認をその場で済ませたいとき' },
  { name: 'Text', alias: 'norm', path: 'web/norm.html', desc: '日本語表記の正規化（全角半角・ハイフン・波ダッシュ・空白・NFKC）変更箇所ハイライト付き', category: '変換・比較', when: '顧客提供テキストや仕様書の表記ゆれを揃えるとき' },
  { name: 'Diff', alias: 'diff', path: 'web/diff.html', desc: 'テキスト比較 — 行単位差分＋文字単位ハイライト、空白無視・全半角同一視オプション', category: '変換・比較', when: '文言修正の前後比較や設計記述の突き合わせ' },
  { name: 'Terms', alias: 'terms', path: 'web/terms.html', desc: '用語統一表（変換前→変換後）を原稿へ一括適用 — 同時置換・長い語優先、ルール別件数と未適用の表示', category: '変換・比較', when: '顧客の用語集・表記ルールに原稿を合わせるとき' },
  { name: 'Schema', alias: 'ddl2spec', path: 'web/ddl2spec.html', desc: 'PostgreSQL の DDL（CREATE TABLE ＋ COMMENT ON）⇔ テーブル定義書（Markdown表）双方向変換 — 論理名・複合キー・FK・CHECK・Excel用コピー', category: '設計', when: '既存 DDL から定義書を起こすとき／定義書から DDL を作るとき（正本は DDL 側）' },
  { name: 'Outline', alias: 'doc2xl', path: 'web/doc2xl.html', desc: 'Markdown 文書の見出し階層 → Excel 用の階層表（大項目/中項目/小項目＋内容）— Markdown表・TSV 出力', category: '設計', when: '設計書を Markdown で下書きして、納品時に Excel の階層表へ移すとき' },
  { name: 'Lint', alias: 'vaultlint', path: 'web/vaultlint.html', desc: 'Obsidian vault の健全性チェック — リンク切れ・添付消失・ファイル名の罠・Inbox のデイリーを検出し、承認した修復（テキスト化・リネーム追随・アーカイブ移動）まで実行（Chrome 限定）', category: '整理', when: 'vault の棚卸しと掃除に。91_Private は読み込まない・実行前に git コミット' },
];

// カテゴリの表示順。最も使う「タスク」を先頭に置く。
// 「変換・比較」は Diff が変換ではなく比較のため（英語にすると Convert ツールと衝突する）
const CATEGORY_ORDER = ['タスク', '変換・比較', '設計', '整理', 'PM'];

// 検索: 表示名＋英名（alias）＋説明＋用途（when）＋カテゴリの部分一致（大文字小文字無視）。
// 純関数（テストフック用）
function filter(query) {
  const q = query.trim().toLowerCase();
  if (q === '') return TOOLS.slice();
  return TOOLS.filter(t =>
    t.name.toLowerCase().includes(q) || (t.alias || '').toLowerCase().includes(q) ||
    t.desc.toLowerCase().includes(q) || (t.when || '').toLowerCase().includes(q) ||
    (t.category || '').toLowerCase().includes(q));
}

const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty-msg');
const searchEl = document.getElementById('search');

// `/` で検索へフォーカス（HUB-13）。入力欄の中で押した `/` は文字として通す
document.addEventListener('keydown', e => {
  if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t === searchEl || (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA'))) return;
  e.preventDefault();
  searchEl.focus();
});

function render(tools) {
  listEl.textContent = '';
  if (TOOLS.length === 0) {
    emptyEl.textContent = 'ツールはまだ登録されていません';
    emptyEl.hidden = false;
    return;
  }
  if (tools.length === 0) {
    emptyEl.textContent = '該当なし';
    emptyEl.hidden = false;
    return;
  }
  emptyEl.hidden = true;

  const renderGroup = (title, items) => {
    if (items.length === 0) return;
    const titleEl = document.createElement('p');
    titleEl.className = 'category-title';
    titleEl.textContent = title;
    listEl.appendChild(titleEl);

    const ul = document.createElement('ul');
    ul.className = 'tool-list';
    for (const t of items) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = t.path;
      a.textContent = t.name;
      const desc = document.createElement('span');
      desc.className = 'desc';
      desc.textContent = t.desc;
      li.appendChild(a);
      li.appendChild(desc);
      if (t.when) {
        const when = document.createElement('div');
        when.className = 'when';
        when.textContent = 'いつ使う: ' + t.when;
        li.appendChild(when);
      }
      // カードのどこを押しても開く（HUB-14）。テキスト選択して離した瞬間は遷移しない
      li.addEventListener('click', e => {
        if (e.target.closest('a')) return;
        const sel = window.getSelection();
        if (sel && String(sel).length > 0) return;
        a.click();
      });
      ul.appendChild(li);
    }
    listEl.appendChild(ul);
  };

  for (const cat of CATEGORY_ORDER) {
    renderGroup(cat, tools.filter(t => t.category === cat));
  }
  // CATEGORY_ORDER 外のカテゴリ（typo 等）を無言で落とさない
  renderGroup('その他', tools.filter(t => !CATEGORY_ORDER.includes(t.category)));
}

searchEl.addEventListener('input', () => render(filter(searchEl.value)));
render(TOOLS);

// テスト用フック
window.hub = { TOOLS, filter };
</script>
</body>
</html>
