<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Tools — ツール一覧</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧰%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="lib/ui.css">
<style>
  /* ハブ固有のコンテンツ描画スタイル（ui.css クラスの再定義はしない）。
     2026-08-18 の3回目の作り直し。**カテゴリごとにグリッドを分けるのをやめた** —
     7カテゴリ中4つが1〜2本しかなく、5列の升目に流すと空きが24（充填率40%）になり、
     右側に穴が並ぶのが「見にくい」の主因だった（調査で実測）。
     16 = 4×4 なので列数を 4→2→1 に固定すると余りが出ない。カテゴリは絞り込みチップが担う。
     GitHub Marketplace / Raycast / Linear の実装調査から:
     - 影は立てず枠と面で見せる・ホバーは**面色だけ**変える（動かさない・文字色を変えない）
     - アイコンは角丸タイルに載せて内側1pxリングを敷く（絵文字ごとの濃さの差を吸収する） */
  #search { width: 100%; max-width: 420px; padding: 9px 14px; font-size: 14px; border-radius: 999px; }

  #chips, #list, #recent, #router-out {
    --tile: 46px;
    --tint: 28%;          /* タイルの塗りの濃さ */
    --ring: 55%;          /* タイルの内側リング */
    --muted-card: var(--muted);
    --edge: var(--border);
  }
  @media (prefers-color-scheme: dark) {
    #chips, #list, #recent, #router-out {
      --tint: 34%;
      --ring: 60%;
      --muted-card: #aab4c8;   /* --muted は面 --panel に対し 4.06:1 で AA 不合格（実測） */
      --edge: #5c6880;         /* --border は面との差 1.36:1 で、影なしのダークだと輪郭が消える */
    }
  }

  /* カテゴリ色（Nord）。色は補助で、意味はチップと title が担う */
  [data-cat="タスク"] { --cat: #a3be8c; }
  [data-cat="変換・比較"] { --cat: #81a1c1; }
  [data-cat="設計"] { --cat: #5e81ac; }
  [data-cat="発想"] { --cat: #b48ead; }
  [data-cat="画像"] { --cat: #d08770; }
  [data-cat="整理"] { --cat: #8fbcbb; }
  [data-cat="PM"] { --cat: #d9a441; }

  /* 絞り込みチップ（件数つき = 目次も兼ねる） */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 8px; }
  .chip {
    font: inherit;
    font-size: 12px; font-weight: 600; line-height: 1;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--edge);
    background: var(--panel);
    color: var(--muted-card);
    cursor: pointer;
    box-shadow: none;
    transition: background-color .15s, border-color .15s, color .15s;
  }
  .chip:hover { transform: none; box-shadow: none; color: var(--text); border-color: color-mix(in srgb, var(--accent) 45%, var(--edge)); }
  .chip .n { font-weight: 400; opacity: .75; margin-left: 5px; }
  .chip[aria-pressed="true"] {
    background: color-mix(in srgb, var(--accent) 14%, var(--panel));
    border-color: color-mix(in srgb, var(--accent) 50%, var(--edge));
    color: var(--text);
  }

  /* カードのグリッド。**3列固定**（利用者の指定 2026-08-18）。
     16本は 6行（最終行は1枚）になるが、余りは左端に付けて中央寄せしない — 左端の縦一列が視線の基準線。
     `auto-fit` は使わない（本数が減った行でカードが全幅に伸びる）。
     高さは 1280x900 でちょうど1画面に収まるよう実測で詰めてある（HUB-18 がピン。
     **カードの寸法・余白・ツール本数を変えたら必ず測り直す**） */
  ul.tool-list {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 11px;
    list-style: none; margin: 0; padding: 0;
  }
  @media (max-width: 980px) { ul.tool-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { ul.tool-list { grid-template-columns: minmax(0, 1fr); } }
  ul.tool-list li { margin: 0; }

  /* リンクがカードいっぱいに広がる = どこを押しても開く（HUB-14） */
  ul.tool-list a {
    display: grid;
    grid-template-columns: var(--tile) 1fr;
    column-gap: 12px;
    align-items: center;
    min-height: 84px;
    height: 100%;
    padding: 14px 18px 14px 14px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 10px;
    box-shadow: var(--shadow);
    color: var(--text);
    text-decoration: none;
    transition: background-color .15s, border-color .15s;
  }
  /* ホバーは面と枠だけ（文字色を変えるとコントラストが 12.5:1 → 4.0:1 に落ちる — 調査で実測） */
  ul.tool-list a:hover, ul.tool-list a:focus-visible {
    background: color-mix(in srgb, var(--accent) 7%, var(--panel));
    border-color: color-mix(in srgb, var(--accent) 45%, var(--edge));
  }
  .icon {
    width: var(--tile); height: var(--tile);
    display: grid; place-items: center;
    font-size: 25px; line-height: 1;
    border-radius: 11px;
    background: color-mix(in srgb, var(--cat, var(--accent)) var(--tint), var(--panel));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cat, var(--accent)) var(--ring), transparent);
    flex: none;
  }
  ul.tool-list .body { min-width: 0; }
  /* 1行に収める（長い一言でも行の高さが揃う = カードの高さが暴れない） */
  ul.tool-list .tool-name,
  ul.tool-list .short {
    display: block;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.35;
  }
  ul.tool-list .tool-name { font-size: 16px; font-weight: 600; color: var(--text); }
  ul.tool-list .short { font-size: 13.5px; color: var(--muted-card); }

  /* 最近使った: カードを小さくした形（直前に開いたものなので一言は要らない） */
  #recent { margin: 10px 0 2px; }
  .recent-title { font-size: 11px; color: var(--muted-card); margin: 0 0 5px; font-weight: 700; }
  ul.recent-list { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
  ul.recent-list li { margin: 0; }
  ul.recent-list a {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 13px 6px 7px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 10px;
    box-shadow: var(--shadow);
    color: var(--text);
    font-weight: 600; font-size: 13px;
    text-decoration: none;
    transition: background-color .15s, border-color .15s;
  }
  ul.recent-list a:hover, ul.recent-list a:focus-visible {
    background: color-mix(in srgb, var(--accent) 7%, var(--panel));
    border-color: color-mix(in srgb, var(--accent) 45%, var(--edge));
  }
  ul.recent-list .icon { --tile: 26px; font-size: 15px; border-radius: 7px; }
  #empty-msg { color: var(--muted-card); margin-top: 24px; }

  /* データから探す（貼ったものの行き先を出す）。既定は折りたたみ = 1画面を崩さない */
  .search-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #router-toggle, #copy-notes { font-size: 12px; padding: 7px 12px; border-radius: 999px; }
  #router-toggle[aria-expanded="true"] {
    background: color-mix(in srgb, var(--accent) 14%, var(--panel));
    border-color: color-mix(in srgb, var(--accent) 50%, var(--edge));
  }
  #router { margin: 10px 0 0; }
  #router textarea {
    width: 100%; min-height: 96px; font-size: 13px;
    border-radius: 12px; border: 1px solid var(--edge); background: var(--panel);
    color: var(--text); padding: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #router-out { margin: 8px 0 0; }
  #router-out .why { font-size: 12px; color: var(--muted-card); margin: 0 0 6px; }
</style>
</head>
<body>
<main class="app-wide">
  <h1>Personal Tools</h1>
  <p class="subtitle">打ち始めると絞り込み・Enter で先頭を開く（詳しい説明はマウスを乗せると出ます）</p>
  <div class="search-row">
    <input type="text" id="search" placeholder="検索（名前・説明・用途・カテゴリ。/ でフォーカス）" autocomplete="off">
    <button type="button" id="router-toggle" aria-expanded="false" aria-controls="router"
      title="Excelの表・JSON・DDL・tasks.md などを貼ると、行ける道具が出ます">データから探す</button>
    <button type="button" id="copy-notes" title="Obsidian のノートに貼る用のリンク集をコピー（このハブと全ツールへの直リンク。パスはいま開いている場所から作ります）">Obsidian 用のリンク集</button>
  </div>
  <div id="router" hidden>
    <textarea id="router-in" spellcheck="false" aria-label="データを貼り付け"
      placeholder="ここに貼り付け — Excel の表 / JSON / CREATE TABLE / tasks.md / md の見出し / mermaid など"></textarea>
    <div id="router-out"></div>
  </div>
  <div id="recent" hidden>
    <p class="recent-title">最近使った</p>
    <ul class="recent-list"></ul>
  </div>
  <div id="chips" class="chips" role="group" aria-label="カテゴリで絞り込み"></div>
  <div id="list"></div>
  <p id="empty-msg" hidden></p>
</main>

<!-- 読み込み順: ui.js → storage.js（storage.js は保存失敗と未対応の告知に ToolUI.banner を使う）→ handoff.js -->
<script src="lib/ui.js"></script>
<script src="lib/storage.js"></script>
<script src="lib/handoff.js"></script>
<script>
'use strict';

// ツール登録: 1行追加するだけで一覧に載る。
// スキーマ: { name: 表示名（動詞＋名詞の英語2語）, alias: 英名, path: index.html からの相対パス,
//            desc: 1行説明, category: タスク|変換・比較|設計|発想|画像|整理|PM,
//            when: いつ使うかの一言（省略可） }
// 配列の順序が同一カテゴリ内の表示順になる。最も使うものを先頭に置く
// name だけで何をするツールか分かるようにする（ブックマーク・タブ・履歴では desc が消えて
// 名前しか残らない）。規約の正本は CLAUDE.md「命名規約」
//
// **画面に出るのは icon / name / short の3つだけ**（2026-08-18）。
// 経緯: 16本で縦2.3画面になり探すのが面倒 → 名前だけのチップにしたら「使いにくい・説明が無いと
// 分かりにくい」（利用者）→ **カード＋一言**に落ち着いた。
// - short: カードに出す一言（全角12〜18字が目安。長いと2行で崩れる）
// - desc / when: **画面には出さない**が title（マウスオーバー）と検索に効く。
//   したがって desc は**短くしない** — 機能名・別名を盛り込むほど検索で辿り着ける（HUB-11 参照）
// - icon: カードの目印。**各ツールの favicon と同じ絵文字**を基本にするが、
//   U+FE0F（異体字セレクタ）が要るもの（board / doc2xl / devpad の favicon）は
//   文字ゲートに掛かるので、単独で絵文字として出る字に置換する。
//   重複する絵文字も避ける（favicon では excel2md と gantt が同じで目印にならない）。
//   **このコメントに実物の絵文字を貼らないこと** — 貼った瞬間に自分がゲートの検出対象になる
// alias はファイル名・spec 名・localStorage キー・window フックと同じ英小文字名で、
// 画面には出さず検索にだけ効かせる（過去のメモは英名で書かれている）
const TOOLS = [
  { name: 'Plan Tasks', alias: 'taskboard', path: 'web/taskboard.html', icon: '✅', short: 'tasks.md を表で編集', desc: 'vault の tasks.md（正本）を表形式で閲覧・編集 — 完了・開始日・期限・優先度、計画ビュー（タイムライン）、Excel用コピー', category: 'タスク', when: '朝の計画と期限付け・週次の棚卸し・大きなタスクの期間管理・Excel報告への転記' },
  { name: 'Check Issue', alias: 'issue', path: 'web/issue.html', icon: '🎯', short: '論点を立ててノートにする', desc: '論点（イシュー）を立ててノートにする — 1問ずつ答えるウィザードで マイルストーン→論点→不明点→リスク→次の一手 を埋め、作業テーマ・WHY始まり・締切なし・比較の形を判定して 04_Issues にノートを作成（貼った文章の点検にも使える）', category: 'タスク', when: '定例や依頼の直後に「で、答えを出すべき問いは何か」を一行にするとき／手が止まって悩みはじめたとき' },
  { name: 'Convert Table', alias: 'excel2md', path: 'web/excel2md.html', icon: '📊', short: 'Excel の表 ⇔ Markdown', desc: 'Excelのセル範囲（TSV）⇔ Markdownテーブル 双方向変換 — 結合セルの展開・表プレビュー上で列の揃え指定', category: '変換・比較', when: 'Excel の表を設計書や議事録の Markdown に貼るとき／その逆' },
  { name: 'Convert Data', alias: 'devpad', path: 'web/devpad.html', icon: '🔧', short: 'JSON・SQL 整形ほか11種', desc: '開発ユーティリティ集 — JSON・XML・SQL の整形・エスケープ・URL・Base64・正規表現・基数変換・Unix時刻・UUID・文字数カウント', category: '変換・比較', when: 'API レスポンスの整形・エンコード・時刻変換・正規表現の動作確認をその場で済ませたいとき' },
  { name: 'Normalize Text', alias: 'norm', path: 'web/norm.html', icon: '🔤', short: '表記ゆれを正規化', desc: '日本語表記の正規化（全角半角・ハイフン・波ダッシュ・空白・NFKC）変更箇所ハイライト付き', category: '変換・比較', when: '顧客提供テキストや仕様書の表記ゆれを揃えるとき' },
  { name: 'Compare Text', alias: 'diff', path: 'web/diff.html', icon: '🔍', short: '2つの文章の差分', desc: 'テキスト比較 — 行単位差分＋文字単位ハイライト、空白無視・全半角同一視オプション', category: '変換・比較', when: '文言修正の前後比較や設計記述の突き合わせ' },
  { name: 'Unify Terms', alias: 'terms', path: 'web/terms.html', icon: '📖', short: '用語統一表を一括適用', desc: '用語統一表（変換前→変換後）を原稿へ一括適用 — 同時置換・長い語優先、ルール別件数と未適用の表示', category: '変換・比較', when: '顧客の用語集・表記ルールに原稿を合わせるとき' },
  { name: 'Fill Template', alias: 'fill', path: 'web/fill.html', icon: '📝', short: '定型文の穴埋め', desc: '定型文テンプレの差し込み — 本文の {{変数}} から入力フォームを自動生成、埋めて完成文をコピー（{{今日}} は日付を自動セット）', category: '変換・比較', when: '日報・週報・議事録の送付文・依頼文など、毎回少しだけ変わる定型連絡を作るとき' },
  { name: 'Document Schema', alias: 'ddl2spec', path: 'web/ddl2spec.html', icon: '📋', short: 'DDL ⇔ テーブル定義書', desc: 'PostgreSQL の DDL（CREATE TABLE ＋ COMMENT ON）⇔ テーブル定義書（Markdown表）双方向変換 — 論理名・複合キー・FK・CHECK・Excel用コピー', category: '設計', when: '既存 DDL から定義書を起こすとき／定義書から DDL を作るとき（正本は DDL 側）' },
  { name: 'Export Outline', alias: 'doc2xl', path: 'web/doc2xl.html', icon: '📤', short: '見出し → Excel 階層表', desc: 'Markdown 文書の見出し階層 → Excel 用の階層表（大項目/中項目/小項目＋内容）— Markdown表・TSV 出力', category: '設計', when: '設計書を Markdown で下書きして、納品時に Excel の階層表へ移すとき' },
  { name: 'Draw Diagram', alias: 'diagram', path: 'web/diagram.html', icon: '📈', short: 'テキスト → フロー図', desc: 'テキストから図を描く（mermaid 同梱・オフライン）— フローチャート・シーケンス図・状態遷移図を書いて PNG コピー/SVG 保存', category: '設計', when: 'draw.io を開くほどでもない図を資料や Teams に貼るとき' },
  { name: 'Draw Mindmap', alias: 'mindmap', path: 'web/mindmap.html', icon: '🧠', short: '箇条書き → マインドマップ', desc: '箇条書き → マインドマップ描画（mermaid 同梱）— 1行目が中心テーマ・タブで階層。PNG コピー/テキストはそのままノートへ', category: '発想', when: 'ブレインストーミングや打ち合わせ前の論点洗い出しに' },
  { name: 'Sort Ideas', alias: 'board', path: 'web/board.html', icon: '🧩', short: '付箋を並べて発想をまとめる', desc: '付箋ボード — ダブルクリックで付箋を置いて直接入力・ドラッグで並べ・色で分け・線で結ぶ → md アウトライン書き出し/PNG コピー', category: '発想', when: 'ブレインストーミングで出した発想を、並べて・まとめて・ノートに持ち帰るとき' },
  { name: 'Mask Image', alias: 'mask', path: 'web/mask.html', icon: '🫥', short: 'スクショの目隠しと注釈', desc: 'スクショのマスキングと注釈 — 貼り付け → モザイク/黒塗り/白塗り・枠・矢印・テキスト・番号スタンプ・切り抜き → PNG コピー（画像は保存しない）', category: '画像', when: 'スクショを Teams・設計書に貼る前の機密隠しと説明入れ' },
  { name: 'Check Vault', alias: 'vaultlint', path: 'web/vaultlint.html', icon: '🧹', short: 'vault のリンク切れ点検', desc: 'Obsidian vault の健全性チェック — リンク切れ・添付消失・ファイル名の罠・Inbox のデイリーを検出し、承認した修復（テキスト化・リネーム追随・アーカイブ移動）まで実行（Chrome 限定）', category: '整理', when: 'vault の棚卸しと掃除に。設定した非公開フォルダは読み込まない・実行前に git コミット' },
  { name: 'Calc Dates', alias: 'dates', path: 'web/dates.html', icon: '📅', short: '営業日・和暦・工数の計算', desc: '日付・営業日・工数の計算 — N営業日後・期限の逆算・期間の営業日数・和暦/年度・人日⇄時間⇄人月換算（祝日2020〜2027年を同梱）', category: 'PM', when: '納期やレビュー期限の逆算と、見積の工数換算に' },
  { name: 'Draw Gantt', alias: 'gantt', path: 'web/gantt.html', icon: '⏳', short: '表 → ガントチャート画像', desc: 'タスクと期間の表 → ガントチャート画像（PNG コピー・mermaid 同梱）— 管理はしない・資料貼り付け用', category: 'PM', when: 'スケジュール感を資料や Teams でさっと共有したいとき' },
];

// カテゴリの表示順。最も使う「タスク」を先頭に置く。
// 「変換・比較」は Diff が変換ではなく比較のため（英語にすると Convert ツールと衝突する）
const CATEGORY_ORDER = ['タスク', '変換・比較', '設計', '発想', '画像', '整理', 'PM'];

// 検索: 表示名＋英名（alias）＋説明＋用途（when）＋カテゴリの部分一致（大文字小文字無視）。
// 純関数（テストフック用）
function filter(query) {
  const q = query.trim().toLowerCase();
  if (q === '') return TOOLS.slice();
  return TOOLS.filter(t =>
    t.name.toLowerCase().includes(q) || (t.alias || '').toLowerCase().includes(q) ||
    (t.short || '').toLowerCase().includes(q) ||
    t.desc.toLowerCase().includes(q) || (t.when || '').toLowerCase().includes(q) ||
    (t.category || '').toLowerCase().includes(q));
}

/* ---------- データから探す（貼ったものの行き先を決める・2026-08-18） ----------
   16本のうち11本が「貼る」から始まるのに、ツール名を知らないと辿り着けなかった
   （診断: ツール間リンク0本）。**受け取れるツールだけを候補に出す**（出して受け取れないのは嘘）。
   判定は決め打ちにせず**候補を複数出して選ばせる**（md の見出しはアウトラインとも読める）。 */

// 受け取り側を実装済みのツールだけ（lib/handoff.js の take を呼んでいるもの）
const RECEIVERS = ['excel2md', 'devpad', 'ddl2spec', 'doc2xl', 'mindmap', 'diagram', 'gantt'];

// 純関数: 貼ったテキスト → [{alias, why}]（確度の高い順）。テストフックで公開する
function routeText(text) {
  const t = String(text == null ? '' : text);
  const body = t.trim();
  if (body === '') return [];
  const lines = body.split('\n');
  const out = [];
  const add = (alias, why) => {
    if (RECEIVERS.includes(alias) && !out.some(x => x.alias === alias)) out.push({ alias, why });
  };

  // 形式がはっきり分かるものを先に
  if (/^\s*[{[]/.test(body)) add('devpad', 'JSON として整形・検証できます');
  if (/^\s*<\?xml|^\s*<[a-zA-Z]/.test(body)) add('devpad', 'XML として整形できます');
  if (/\b(CREATE\s+TABLE|COMMENT\s+ON)\b/i.test(body)) add('ddl2spec', 'DDL からテーブル定義書を起こせます');
  if (/^\s*(SELECT|INSERT|UPDATE|DELETE|WITH)\b/i.test(body)) add('devpad', 'SQL として整形できます');
  if (/```\s*mermaid|^\s*(graph|flowchart|sequenceDiagram|stateDiagram|classDiagram|erDiagram|gantt|mindmap)\b/m.test(body)) {
    add('diagram', 'mermaid の図として描けます');
  }
  // taskboard の「計画をコピー」= ガントに直行できる
  if (/^内容\t開始日\t期限\t日数\t状態\tセクション/.test(body)) add('gantt', '計画表からガント画像を作れます');
  // tasks.md（Obsidian Tasks 記法）
  if (lines.some(l => /^\s*(\t*)- \[.\] /.test(l))) {
    if (/[\u{1F6EB}\u{1F4C5}]/u.test(body)) add('gantt', 'タスクの日付からガント画像を作れます');
  }
  // md の見出し → 階層表 or マインドマップ（どちらもあり得るので両方出す）
  if (/^#{1,6} /m.test(body)) {
    add('doc2xl', '見出し階層を Excel 用の表にできます');
    add('mindmap', '見出しと箇条書きをマインドマップにできます');
  }
  // 箇条書きだけ（見出しが無い）→ マインドマップ
  if (!/^#{1,6} /m.test(body) && lines.filter(l => /^\s*([-*+]|\d+[.)])\s/.test(l)).length >= 2) {
    add('mindmap', '箇条書きをマインドマップにできます');
  }
  // 表: md テーブル or タブ区切りの複数行
  if (lines.length >= 2 && lines.filter(l => l.trim().startsWith('|')).length >= 2) {
    add('excel2md', 'Markdown の表を Excel 用に戻せます');
  }
  if (lines.length >= 2 && lines.filter(l => l.includes('\t')).length >= 2) {
    add('excel2md', 'タブ区切りの表を Markdown にできます');
  }
  return out;
}

const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty-msg');
const searchEl = document.getElementById('search');
const recentEl = document.getElementById('recent');
const recentListEl = recentEl.querySelector('ul.recent-list');
const chipsEl = document.getElementById('chips');

/* ---------- 最近使った（tools:hub） ----------
   16本になり「カテゴリの中から目で探す」のが面倒になったため（利用者 2026-08-18）。
   記録はハブ経由で開いたときだけ（ブックマークから直接開いた分は載らない）。 */
const RECENT_MAX = 5;
let recent = [];

function loadRecent() {
  const data = ToolStorage.load('hub');
  const list = data && Array.isArray(data.recent) ? data.recent : [];
  // 型と値域のガード（未知の英名・文字列以外は捨てる — 改名や手書きの残骸で壊れない）
  recent = list.filter(a => typeof a === 'string' && TOOLS.some(t => t.alias === a)).slice(0, RECENT_MAX);
}

function recordUse(alias) {
  if (!TOOLS.some(t => t.alias === alias)) return;
  recent = [alias].concat(recent.filter(a => a !== alias)).slice(0, RECENT_MAX);
  ToolStorage.save('hub', { recent });
  renderRecent();
}

// ツール1つ分のカード（リンクがカードいっぱいに広がる = どこを押しても開く HUB-14）。
// compact=true は「最近使った」用（アイコン＋名前だけ）
function makeCard(tool, compact) {
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.href = tool.path;
  // 長い説明と用途は画面に出さず、ここ（マウスオーバー）と検索にだけ残す
  a.title = tool.desc + (tool.when ? '\nいつ使う: ' + tool.when : '');
  a.dataset.cat = tool.category || '';   // タイルの色（意味はチップと title が担う — 色だけに頼らない）
  const icon = document.createElement('span');
  icon.className = 'icon';
  icon.textContent = tool.icon || '';
  a.appendChild(icon);
  if (compact) {
    a.appendChild(document.createTextNode(tool.name));
  } else {
    const body = document.createElement('span');
    body.className = 'body';
    const name = document.createElement('span');
    name.className = 'tool-name';
    name.textContent = tool.name;
    const short = document.createElement('span');
    short.className = 'short';
    short.textContent = tool.short || '';
    body.appendChild(name);
    body.appendChild(short);
    a.appendChild(body);
  }
  a.addEventListener('click', () => recordUse(tool.alias));
  li.appendChild(a);
  return li;
}

function renderRecent() {
  recentListEl.textContent = '';
  recentEl.hidden = recent.length === 0;
  for (const alias of recent) {
    const t = TOOLS.find(x => x.alias === alias);
    if (t) recentListEl.appendChild(makeCard(t, true));
  }
}

// `/` で検索へフォーカス（HUB-13）。入力欄の中で押した `/` は文字として通す
document.addEventListener('keydown', e => {
  if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t === searchEl || (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA'))) return;
  e.preventDefault();
  searchEl.focus();
});

// 表示順: CATEGORY_ORDER の順（同カテゴリが隣り合うのでタイルの色が帯になって群が見える）。
// CATEGORY_ORDER 外のカテゴリ（typo 等）は末尾に置いて無言で落とさない
function inOrder(tools) {
  const rank = t => {
    const i = CATEGORY_ORDER.indexOf(t.category);
    return i === -1 ? CATEGORY_ORDER.length : i;
  };
  return tools.slice().sort((a, b) => rank(a) - rank(b) || TOOLS.indexOf(a) - TOOLS.indexOf(b));
}

function render(tools) {
  listEl.textContent = '';
  if (TOOLS.length === 0) {
    emptyEl.textContent = 'ツールはまだ登録されていません';
    emptyEl.hidden = false;
    return;
  }
  if (tools.length === 0) {
    emptyEl.textContent = '該当なし';
    emptyEl.hidden = false;
    return;
  }
  emptyEl.hidden = true;

  // カテゴリごとに分けず**1枚のグリッド**に流す（分けると升目の6割が空く — 2026-08-18 の調査）
  const ul = document.createElement('ul');
  ul.className = 'tool-list';
  for (const t of inOrder(tools)) ul.appendChild(makeCard(t, false));
  listEl.appendChild(ul);
}

/* ---------- カテゴリの絞り込みチップ（件数つき = 目次も兼ねる） ---------- */

let catFilter = null;   // null = すべて

// 検索文字列とチップの両方を通した結果（合成する）
function visibleTools() {
  return filter(searchEl.value).filter(t => catFilter === null || t.category === catFilter);
}

function makeChip(label, cat, count) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'chip';
  b.dataset.cat = cat === null ? '' : cat;
  b.setAttribute('aria-pressed', String(catFilter === cat));
  b.appendChild(document.createTextNode(label));
  const n = document.createElement('span');
  n.className = 'n';
  n.textContent = String(count);
  b.appendChild(n);
  b.addEventListener('click', () => {
    catFilter = catFilter === cat ? null : cat;   // 押されているチップをもう一度押すと解除
    renderChips();
    render(visibleTools());
  });
  return b;
}

function renderChips() {
  chipsEl.textContent = '';
  chipsEl.appendChild(makeChip('すべて', null, TOOLS.length));
  const cats = CATEGORY_ORDER.concat(
    TOOLS.map(t => t.category).filter(c => !CATEGORY_ORDER.includes(c)));
  for (const cat of cats) {
    const n = TOOLS.filter(t => t.category === cat).length;
    if (n > 0) chipsEl.appendChild(makeChip(cat, cat, n));
  }
}

/* ---------- 振り分けの UI ---------- */

const routerEl = document.getElementById('router');
const routerToggleEl = document.getElementById('router-toggle');
const routerInEl = document.getElementById('router-in');
const routerOutEl = document.getElementById('router-out');

function renderRoute() {
  routerOutEl.textContent = '';
  const text = routerInEl.value;
  if (text.trim() === '') return;
  const hits = routeText(text);
  const note = document.createElement('p');
  note.className = 'why';
  if (hits.length === 0) {
    note.textContent = '行き先が判定できませんでした（そのままツールを選んで貼ってください）';
    routerOutEl.appendChild(note);
    return;
  }
  note.textContent = '貼ったデータの行き先（押すとデータを持って開きます）';
  routerOutEl.appendChild(note);
  const ul = document.createElement('ul');
  ul.className = 'tool-list';
  for (const hit of hits) {
    const t = TOOLS.find(x => x.alias === hit.alias);
    if (!t) continue;
    // カードは一覧と同じ形。ただし一言は「なぜここに行けるか」に差し替える
    const card = makeCard(Object.assign({}, t, { short: hit.why }), false);
    const a = card.querySelector('a');
    a.href = '#';
    a.addEventListener('click', e => {
      e.preventDefault();
      recordUse(t.alias);
      ToolHandoff.send(t.alias, 'router', text, t.path);
    });
    ul.appendChild(card);
  }
  routerOutEl.appendChild(ul);
}

/* ---------- Obsidian 用のリンク集（2026-08-18） ----------
   ツールを思い出す瞬間は Obsidian の中で来る。vault にノートを1枚置けば導線になる。
   **パスはコードに書かない** — いま開いている場所（location）から組む（環境依存を持たない）。
   ここでは vault に書き込まず、**貼るための md をクリップボードに渡すだけ**（正本は利用者が置く） */
function buildNotesMd() {
  const hubUrl = location.href.replace(/[?#].*$/, '');
  const base = hubUrl.replace(/index\.html$/, '');
  const lines = ['# ツール', '', '- [ツール一覧（ハブ）](' + hubUrl + ')', ''];
  for (const cat of CATEGORY_ORDER) {
    const items = TOOLS.filter(t => t.category === cat);
    if (!items.length) continue;
    lines.push('## ' + cat);
    for (const t of items) {
      lines.push('- [' + t.name + '](' + base + t.path + ') — ' + t.short);
    }
    lines.push('');
  }
  return lines.join('\n');
}

document.getElementById('copy-notes').addEventListener('click', () => {
  const btn = document.getElementById('copy-notes');
  // 共通核を使う（textarea 選択方式のフォールバックと復帰時間はここが正本 — CLAUDE.md）
  ToolUI.copy(buildNotesMd()).then(ok => {
    ToolUI.feedback(btn, ok ? '✓ コピーしました' : 'コピーできません');
  });
});

routerToggleEl.addEventListener('click', () => {
  const open = routerEl.hidden;
  routerEl.hidden = !open;
  routerToggleEl.setAttribute('aria-expanded', String(open));
  if (open) routerInEl.focus();
});
routerInEl.addEventListener('input', renderRoute);
routerInEl.addEventListener('paste', () => setTimeout(renderRoute, 0));

searchEl.addEventListener('input', () => render(visibleTools()));

// Enter で先頭のツールを開く（打つ → Enter だけで到達できる）。
// **IME ガード必須** — 変換確定の Enter でページ遷移させない（taskboard TB-I の教訓）
searchEl.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  const first = listEl.querySelector('ul.tool-list a');
  if (!first) return;
  e.preventDefault();
  first.click();
});

loadRecent();
renderRecent();
renderChips();
render(TOOLS);
ToolStorage.mountWarning();
searchEl.focus();   // 開いた瞬間から打てる（探すより打つ方が速い）

// テスト用フック。CATEGORY_ORDER も公開する — ハーネスが「描画された並びが
// TOOLS × CATEGORY_ORDER どおりか」を**導出して**照合するため（期待値の二重管理を避ける）
window.hub = { TOOLS, CATEGORY_ORDER, filter, recordUse, inOrder, routeText, RECEIVERS, buildNotesMd };
</script>
