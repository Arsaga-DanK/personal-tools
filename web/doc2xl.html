<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outline (doc2xl)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🗂️%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../lib/ui.css">
<style>
  /* doc2xl 固有: なし（オプション行も ui.css の .toolbar / .opts を使う） */
</style>
</head>
<body>
<main class="app-wide">
  <p class="tool-header"><a href="../index.html">← ツール一覧</a><span class="autosave-note">入力は自動保存されます</span></p>
  <h1>Outline</h1>
  <p class="subtitle">Markdown 文書の見出し階層を Excel 用の階層表（大項目・中項目・小項目＋内容）に変換 — 正本は Markdown 側、Excel は納品時の生成物として運用します</p>

  <div class="toolbar">
    <span class="opts">
      <label>階層列の見出し <select id="opt-names">
        <option value="default">大項目・中項目・小項目</option>
        <option value="level">レベル1・2・3</option>
        <option value="custom">カスタム</option>
      </select></label>
      <input type="text" id="opt-names-custom" placeholder="カンマ区切り（例: カテゴリ,機能）"
        spellcheck="false" aria-label="階層列の見出し名（カンマ区切り）" hidden>
      <label class="toggle"><input type="checkbox" id="opt-fill"> 空セルを上の値で埋める</label>
      <label>内容の単位 <select id="opt-split">
        <option value="line">1行1セル</option>
        <option value="block">見出し配下をまとめる</option>
      </select></label>
      <span style="white-space: nowrap" role="radiogroup" aria-label="出力形式">
        <label class="toggle"><input type="radio" name="fmt" id="fmt-md" value="md" checked> Markdown表</label>
        <label class="toggle"><input type="radio" name="fmt" id="fmt-tsv" value="tsv"> TSV</label>
      </span>
    </span>
    <span class="spacer"></span>
    <button class="primary" id="copy-btn" title="出力をクリップボードへ（Cmd/Ctrl+Enter）">出力をコピー</button>
  </div>

  <div class="banner" id="banner" hidden></div>

  <div class="panes">
    <div class="pane">
      <p class="pane-title">入力（Markdown）<button type="button" class="sample-btn" id="sample-btn" hidden>サンプルを入れる</button></p>
      <textarea id="input" spellcheck="false" aria-label="入力（Markdown）" placeholder="# 機能一覧 のような見出し付きの Markdown を貼り付け"></textarea>
    </div>
    <div class="pane">
      <p class="pane-title" id="out-title">出力（Markdown表）</p>
      <textarea id="output" readonly aria-label="出力"></textarea>
    </div>
  </div>
</main>

<script src="../lib/ui.js"></script>
<script src="../lib/excel.js"></script>
<script src="../lib/storage.js"></script>
<script>
'use strict';

/* ========== 変換エンジン（純関数・DOM も I/O も触らない） ==========
   方針: 見出し階層 → 列は機械的に決まる変換だけを行う。意味判断（Excel→md）は
   AI の仕事なので持ち込まない（docs/specs/doc2xl.md の3層アーキテクチャ）。
   原則: **落とさない**。表現できない要素は原文のまま内容列に入れ、警告に種別×件数を出す。 */

const MAX_INPUT_CHARS = 500000;  // 性能ガード①: 超過時は処理せず理由を表示
const MAX_OUTPUT_ROWS = 5000;    // 性能ガード②: 同上（一部のみ処理はしない）
const MAX_TABLE_COLS = 30;       // これを超える表だけ内容列へ連結する（全体は止めない。DX-Q5）

const LEVEL_NAMES = ['大項目', '中項目', '小項目', '細項目', '項目5', '項目6'];

// インライン記法を落として文字だけ残す。リンクの URL と画像は**情報が減るので件数を数える**。
// **アンダースコア強調（_x_ / __x__）は落とさない** — user_id のような識別子と
// 機械的に区別できないため（強調を消すつもりで識別子を壊す方が実害が大きい）
function stripInline(s, c) {
  return String(s)
    .replace(/!\[([^\]]*)\]\(([^)]*)\)/g, (m, alt) => { c.image++; return alt; })  // 画像 → alt
    .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '$2')   // [[target|別名]] → 別名
    .replace(/\[\[([^\]]+)\]\]/g, '$1')              // [[a]] → a
    .replace(/\[([^\]]+)\]\(([^)]*)\)/g, (m, t) => { c.link++; return t; })       // リンク → 表示テキスト
    .replace(/`([^`]*)`/g, '$1')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/~~([^~]+)~~/g, '$1');
}

// md 表の1行をセルに分割（\| エスケープを | に戻す。Tables と同じ考え方）
function splitTableRow(line) {
  let s = line.trim().replace(/^\|/, '').replace(/\|$/, '');
  const cells = [];
  let cur = '';
  for (let k = 0; k < s.length; k++) {
    const ch = s[k];
    if (ch === '\\' && s[k + 1] === '|') { cur += '|'; k++; continue; }
    if (ch === '|') { cells.push(cur.trim()); cur = ''; continue; }
    cur += ch;
  }
  cells.push(cur.trim());
  return cells;
}
const isDelimRow = cells => cells.length > 0 && cells.every(c => /^:?-+:?$/.test(c));

// 箇条書きのネスト深さ。インデント2スペースまたはタブ1個 = 1階層
function indentDepth(ws) {
  const tabs = (ws.match(/\t/g) || []).length;
  return tabs + Math.floor((ws.length - tabs) / 2);
}

/* 行 → ブロック列。ブロックは
   {type:'heading', level, text} / {type:'item', depth, text} / {type:'para', text} */
function parseBlocks(text, counters) {
  const lines = text.split('\n');
  const blocks = [];
  let i = 0;
  // YAML front matter（**先頭行**が --- で、--- か ... で閉じる塊）は表に載らない
  // メタデータなので落として警告。閉じが無ければ front matter ではない
  if (lines[0] === '---') {
    let j = 1;
    while (j < lines.length && lines[j] !== '---' && lines[j] !== '...') j++;
    if (j < lines.length) { counters.frontMatter = true; i = j + 1; }
  }
  let para = [];   // 段落の作りかけ（連続行はセル内改行で1セルに）
  const flushPara = () => {
    if (para.length) { blocks.push({ type: 'para', text: para.join('\n') }); para = []; }
  };
  for (; i < lines.length; i++) {
    let line = lines[i];
    if (line.trim() === '') { flushPara(); continue; }
    // コードブロック: フェンスを除いた中身を1セルに（言語名は落とす）。
    // 閉じフェンスが無ければ末尾まで（原文は失わない）
    const fence = /^(```+|~~~+)/.exec(line);
    if (fence) {
      flushPara();
      const marker = fence[1][0] === '`' ? '```' : '~~~';
      let j = i + 1;
      const buf = [];
      while (j < lines.length && !lines[j].startsWith(marker)) { buf.push(lines[j]); j++; }
      blocks.push({ type: 'code', text: buf.join('\n') });
      i = j;   // 閉じフェンス行を消費（for の i++ で次の行へ）
      continue;
    }
    // md 表: | で始まる連続行。区切り行（|---|）は記法なので落とす。
    // 30列を超える表は、その表だけ各行を ' | ' 連結で内容列へ（DX-Q5）
    if (/^\s*\|/.test(line)) {
      flushPara();
      const tbl = [];
      let j = i;
      while (j < lines.length && /^\s*\|/.test(lines[j])) {
        const cells = splitTableRow(lines[j]);
        if (!isDelimRow(cells)) tbl.push(cells);
        j++;
      }
      if (tbl.length) {
        let width = 0;
        for (const cells of tbl) width = Math.max(width, cells.length);
        if (width > MAX_TABLE_COLS) {
          counters.wideTable++;
          for (const cells of tbl) blocks.push({ type: 'para', text: cells.join(' | ') });
        } else {
          blocks.push({ type: 'table', rows: tbl });
        }
      }
      i = j - 1;
      continue;
    }
    // 水平線は表に載せられないので落として件数を出す（setext 見出しは解釈しない →
    // 仕様の限界。--- が本文の直後でも水平線として警告に出るので無言では消えない）
    if (/^ {0,3}(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flushPara(); counters.hr++; continue; }
    // 脚注定義・定義リスト・HTML ブロックは**原文のまま1セル**＋警告（落とさない原則）
    if (/^\[\^[^\]]+\]:/.test(line)) { flushPara(); blocks.push({ type: 'raw', text: line }); counters.foot++; continue; }
    if (/^: /.test(line)) { flushPara(); blocks.push({ type: 'raw', text: line }); counters.def++; continue; }
    if (/^<[a-zA-Z!\/]/.test(line.trim())) {
      flushPara();
      const buf = [];
      let j = i;
      while (j < lines.length && lines[j].trim() !== '') { buf.push(lines[j]); j++; }
      blocks.push({ type: 'raw', text: buf.join('\n') });
      counters.html++;
      i = j - 1;
      continue;
    }
    // 見出しは H6 まで（7個以上の # は本文。CommonMark の上限 = DX-Q7）
    const h = /^(#{1,6}) +(.*)$/.exec(line);
    if (h) { flushPara(); blocks.push({ type: 'heading', level: h[1].length, text: h[2].trim() }); continue; }
    const li = /^([ \t]*)[-*+] +(.*)$/.exec(line);
    if (li) { flushPara(); blocks.push({ type: 'item', depth: indentDepth(li[1]), text: li[2] }); continue; }
    // 番号は 1. 形式に揃えて残す（設計書では番号自体が意味を持つ）
    const ni = /^([ \t]*)(\d+)[.)] +(.*)$/.exec(line);
    if (ni) { flushPara(); blocks.push({ type: 'item', depth: indentDepth(ni[1]), text: ni[2] + '. ' + ni[3] }); continue; }
    // 引用は記号を落として本文へ（段落の一部として続く）
    line = line.replace(/^ {0,3}(> ?)+/, '');
    para.push(line);
  }
  flushPara();
  return blocks;
}

/* ブロック列 → 行データ。行は {levels: [6], content, table: cells|null}。
   階層セルの規則: 前回出力した行より後に設定された階層だけを書く（Excel の空セル慣習）。
   fill オプションで常に現在値を書く */
function assemble(blocks, opts, counters) {
  const rows = [];
  const levels = ['', '', '', '', '', ''];
  const fresh = [false, false, false, false, false, false];
  let maxLevel = 0;
  let curDepth = 0;        // 直近に設定した見出しレベル
  let unemitted = false;   // 見出しを設定してからまだ1行も出していない
  let pending = [];        // split='block' 用（見出し配下の内容の作りかけ）
  let overflow = false;

  const emit = (content, table) => {
    if (rows.length >= MAX_OUTPUT_ROWS) { overflow = true; return; }
    const lv = levels.map((v, k) => (opts.fill ? v : (fresh[k] ? v : '')));
    fresh.fill(false);
    unemitted = false;
    rows.push({ levels: lv, content: content, table: table || null });
  };
  const flushPending = () => {
    if (pending.length) { const c = pending.join('\n'); pending = []; emit(c, null); }
  };
  const content = (text) => {
    if (opts.split === 'block') pending.push(text);
    else emit(text, null);
  };

  for (const b of blocks) {
    if (overflow) break;
    if (b.type === 'heading') {
      flushPending();
      // **内容の無い見出しも1行として出す**（無言で消さない）。
      // 同じ深さ以浅の見出しが来る＝その枝が閉じるのに1行も出ていないなら、素の行を出す
      if (unemitted && b.level <= curDepth) emit('', null);
      levels[b.level - 1] = stripInline(b.text, counters);
      fresh[b.level - 1] = true;
      for (let k = b.level; k < 6; k++) { levels[k] = ''; fresh[k] = false; }
      curDepth = b.level;
      maxLevel = Math.max(maxLevel, b.level);
      unemitted = true;
      continue;
    }
    if (b.type === 'item') { content('　'.repeat(b.depth) + stripInline(b.text, counters)); continue; }
    if (b.type === 'para') { content(stripInline(b.text, counters)); continue; }
    if (b.type === 'code') { content(b.text); continue; }   // コードは原文のまま（strip しない）
    if (b.type === 'raw') { content(b.text); continue; }    // HTML・脚注等も原文のまま
    if (b.type === 'table') {
      // 表は split='block' でも**常に独立した行**（セルにすると列の構造が消える）
      flushPending();
      for (const cells of b.rows) {
        if (overflow) break;
        emit('', cells.map(c => stripInline(c, counters)));
      }
      continue;
    }
  }
  flushPending();
  if (unemitted && !overflow) emit('', null);
  return { rows: rows, depth: maxLevel, overflow: overflow };
}

function levelNamesOf(opts, depth) {
  let names;
  if (opts.names === 'level') {
    names = ['レベル1', 'レベル2', 'レベル3', 'レベル4', 'レベル5', 'レベル6'];
  } else if (opts.names === 'custom') {
    names = String(opts.custom || '').split(',').map(s => s.trim()).filter(Boolean);
    for (let k = names.length; k < 6; k++) names[k] = 'レベル' + (k + 1);  // 不足分は補う
  } else {
    names = LEVEL_NAMES;
  }
  return names.slice(0, depth);
}

function warningsOf(c) {
  const w = [];
  if (c.frontMatter) w.push('front matter（先頭の --- ブロック）は表に載らないため落としました');
  if (c.link) w.push('リンクの URL を' + c.link + '件落としました（表示テキストのみ残しています）');
  if (c.image) w.push('画像を' + c.image + '件 alt テキストにしました');
  if (c.hr) w.push('水平線を' + c.hr + '件落としました');
  if (c.html) w.push('HTML ブロックを' + c.html + '件そのまま1セルに入れました');
  if (c.foot) w.push('脚注定義を' + c.foot + '件そのまま1セルに入れました');
  if (c.def) w.push('定義リストを' + c.def + '件そのまま1セルに入れました');
  if (c.wideTable) w.push('30列を超える表を' + c.wideTable + '件、内容列へ連結しました');
  return w;
}

// Markdown 表: セル内改行は <br>、| は \| に（md の表は生の改行を持てない）
const mdCell = v => v.replace(/\|/g, '\\|').replace(/\n/g, '<br>');
function toMd(value) {
  if (!value.rows.length) return '';
  const line = cells => '| ' + cells.map(mdCell).join(' | ') + ' |';
  return [line(value.header), '|' + value.header.map(() => '---').join('|') + '|']
    .concat(value.rows.map(line)).join('\n');
}
// TSV: タブ・改行・" を含むセルは " で囲む（Tables と同じ規約）。ヘッダー行を含む
const tsvCell = v => /[\t\n"]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
function toTsv(value) {
  if (!value.rows.length) return '';
  return [value.header].concat(value.rows)
    .map(cells => cells.map(tsvCell).join('\t')).join('\n');
}

function padTable(table, cols) {
  const out = (table || []).slice(0, cols);
  while (out.length < cols) out.push('');
  return out;
}

function convert(text, opts) {
  const o = Object.assign({ names: 'default', custom: '', fill: false, split: 'line' }, opts || {});
  const src = String(text == null ? '' : text);
  if (src.length > MAX_INPUT_CHARS) {
    return { ok: false, error: '入力が上限（50万文字）を超えたため処理を中止しました' };
  }
  const counters = { frontMatter: false, link: 0, image: 0, hr: 0, html: 0, foot: 0, def: 0, wideTable: 0 };
  const a = assemble(parseBlocks(src, counters), o, counters);
  if (a.overflow) {
    return { ok: false, error: '出力が上限（5,000行）を超えたため処理を中止しました' };
  }
  let tableCols = 0;
  for (const r of a.rows) if (r.table && r.table.length > tableCols) tableCols = r.table.length;
  const header = levelNamesOf(o, a.depth).concat(['内容']).concat(new Array(tableCols).fill(''));
  const grid = a.rows.map(r =>
    r.levels.slice(0, a.depth).concat([r.content]).concat(padTable(r.table, tableCols)));
  const value = { header: header, rows: grid, depth: a.depth, tableCols: tableCols };
  return { ok: true, value: value, warnings: warningsOf(counters), md: toMd(value), tsv: toTsv(value) };
}

/* ========== UI ========== */

const el = id => document.getElementById(id);
const TOOL = 'doc2xl';

// 引数順は全ツール共通の (kind, text)。class と role の決定は共通核が持つ
function showBanner(kind, text) { ToolUI.banner(el('banner'), kind, text); }

function currentOpts() {
  return {
    names: el('opt-names').value,
    custom: el('opt-names-custom').value,
    fill: el('opt-fill').checked,
    split: el('opt-split').value,
  };
}

// サンプル（空状態の学習用。入力が空のときだけ表示。見出し3階層・ネスト箇条書き・
// 番号付き・md 表・リンク警告が1回の投入で全部見える）
const SAMPLE = [
  '# 機能一覧',
  '## 商品管理',
  '### 商品検索',
  '- 検索条件を入力できる',
  '- 結果を一覧表示する',
  '  - 0件のときは案内を出す',
  '### 商品登録',
  '1. 基本情報を入力する',
  '2. 確認画面で登録する',
  '',
  '| 項目 | 型 | 必須 |',
  '|---|---|---|',
  '| 商品コード | varchar(20) | ○ |',
  '| 商品名 | varchar(100) | ○ |',
  '',
  '## 在庫管理',
  '在庫の照会と引当を行う。',
  '[詳細設計](https://example.com/stock) を参照。',
  '',
].join('\n');

function updateSampleBtn() { el('sample-btn').hidden = el('input').value !== ''; }

let lastConverted = null;   // Excel 用コピー（buildExcelHtml）が参照する直近の変換結果

function run() {
  updateSampleBtn();
  const r = convert(el('input').value, currentOpts());
  if (!r.ok) {
    lastConverted = null;
    el('output').value = '';
    showBanner('warn', r.error);
    return;
  }
  lastConverted = r;
  const tsv = el('fmt-tsv').checked;
  el('output').value = tsv ? r.tsv : r.md;
  el('out-title').textContent = tsv ? '出力（TSV — Excel に貼り付け）' : '出力（Markdown表）';
  showBanner('info', r.warnings.join(' / '));   // 空なら hidden になる
}

// Excel 用 text/html（DX-U7）。fill OFF の空セル（＝直上の見出しの継続）を rowspan の
// 結合セルにする。継続判定は「親列（左）も継続しているときだけ」— 大項目が変わった行の
// 中項目の空欄は新しい空セル。fill ON は全行に値が入るため結合しない（オプションと 1:1）。
// 罫線・ヘッダー背景・文字列化ガードは lib/excel.js の cellStyle が正本
function buildExcelHtml(value) {
  const esc = v => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const rows = value.rows, depth = value.depth, n = rows.length;
  const isCont = [];   // isCont[r][c] = 行 r の階層列 c は直上セルに吸収（出力しない）
  for (let r = 0; r < n; r++) {
    isCont.push([]);
    let parentCont = r > 0;
    for (let c = 0; c < depth; c++) {
      isCont[r][c] = parentCont && rows[r][c] === '';
      parentCont = isCont[r][c];
    }
  }
  const spanOf = (r, c) => {
    let s = 1;
    while (r + s < n && isCont[r + s][c]) s++;
    return s;
  };
  const cell = (v, opts, extra) => {
    const tag = opts.header ? 'th' : 'td';
    return '<' + tag + (extra || '') + ' style="' + ToolExcel.cellStyle(v, opts) + '">' + esc(v) + '</' + tag + '>';
  };
  const parts = ['<table>', '<tr>' + value.header.map(h => cell(h, { header: true })).join('') + '</tr>'];
  for (let r = 0; r < n; r++) {
    const tds = [];
    for (let c = 0; c < rows[r].length; c++) {
      if (c < depth) {
        if (isCont[r][c]) continue;
        const s = spanOf(r, c);
        tds.push(cell(rows[r][c], {}, s > 1 ? ' rowspan="' + s + '" valign="top"' : ''));
      } else {
        tds.push(cell(rows[r][c], {}));
      }
    }
    parts.push('<tr>' + tds.join('') + '</tr>');
  }
  parts.push('</table>');
  return parts.join('');
}

/* ---------- 保存（UI 状態と入力。10万文字超の入力は保存しない） ---------- */

const SAVE_INPUT_MAX = 100000;  // localStorage の容量目安（devpad の 100KB/フィールドと同じ考え方）
function persist() {
  const v = el('input').value;
  ToolStorage.save(TOOL, {
    input: v.length <= SAVE_INPUT_MAX ? v : '',
    names: el('opt-names').value,
    custom: el('opt-names-custom').value,
    fill: el('opt-fill').checked,
    split: el('opt-split').value,
    fmt: el('fmt-tsv').checked ? 'tsv' : 'md',
  });
}
// 既知値だけ受け入れる（未知値が入ると select が空になる。taskboard TB-Q17 と同じ方針）
function restore() {
  const s = ToolStorage.load(TOOL);
  if (!s || typeof s !== 'object') return;
  if (typeof s.input === 'string') el('input').value = s.input;
  if (['default', 'level', 'custom'].includes(s.names)) el('opt-names').value = s.names;
  if (typeof s.custom === 'string') el('opt-names-custom').value = s.custom;
  if (typeof s.fill === 'boolean') el('opt-fill').checked = s.fill;
  if (['line', 'block'].includes(s.split)) el('opt-split').value = s.split;
  if (s.fmt === 'tsv') el('fmt-tsv').checked = true;
}

/* ---------- イベント ---------- */

let debounceTimer = null;
el('input').addEventListener('input', () => {
  updateSampleBtn();
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { persist(); run(); }, 250);
});

function syncCustomVisibility() { el('opt-names-custom').hidden = el('opt-names').value !== 'custom'; }
for (const id of ['opt-names', 'opt-fill', 'opt-split', 'fmt-md', 'fmt-tsv']) {
  el(id).addEventListener('change', () => { syncCustomVisibility(); persist(); run(); });
}
el('opt-names-custom').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { persist(); run(); }, 250);
});

el('sample-btn').addEventListener('click', () => {
  el('input').value = SAMPLE;
  persist();
  run();
});

// 平文コピー。失敗時は出力欄そのものを選択させる（一時 textarea だと実行後に消えて案内が嘘になる）
function copyPlain(text) {
  ToolUI.copy(text, { selectEl: el('output') }).then(ok => {
    if (ok) ToolUI.feedback(el('copy-btn'), '✓ コピーしました');
    else showBanner('info', '出力を選択済みです。Cmd+C でコピーしてください');
  });
}
function doCopy() {
  // デバウンス確定前のコピーで古い出力を渡さない（コピー時に確定 — DX-U6）
  clearTimeout(debounceTimer);
  persist();
  run();
  const text = el('output').value;
  if (text === '') { showBanner('info', 'コピーする内容がありません'); return; }
  // TSV（Excel 向け）のときは text/html（結合セル・書式つき）を併記する（DX-U7。lib/excel.js）。
  // 失敗時は平文コピーへフォールバック
  if (el('fmt-tsv').checked && lastConverted && lastConverted.ok) {
    ToolExcel.copy(buildExcelHtml(lastConverted.value), text).then(
      () => ToolUI.feedback(el('copy-btn'), '✓ コピーしました'),
      () => copyPlain(text));
    return;
  }
  copyPlain(text);
}
el('copy-btn').addEventListener('click', doCopy);
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); doCopy(); }
});

// テストフック（spec 検証用）
window.doc2xl = { convert: convert, buildExcelHtml: buildExcelHtml };

/* ---------- 起動 ---------- */
ToolStorage.mountWarning();
restore();
syncCustomVisibility();
run();
</script>
</body>
</html>
