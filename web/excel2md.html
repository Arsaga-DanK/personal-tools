      <p class="pane-title"><span id="pane-title-in">入力（Excelからの貼り付け / TSV）</span><button type="button" class="sample-btn" id="sample-btn">サンプルを入れる</button></p>
      <textarea id="input" spellcheck="false" placeholder="ここに変換したい表を貼り付け"></textarea>

      <textarea id="output" readonly spellcheck="false"></textarea>

<script src="../lib/storage.js"></script>
<script>
'use strict';

/* ========== 変換ロジック（純関数・UIと同一コードパスをフック公開） ========== */

function normalizeNewlines(text) {
  return text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
}

function padGrid(rows) {
  if (rows.length === 0) return [];
  let cols = 0;
  for (const row of rows) if (row.length > cols) cols = row.length;
  // 疎配列（rowspan 展開で生じる穴）も '' で埋める
  return rows.map(row => Array.from({ length: cols }, (_, i) => row[i] ?? ''));
}

function isEmptyGrid(grid) {
  return grid.length === 0 || grid.every(row => row.every(cell => cell.trim() === ''));
}

// Excel の TSV 方言: 改行を含むセルだけ "..." で囲まれ、内部の "" は " のエスケープ。
// 閉じ引用の直後がタブ/改行/末尾のときだけ引用セルとみなす（既存ツールから流用）。
function parseRows(text) {
  text = normalizeNewlines(text).replace(/\n+$/, '');
  if (text === '') return [];
  if (!text.includes('"')) {
    return text.split('\n').map(line => line.split('\t'));
  }

  const rows = [[]];
  let cell = '';
  let cellStart = true;
  let i = 0;

  const pushCell = () => {
    rows[rows.length - 1].push(cell);
    cell = '';
    cellStart = true;
  };

  while (i < text.length) {
    const ch = text[i];
    if (cellStart && ch === '"') {
      const quoted = tryQuotedCell(text, i);
      if (quoted) {
        cell = quoted.content;
        i = quoted.end;
        cellStart = false;
        continue;
      }
    }
    if (ch === '\t') { pushCell(); i++; continue; }
    if (ch === '\n') { pushCell(); rows.push([]); i++; continue; }
    cell += ch;
    cellStart = false;
    i++;
  }
  pushCell();
  return rows;
}

function tryQuotedCell(text, start) {
  let content = '';
  let i = start + 1;
  while (i < text.length) {
    if (text[i] === '"') {
      if (text[i + 1] === '"') { content += '"'; i += 2; continue; }
      const next = text[i + 1];
      if (next === undefined || next === '\t' || next === '\n') {
        return { content, end: i + 1 };
      }
      return null;
    }
    content += text[i];
    i++;
  }
  return null;
}

function parseTsv(text) {
  return padGrid(parseRows(text));
}

// セル前後の半角/全角スペース・タブのみ除去（セル内改行と中間空白は保持）
function trimCell(value) {
  return value.replace(/^[ \t　]+|[ \t　]+$/g, '');
}

function mdCell(value) {
  return value.replace(/\|/g, '\\|').replace(/\n/g, '<br>');
}

// alignments は列ごとの 'none'|'left'|'center'|'right'。省略・不足分は none（区切り行 ---）
function gridToMarkdown(grid, hasHeader, alignments) {
  if (grid.length === 0) return '';
  const cols = grid[0].length;
  const aligns = alignments || [];
  const sepCell = a => ({ left: ':---', center: ':---:', right: '---:' }[a] || '---');
  const line = cells => '| ' + cells.join(' | ') + ' |';

  const lines = [];
  let body = grid;
  if (hasHeader) {
    lines.push(line(grid[0].map(mdCell)));
    body = grid.slice(1);
  } else {
    lines.push(line(Array(cols).fill('')));
  }
  lines.push(line(Array.from({ length: cols }, (_, i) => sepCell(aligns[i]))));
  for (const row of body) lines.push(line(row.map(mdCell)));
  return lines.join('\n');
}

const MAX_INPUT_CHARS = 2000000; // 超過時は処理せず理由を表示（性能ガード①）
const MAX_HTML_CELLS = 200000;   // HTML 展開後のセル数上限（性能ガード②）

// 変換の入口。UI もテストもこの関数を通る。
// 戻り値: { markdown, warnings: [{type: 'warn'|'info', message}], cols, firstRow }
// cols/firstRow は揃えバーの描画用（列数とラベル元になる1行目）
function convert(text, opts) {
  const options = Object.assign({ header: true, trim: true, alignments: [] }, opts);
  const warnings = [];
  const empty = { markdown: '', warnings, cols: 0, firstRow: [] };
  if (text.length > MAX_INPUT_CHARS) {
    warnings.push({ type: 'warn', message: '入力が上限（200万文字）を超えたため処理を中止しました' });
    return empty;
  }
  const rows = parseRows(text);
  if (rows.length === 0) return empty;

  if (!normalizeNewlines(text).includes('\t')) {
    warnings.push({ type: 'info', message: 'タブ区切りが見つからないため1列の表として変換しました' });
  }

  let cols = 0;
  let uneven = false;
  for (const row of rows) {
    if (cols !== 0 && row.length !== cols) uneven = true;
    if (row.length > cols) cols = row.length;
  }
  if (uneven) {
    warnings.push({ type: 'warn', message: '行によって列数が異なるため空セルで補完しました（最大' + cols + '列）' });
  }

  let grid = padGrid(rows);
  if (options.trim) grid = grid.map(row => row.map(trimCell));
  return {
    markdown: gridToMarkdown(grid, options.header, options.alignments),
    warnings,
    cols: grid[0].length,
    firstRow: grid[0].slice(),
  };
}

/* ========== MD→TSV 方向（旧版 excel2md/excel2md.html から移植） ========== */

// 区切り行（| :--- | ---: | など）なら列ごとの揃えを返し、区切り行でなければ null
function parseMarkdownSeparator(line) {
  if (!line.includes('|') || !line.includes('-')) return null;
  const cells = line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|');
  const alignments = [];
  for (const c of cells) {
    const s = c.trim();
    if (!/^:?-+:?$/.test(s)) return null;
    const left = s.startsWith(':');
    const right = s.endsWith(':');
    alignments.push(left && right ? 'center' : right ? 'right' : left ? 'left' : 'none');
  }
  return alignments;
}

function splitMarkdownRow(line) {
  const s = line.trim();
  const cells = [];
  let cur = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '\\' && s[i + 1] === '|') { cur += '|'; i++; continue; }
    if (ch === '|') { cells.push(cur); cur = ''; continue; }
    cur += ch;
  }
  cells.push(cur);
  if (s.startsWith('|')) cells.shift();
  if (/(^|[^\\])\|$/.test(s)) cells.pop();
  return cells.map(c => c.trim().replace(/<br\s*\/?\s*>/gi, '\n'));
}

// 「| を含む行」の直後に区切り行、が現れる位置をテーブル先頭とみなす。
// 戻り値: { grid, alignments } / 認識できなければ null
function parseMarkdownTable(text) {
  const lines = normalizeNewlines(text).split('\n').map(l => l.trim()).filter(l => l !== '');
  let headerIdx = -1;
  let alignments = null;
  for (let i = 0; i < lines.length - 1; i++) {
    if (!lines[i].includes('|')) continue;
    alignments = parseMarkdownSeparator(lines[i + 1]);
    if (alignments) { headerIdx = i; break; }
  }
  if (headerIdx === -1) return null;

  const rows = [splitMarkdownRow(lines[headerIdx])];
  for (let i = headerIdx + 2; i < lines.length; i++) {
    if (!lines[i].includes('|')) break;
    rows.push(splitMarkdownRow(lines[i]));
  }
  const grid = padGrid(rows);
  const cols = grid[0].length;
  while (alignments.length < cols) alignments.push('none');
  return { grid, alignments: alignments.slice(0, cols) };
}

function gridToTsv(grid) {
  const tsvCell = v => /[\t\n"]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  return grid.map(row => row.map(tsvCell).join('\t')).join('\n');
}

function escapeHtml(value) {
  return value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Excel 貼り付け用の <table>。セル内改行は mso-data-placement:same-cell 付き <br> で
// 同一セル内改行として維持される（Excel/MSO 独自CSS）
function gridToHtmlTable(grid, hasHeader, alignments) {
  const cellHtml = v => escapeHtml(v).replace(/\n/g, '<br style="mso-data-placement:same-cell">');
  const attrs = i => {
    const a = alignments[i];
    return (a && a !== 'none') ? ' align="' + a + '" style="text-align:' + a + '"' : '';
  };
  const rowHtml = (row, tag) =>
    '<tr>' + row.map((v, i) => '<' + tag + attrs(i) + '>' + cellHtml(v) + '</' + tag + '>').join('') + '</tr>';
  const parts = ['<table>'];
  grid.forEach((row, r) => parts.push(rowHtml(row, hasHeader && r === 0 ? 'th' : 'td')));
  parts.push('</table>');
  return parts.join('');
}

// MD→TSV の変換入口。UI もテストもこの関数を通る。
// 戻り値: { tsv, html, alignments, warnings }
function convertFromMd(text, opts) {
  const options = Object.assign({ header: true }, opts);
  const warnings = [];
  if (text.length > MAX_INPUT_CHARS) {
    warnings.push({ type: 'warn', message: '入力が上限（200万文字）を超えたため処理を中止しました' });
    return { tsv: '', html: '', alignments: [], warnings };
  }
  if (text.trim() === '') return { tsv: '', html: '', alignments: [], warnings };
  const parsed = parseMarkdownTable(text);
  if (!parsed) {
    warnings.push({ type: 'warn', message: 'Markdownの表として認識できませんでした（ヘッダー行と区切り行が必要です）' });
    return { tsv: '', html: '', alignments: [], warnings };
  }
  // TSV は列揃えを表現できない。HTML 経路（Excel用にコピー）では align 属性で保持される
  if (parsed.alignments.some(a => a !== 'none')) {
    warnings.push({ type: 'info', message: '揃え指定（:--- 等）はTSVでは失われます（「Excel用にコピー」のHTMLには反映されます）' });
  }
  return {
    tsv: gridToTsv(parsed.grid),
    html: gridToHtmlTable(parsed.grid, options.header, parsed.alignments),
    alignments: parsed.alignments,
    warnings,
  };
}

/* ========== text/html の取り込み・結合セル展開（旧版から移植） ========== */

// 不可視文字はエスケープ表記ではなく文字コードで生成する（ソースへの実文字混入を防ぐ）
const BR_SENTINEL = String.fromCharCode(0);   // NUL: <br> の一時マーカー
const NBSP = String.fromCharCode(160);        // &nbsp; の実体
const BR_RESTORE_RE = new RegExp(' ?' + BR_SENTINEL + ' ?', 'g');

function htmlCellText(el) {
  const clone = el.cloneNode(true);
  // Excel は <br> とソース上の生改行を併記するため、<br> をセンチネルにして生改行と区別する
  clone.querySelectorAll('br').forEach(br => br.replaceWith(BR_SENTINEL));
  let text = clone.textContent || '';
  // ソース上の生の空白・改行は、ブラウザの描画と同じく1個のスペースに潰す
  text = text.replace(/[ \t\r\n]+/g, ' ');
  text = text.split(NBSP).join(' ');
  // <br> 由来のセンチネルだけを改行として復元（前後に残ったスペースは除去）
  text = text.replace(BR_RESTORE_RE, '\n');
  return text.trim();
}

// クリップボードの text/html から最初の <table> を grid に展開する。
// rowspan/colspan は占有マトリクスで展開し、結合範囲の全セルに同じ値を繰り返す。
// 戻り値 { grid, merged, tooLarge }:
//   grid=null / tooLarge=false → <table> が無い（呼び出し側は既定の貼り付けへ）
//   grid=null / tooLarge=true  → 展開後セル数が maxCells 超過
// セル数は展開ループの内側で数える。1セルの rowspan×colspan だけで数千万セルに
// なりうる（ブラウザのクランプ上限は rowspan 65534・colspan 1000）ため text/html の
// 文字数では守れず、rowspan の張り出しで実列数も増えるため事前見積もりでも守れない。
function parseHtmlTable(html, maxCells) {
  const limit = typeof maxCells === 'number' ? maxCells : Infinity;
  const table = new DOMParser().parseFromString(html, 'text/html').querySelector('table');
  if (!table) return { grid: null, merged: false, tooLarge: false };

  const grid = [];
  const occupied = [];
  const ensureRow = r => {
    if (!grid[r]) { grid[r] = []; occupied[r] = []; }
  };
  let merged = false;
  let filled = 0;

  const rows = table.rows;
  for (let r = 0; r < rows.length; r++) {
    ensureRow(r);
    let c = 0;
    for (const cellEl of rows[r].cells) {
      while (occupied[r][c]) c++;
      const rowSpan = Math.max(1, cellEl.rowSpan || 1);
      const colSpan = Math.max(1, cellEl.colSpan || 1);
      if (rowSpan > 1 || colSpan > 1) merged = true;
      filled += rowSpan * colSpan;
      if (filled > limit) return { grid: null, merged, tooLarge: true };
      const value = htmlCellText(cellEl);
      for (let dr = 0; dr < rowSpan; dr++) {
        ensureRow(r + dr);
        for (let dc = 0; dc < colSpan; dc++) {
          grid[r + dr][c + dc] = value;
          occupied[r + dr][c + dc] = true;
        }
      }
      c += colSpan;
    }
  }
  return { grid: padGrid(grid), merged, tooLarge: false };
}

// 貼り付けの text/html 取り込み入口。UI もテストもこの関数を通る。
// 戻り値: { tsv, merged, warnings } — tsv=null なら取り込まず既定の貼り付けに委ねる
function convertFromHtml(html) {
  const warnings = [];
  const skip = () => ({ tsv: null, merged: false, warnings });
  if (!html) return skip();
  if (html.length > MAX_INPUT_CHARS) {
    warnings.push({ type: 'warn', message: 'HTMLの表が上限（200万文字）を超えたため取り込みを中止しました。通常の貼り付けとして処理します' });
    return skip();
  }
  const parsed = parseHtmlTable(html, MAX_HTML_CELLS);
  if (parsed.tooLarge) {
    warnings.push({ type: 'warn', message: 'HTMLの表が上限（20万セル）を超えたため取り込みを中止しました。通常の貼り付けとして処理します' });
    return skip();
  }
  if (!parsed.grid || isEmptyGrid(parsed.grid)) return skip();
  warnings.push({
    type: 'info',
    message: parsed.merged ? 'HTMLの表を取り込み、結合セルを展開しました' : 'HTMLの表として取り込みました',
  });
  return { tsv: gridToTsv(parsed.grid), merged: parsed.merged, warnings };
}

/* ========== テスト用フック ========== */

window.excel2md = {
  parseTsv, gridToMarkdown, convert,
  parseMarkdownTable, gridToTsv, gridToHtmlTable, convertFromMd,
  parseHtmlTable, convertFromHtml,
};

/* ========== UI ========== */

const $ = id => document.getElementById(id);
const el = {
  input: $('input'),
  output: $('output'),
  banner: $('banner'),
  optHeader: $('opt-header'),
  optTrim: $('opt-trim'),
  copyBtn: $('copy-btn'),
  copyHint: $('copy-hint'),
  sampleBtn: $('sample-btn'),
  alignBar: $('align-bar'),
  alignChips: $('align-chips'),
  alignNote: $('align-note'),
};

const TOOL = 'excel2md';

let direction = 'tsv2md';
let lastHtml = '';        // MD→TSV の「Excel用にコピー」で使う HTML 表
let colAligns = [];       // 列ごとの揃え（永続化しない。列が0になったらリセット）
let importNotice = null;  // 直近の text/html 取り込み通知 { warnings, text }（text は通知が有効な入力値）

const DIRECTION_UI = {
  tsv2md: { inTitle: '入力（Excelからの貼り付け / TSV）', outTitle: '出力（Markdown）', copyLabel: 'Markdownをコピー' },
  md2tsv: { inTitle: '入力（Markdownテーブル）', outTitle: '出力（Excel貼り付け用 TSV）', copyLabel: 'Excel用にコピー' },
};

function applyDirectionUI() {
  const ui = DIRECTION_UI[direction];
  $('pane-title-in').textContent = ui.inTitle;
  $('pane-title-out').textContent = ui.outTitle;
  el.copyBtn.textContent = ui.copyLabel;
  el.optTrim.disabled = direction === 'md2tsv'; // trim は TSV→MD のみ有効
}

function currentOpts() {
  return { header: el.optHeader.checked, trim: el.optTrim.checked, alignments: colAligns };
}

function saveOpts() {
  ToolStorage.save(TOOL, { header: el.optHeader.checked, trim: el.optTrim.checked, direction });
}

function showBanner(warnings) {
  if (warnings.length === 0) { el.banner.hidden = true; return; }
  const hasWarn = warnings.some(w => w.type === 'warn');
  el.banner.className = 'banner ' + (hasWarn ? 'banner-warn' : 'banner-info');
  el.banner.setAttribute('role', hasWarn ? 'alert' : 'status'); // ui.css の ARIA 規約
  el.banner.textContent = warnings.map(w => w.message).join(' / ');
  el.banner.hidden = false;
}

// 入力が逆方向の形式に見えるときの切替提案（自動では反転しない）
function maybeSuggestSwitch(warnings) {
  const text = el.input.value;
  if (text.trim() === '' || text.length > MAX_INPUT_CHARS) return;
  if (direction === 'tsv2md' && !text.includes('\t') && parseMarkdownTable(text)) {
    warnings.push({ type: 'info', message: 'Markdownの表を検出しました。方向「MD→TSV」への切替を検討してください' });
  } else if (direction === 'md2tsv' && text.includes('\t') && !parseMarkdownTable(text)) {
    warnings.push({ type: 'info', message: 'タブ区切りを検出しました。方向「TSV→MD」への切替を検討してください' });
  }
}

/* ---------- 列の揃え指定バー ---------- */

const ALIGN_CYCLE = ['none', 'left', 'center', 'right'];
const ALIGN_LABEL = { none: '−', left: '左', center: '中央', right: '右' };
const ALIGN_MAX_COLS = 60; // 超過分はチップを出さない（大きな表での再構築コストを抑える）

function columnLabel(index, firstRow) {
  const raw = el.optHeader.checked ? (firstRow[index] || '') : '';
  const oneLine = raw.replace(/\s+/g, ' ').trim();
  if (oneLine === '') return '列' + (index + 1);
  return oneLine.length > 8 ? oneLine.slice(0, 8) + '…' : oneLine;
}

function renderAlignBar(cols, firstRow) {
  const shown = Math.min(cols, ALIGN_MAX_COLS);
  el.alignBar.hidden = !(direction === 'tsv2md' && shown > 0);
  if (el.alignBar.hidden) {
    el.alignChips.textContent = '';
    el.alignNote.hidden = true;
    return;
  }

  // 列数が同じならチップ要素を作り直さずラベルだけ更新する。作り直すとクリックした
  // 要素が DOM から外れてフォーカスが body に戻り、キーボードで連続切替できなくなる
  const chips = el.alignChips.children;
  if (chips.length !== shown) {
    el.alignChips.textContent = '';
    for (let c = 0; c < shown; c++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'align-chip';
      btn.dataset.col = String(c);
      btn.title = 'クリックで揃えを切替（なし→左→中央→右）';
      el.alignChips.appendChild(btn);
    }
  }
  for (let c = 0; c < shown; c++) {
    chips[c].textContent = columnLabel(c, firstRow) + ': ' + ALIGN_LABEL[colAligns[c] || 'none'];
  }
  el.alignNote.hidden = cols <= ALIGN_MAX_COLS;
}

el.alignChips.addEventListener('click', e => {
  const btn = e.target.closest('.align-chip');
  if (!btn) return;
  const col = Number(btn.dataset.col);
  const current = colAligns[col] || 'none';
  colAligns[col] = ALIGN_CYCLE[(ALIGN_CYCLE.indexOf(current) + 1) % ALIGN_CYCLE.length];
  run();
});

/* ---------- 変換の実行 ---------- */

// 取り込み通知は「その通知を生んだ入力値」の間だけ変換警告と併記する。
// 手入力で入力値が変われば自然に失効するため、貼り付けが input イベントを何回発火しても
// 影響されない（Chrome の execCommand('insertText') は複数行テキストで行ごとに発火する）。
function noticeWarnings() {
  return importNotice && importNotice.text === el.input.value ? importNotice.warnings : [];
}

function run() {
  if (direction === 'tsv2md') {
    const result = convert(el.input.value, currentOpts());
    el.output.value = result.markdown;
    lastHtml = '';
    if (result.cols === 0) colAligns.length = 0;
    renderAlignBar(result.cols, result.firstRow);
    maybeSuggestSwitch(result.warnings);
    showBanner(noticeWarnings().concat(result.warnings));
  } else {
    const result = convertFromMd(el.input.value, { header: el.optHeader.checked });
    el.output.value = result.tsv;
    lastHtml = result.html;
    renderAlignBar(0, []); // MD→TSV では揃えバーを出さない（揃えは区切り行から読む）
    maybeSuggestSwitch(result.warnings);
    showBanner(noticeWarnings().concat(result.warnings));
  }
}

let debounceTimer = null;
el.input.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(run, 200);
  updateSampleBtn();
});

/* ---------- Excel からの貼り付け（text/html 経路） ---------- */

// 貼り付け位置に挿入する。execCommand('insertText') はブラウザの undo 履歴に乗るため優先し、
// 使えない場合だけ setRangeText にフォールバックする。
function insertAtSelection(ta, text) {
  ta.focus();
  let ok = false;
  try { ok = document.execCommand('insertText', false, text); } catch (_) { ok = false; }
  if (!ok) ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end');
}

// Excel は結合セルを text/plain では「先頭セルに値・残りは空」で出すため、
// text/html を解析して結合範囲の全セルに値を繰り返す。取り込めないときは
// preventDefault せず既定の貼り付け（text/plain）に委ねる。
el.input.addEventListener('paste', e => {
  importNotice = null;
  if (direction !== 'tsv2md' || !e.clipboardData) return;

  const result = convertFromHtml(e.clipboardData.getData('text/html'));

  if (result.tsv === null) {
    if (result.warnings.length === 0) return; // 表が無い等。無言で既定の貼り付けへ
    // 取り込みを中止した理由はこの場で出す（text/plain が空だと input イベントも来ない）。
    // 既定の貼り付けはこのハンドラの後に反映されるため、通知の紐づけは次のタスクで行う
    showBanner(result.warnings);
    setTimeout(() => {
      importNotice = { warnings: result.warnings, text: el.input.value };
      clearTimeout(debounceTimer);
      run();
    }, 0);
    return;
  }

  e.preventDefault();
  insertAtSelection(el.input, result.tsv);
  importNotice = { warnings: result.warnings, text: el.input.value };
  clearTimeout(debounceTimer);
  run();
  updateSampleBtn();
});

/* ---------- サンプル・ショートカット・オプション ---------- */

// サンプル投入（空状態の学習用。入力が空のときだけ表示。方向に応じた例を投入）
const SAMPLES = {
  tsv2md: '名前\t担当\t備考\n田中\t設計\t"レビュー済\n8/4 修正反映"\n鈴木\t実装\t-',
  md2tsv: '| 名前 | 担当 | 備考 |\n| --- | --- | --- |\n| 田中 | 設計 | レビュー済<br>8/4 修正反映 |\n| 鈴木 | 実装 | - |',
};
function updateSampleBtn() {
  el.sampleBtn.hidden = el.input.value !== '';
}
el.sampleBtn.addEventListener('click', () => {
  el.input.value = SAMPLES[direction];
  importNotice = null;
  clearTimeout(debounceTimer);
  run();
  updateSampleBtn();
});

// Cmd/Ctrl+Enter でコピー（頻用操作のキーボード導線）
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    el.copyBtn.click();
  }
});

function onOptionChange() {
  saveOpts();
  run();
}
el.optHeader.addEventListener('change', onOptionChange);
el.optTrim.addEventListener('change', onOptionChange);

for (const radio of document.querySelectorAll('input[name="direction"]')) {
  radio.addEventListener('change', () => {
    direction = radio.value;
    // Markdown 表は構文上ヘッダー確定のため自動 ON（旧版挙動）
    if (direction === 'md2tsv') el.optHeader.checked = true;
    applyDirectionUI();
    saveOpts();
    run();
  });
}

/* ---------- コピー ---------- */

// コピー: click ハンドラ内で同期的に開始する（Safari のユーザー操作失効対策）。
// 確実な保険は「選択状態にする」こと。
let copyTimer = null;
function copyFeedback() {
  el.copyBtn.textContent = '✓ コピーしました';
  el.copyBtn.classList.add('copied');
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => {
    el.copyBtn.textContent = DIRECTION_UI[direction].copyLabel;
    el.copyBtn.classList.remove('copied');
  }, 1500);
}

// copy イベントを横取りして任意 MIME を書き込む execCommand 方式（旧版から移植）。
// Chrome の navigator.clipboard.write は HTML をサニタイズし
// mso-data-placement（セル内改行の維持に必須）が落ちるため execCommand を先行させる。
function execCopy(fill) {
  const handler = e => {
    e.preventDefault();
    fill(e.clipboardData);
  };
  document.addEventListener('copy', handler, { capture: true });
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
  document.removeEventListener('copy', handler, { capture: true });
  return ok;
}

function copyForExcel(html, tsv) {
  const ok = execCopy(dt => {
    dt.setData('text/html', html);
    dt.setData('text/plain', tsv);
  });
  if (ok) return Promise.resolve();
  if (navigator.clipboard && window.ClipboardItem) {
    return navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([tsv], { type: 'text/plain' }),
    })]);
  }
  return Promise.reject(new Error('clipboard unavailable'));
}
function copySelectFallback() {
  el.output.focus();
  el.output.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
  if (ok) {
    copyFeedback();
  } else {
    // 変換警告バナーを潰さないよう、コピー案内は専用表示に出す
    el.copyHint.textContent = '出力を選択済みです。Cmd+C でコピーしてください。';
  }
}
el.copyBtn.addEventListener('click', () => {
  clearTimeout(debounceTimer); // デバウンス中の旧内容コピー防止（同期確定してから書く）
  run();
  el.copyHint.textContent = '';
  if (el.output.value === '') {
    el.copyHint.textContent = '出力がありません';
    return;
  }
  if (direction === 'md2tsv') {
    // Excel用: text/html + text/plain を同時に書く（execCommand 先行はクリックハンドラ内で同期実行）
    copyForExcel(lastHtml, el.output.value).then(copyFeedback).catch(copySelectFallback);
  } else if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(el.output.value)
      .then(copyFeedback)
      .catch(copySelectFallback);
  } else {
    copySelectFallback();
  }
});

// 設定復元 → 初期描画
(function init() {
  const saved = ToolStorage.load(TOOL);
  if (saved && typeof saved === 'object') {
    if (typeof saved.header === 'boolean') el.optHeader.checked = saved.header;
    if (typeof saved.trim === 'boolean') el.optTrim.checked = saved.trim;
    if (saved.direction === 'tsv2md' || saved.direction === 'md2tsv') {
      direction = saved.direction;
      document.querySelector('input[name="direction"][value="' + direction + '"]').checked = true;
    }
  }
  applyDirectionUI();
  ToolStorage.mountWarning();
  updateSampleBtn();
  run();
})();
</script>
</body>
</html>
