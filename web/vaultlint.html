<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Vault (vaultlint)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧹%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../lib/ui.css">
<style>
  /* vaultlint 固有: 結果表のみ */
  .issue-block { margin: 14px 0; }
  .issue-block h2 { font-size: 14px; margin: 0 0 6px; }
  .issue-ok { color: var(--muted); font-size: 13px; }
  .table-wrap { overflow-x: auto; }
  .issue-block table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
  .issue-block th, .issue-block td {
    border: 1px solid var(--border); padding: 4px 8px; text-align: left;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .issue-block th { background: var(--panel); font-family: inherit; }
  /* 表を読みやすく（段6 — coding-rules「見た目と操作の決まり」1〜5）。名前が主・フォルダは薄く・ファイル名の罠だけ等幅 */
  .issue-block td.vl-file, .issue-block td.vl-date { font-family: inherit; }
  .issue-block td.vl-file.raw { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .vl-name { font-weight: 600; white-space: pre; }
  .vl-dir { color: var(--muted); font-size: 11.5px; margin-left: 8px; }
  .issue-block h2 { display: flex; align-items: baseline; gap: 6px; }
  .vl-fold { border: 0; background: none; padding: 0 2px; color: var(--muted); cursor: pointer; font-size: 12px; box-shadow: none; }
  .vl-fold:hover { transform: none; box-shadow: none; }
  /* vault のフォルダ構成の設定（利用者ごとに違うためコードに持たない） */
  #settings { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: flex-end; margin: 10px 0; }
  #settings label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  #settings input { min-width: 200px; }
  #settings .note { flex-basis: 100%; font-size: 12px; color: var(--muted); margin: 0; }
  /* ⋯ の中の設定（段6）。縦に並べて欄は幅いっぱい */
  .more-panel #settings { flex-direction: column; align-items: stretch; margin: 0; width: min(440px, 80vw); }
  .more-panel #settings input { min-width: 0; width: 100%; box-sizing: border-box; }
</style>
</head>
<body>
<main class="app">
  <!-- 見出し2行（段5 — lib/ui.css の .app-head・.app-controls。coding-rules「見た目と操作の決まり」2）。説明は h1 の title -->
  <header class="app-head">
    <p class="tool-header"><a href="../index.html">← ツール一覧</a><span class="autosave-note">検査は読み取りのみ。修復は選択して承認したときだけ書き込みます</span></p>
    <h1 title="vault の健全性チェック — リンク切れ・添付消失・ファイル名の罠・Inbox のデイリーを検出し、承認した修復を実行">Check Vault</h1>
    <span class="spacer"></span>
    <details class="more-menu" id="vl-more">
      <summary title="vault のフォルダ構成（非公開・Inbox・アーカイブ先・イシュー）">⋯</summary>
      <div class="more-panel">
        <div id="settings">
        <label>非公開フォルダ（読み込まない）
          <input type="text" id="cfg-private" placeholder="例: 91_Private, Personal（カンマ区切り）">
        </label>
        <label>Inbox フォルダ
          <input type="text" id="cfg-inbox" placeholder="例: 00_Inbox（空なら棚卸ししない）">
        </label>
        <label>アーカイブ先
          <input type="text" id="cfg-archive" placeholder="例: 90_Archive/daily（空なら移動しない）">
        </label>
        <label>イシューのフォルダ
          <input type="text" id="cfg-issue" placeholder="例: 04_Issues（空なら閉じたイシューを検査しない）">
        </label>
        <label>閉じたイシューの移動先
          <input type="text" id="cfg-closed" placeholder="例: 10_Projects/{project}/Archive, 20_Areas/{project}/Archive, 90_Archive/{YYYY}（左から、案件フォルダがあるものを使う）">
        </label>
        <button id="cfg-save">設定を保存</button>
        <p class="note">vault のフォルダ構成は人によって違うため設定で持ちます。<code>.obsidian</code> <code>.git</code> <code>.trash</code> は設定に関係なく常に除外します。</p>
      </div>
      </div>
    </details>
  </header>

  <div class="app-controls">
    <button class="primary" id="pick">vault フォルダを選択</button>
    <button id="rescan" hidden>再スキャン</button>
    <button id="copy-btn" hidden>報告をコピー</button>
    <span class="spacer"></span>
    <label class="toggle" id="commit-label" hidden title="修復の取り消し手段は git だけです。実行前に obsidian-git でコミットしてください"><input type="checkbox" id="commit-confirm"> obsidian-git でコミット済み</label>
    <button id="fix-btn" hidden>選択した修復を実行</button>
    <span class="muted" id="env-note" hidden></span>
  </div>


  <div class="banner" id="banner" hidden></div>
  <div id="runlog" class="issue-block" hidden></div>
  <p class="summary" id="summary"></p>
  <div id="results"></div>
</main>

<script src="../lib/ui.js"></script>
<script src="../lib/storage.js"></script>
<script src="../lib/tools.js"></script>
<script src="../lib/launcher.js"></script>
<script src="../lib/config.js"></script>
<script src="../lib/edit.js"></script>
<script src="vaultlint/engine.js"></script>
<script src="vaultlint/fix.js"></script>
<script src="vaultlint/ui.js"></script>
<script src="vaultlint/fsa.js"></script>
<script>
'use strict';
/* ---------- 起動（**すべての定義の後**に置く。2026-10-05 に節ごとのファイルへ分けた — web/vaultlint/*.js） ---------- */
ToolStorage.mountWarning();
applyConfig(ToolConfig.all());
if (CFG.privateDirs === null) el('vl-more').open = true;   // 初回（非公開フォルダが未設定）は ⋯ を開いて設定を見せる（段6 — VL-L1）

/* ========== テスト用フック ========== */

window.vaultlint = {
  lint,
  excludeFiles,
  planFixes,
  applyFixes,
  canDeleteLine,
  test: {
    /* 設定を差し込む（**保存はしない** — テスト間で localStorage を汚さない）。
       省略したキーは「未設定」に戻るので、各テストは前提とする構成を明示的に宣言する。
       正規化は lib/config.js と同じ関数を通す（UI 経由と同じ値になることを保証する） */
    setConfig(cfg) {
      const c = cfg || {};
      applyConfig({
        privateDirs: ToolConfig.normDirList(c.privateDirs),   // undefined → null（未設定）
        inboxDir: ToolConfig.normDir(c.inboxDir),
        archiveDir: ToolConfig.normDir(c.archiveDir),
        issueDir: ToolConfig.normDir(c.issueDir),
        closedDir: ToolConfig.normDir(c.closedDir),
      });
    },
    // FSA を通さず、アダプタ層の除外 → lint → 描画 → （実行ボタンは）メモリ適用まで通す
    // （VL-U1〜U3・U5。today 省略時は Inbox 棚卸しなし。cfg 省略時は全て未設定）
    run(files, today, cfg) {
      window.vaultlint.test.setConfig(cfg);
      const disk = new Map(files.map(f => [f.path, typeof f.text === 'string' ? f.text : null]));
      const scan = () => {
        const fs = [...disk.entries()].map(([path, text]) => (text === null ? { path } : { path, text }));
        const { kept, excluded } = excludeFiles(fs);
        const res = lint(kept, today);
        render(res, excluded, kept);
        return res;
      };
      currentAdapter = memoryAdapter(disk);
      requestWrite = null;
      rescanFn = async () => { scan(); };
      return scan();
    },
  },
};

ToolLauncher.mount();   // ☰ ツール / Cmd+Ctrl+K で引き出しメニュー（lib/launcher.js）
</script>
</body>
</html>
