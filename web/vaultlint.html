<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Vault (vaultlint)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧹%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../lib/ui.css">
<style>
  /* vaultlint 固有: 結果表のみ */
  .issue-block { margin: 14px 0; }
  .issue-block h2 { font-size: 14px; margin: 0 0 6px; }
  .issue-ok { color: var(--muted); font-size: 13px; }
  .table-wrap { overflow-x: auto; }
  .issue-block table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
  .issue-block th, .issue-block td {
    border: 1px solid var(--border); padding: 4px 8px; text-align: left;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .issue-block th { background: var(--panel); font-family: inherit; }
  /* vault のフォルダ構成の設定（利用者ごとに違うためコードに持たない） */
  #settings { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: flex-end; margin: 10px 0; }
  #settings label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  #settings input { min-width: 200px; }
  #settings .note { flex-basis: 100%; font-size: 12px; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main class="app">
  <p class="tool-header"><a href="../index.html">← ツール一覧</a><span class="autosave-note">検査は読み取りのみ。修復は選択して承認したときだけ書き込みます</span></p>
  <h1>Check Vault</h1>
  <p class="subtitle">vault の健全性チェック — リンク切れ・添付消失・ファイル名の罠・Inbox のデイリーを検出し、承認した修復を実行</p>

  <div class="toolbar">
    <button class="primary" id="pick">vault フォルダを選択</button>
    <button id="rescan" hidden>再スキャン</button>
    <button id="copy-btn" hidden>報告をコピー</button>
    <span class="spacer"></span>
    <label class="toggle" id="commit-label" hidden title="修復の取り消し手段は git だけです。実行前に obsidian-git でコミットしてください"><input type="checkbox" id="commit-confirm"> obsidian-git でコミット済み</label>
    <button id="fix-btn" hidden>選択した修復を実行</button>
    <span class="muted" id="env-note" hidden></span>
  </div>

  <div id="settings">
    <label>非公開フォルダ（読み込まない）
      <input type="text" id="cfg-private" placeholder="例: 91_Private, Personal（カンマ区切り）">
    </label>
    <label>Inbox フォルダ
      <input type="text" id="cfg-inbox" placeholder="例: 00_Inbox（空なら棚卸ししない）">
    </label>
    <label>アーカイブ先
      <input type="text" id="cfg-archive" placeholder="例: 90_Archive/daily（空なら移動しない）">
    </label>
    <label>イシューのフォルダ
      <input type="text" id="cfg-issue" placeholder="例: 04_Issues（空なら閉じたイシューを検査しない）">
    </label>
    <label>閉じたイシューの移動先
      <input type="text" id="cfg-closed" placeholder="例: 90_Archive/{YYYY}（{YYYY} は閉じた年。空なら移動しない）">
    </label>
    <button id="cfg-save">設定を保存</button>
    <p class="note">vault のフォルダ構成は人によって違うため設定で持ちます。<code>.obsidian</code> <code>.git</code> <code>.trash</code> は設定に関係なく常に除外します。</p>
  </div>

  <div class="banner" id="banner" hidden></div>
  <div id="runlog" class="issue-block" hidden></div>
  <p class="summary" id="summary"></p>
  <div id="results"></div>
</main>

<script src="../lib/ui.js"></script>
<script src="../lib/storage.js"></script>
<script src="../lib/tools.js"></script>
<script src="../lib/launcher.js"></script>
<script src="../lib/config.js"></script>
<script>
'use strict';

/* ========== 純関数（フックと UI が同一コードパス） ========== */

const MAX_FILES = 20000;        // 性能ガード: ファイル総数
const MAX_MD_CHARS = 2000000;   // 性能ガード: 1ファイル。超過はその場で読み飛ばして警告
// 設定に関係なく常に除外する（Obsidian と Git の内部データ。読む意味が無く、壊すと危険）
const ALWAYS_EXCLUDE = new Set(['.obsidian', '.git', '.trash']);

/* 利用者ごとの設定（lib/config.js）。vault のフォルダ構成は人によって違うのでコードに持たない。
   **privateDirs === null は「未設定」**で、空配列（＝除外なしと決めた）とは区別する —
   未設定のまま走査すると非公開ノートを読み込む事故になるため、設定が済むまで
   フォルダ選択を無効化する（旧「91_Private をコードで強制除外」の一般化）。 */
let CFG = { privateDirs: null, inboxDir: '', archiveDir: '', issueDir: '', closedDir: '' };

// 読み込み自体しないディレクトリ名の集合（常時除外 ＋ 設定した非公開フォルダ）
function excludeDirSet() {
  const s = new Set(ALWAYS_EXCLUDE);
  for (const d of (CFG.privateDirs || [])) s.add(d);
  return s;
}

const nfcLower = s => s.normalize('NFC').toLowerCase();
const basenameOf = path => path.slice(path.lastIndexOf('/') + 1);

// ファイル名の罠（badNames）。不可視文字はコードポイントで組む（実文字混入を防ぐ）
function nameReasons(seg, isFile) {
  const reasons = [];
  if (isFile && /^\.md$/i.test(seg)) { reasons.push('空ベース名'); return reasons; }
  if (seg.includes('  ')) reasons.push('連続半角スペース');
  if (seg.includes('\u3000')) reasons.push('全角スペース');
  if (seg.includes('\u00A0')) reasons.push('NBSP');
  const stem = isFile ? seg.replace(/\.[^.]+$/, '') : seg;
  if (seg.startsWith(' ') || stem.endsWith(' ')) reasons.push('先頭・末尾スペース');
  return reasons;
}

// フェンス外の行だけを列挙（インラインコードは `` に潰して渡す — VL-13）。
// リンク走査・未転記タスク検出・rename の追随が同じ規則を共有する
function forEachCodeFreeLine(text, cb) {
  const lines = String(text || '').split('\n');
  let fence = null;
  for (let li = 0; li < lines.length; li++) {
    const fm = /^(```+|~~~+)/.exec(lines[li]);
    if (fm) {
      const marker = fm[1][0] === '`' ? '```' : '~~~';
      if (fence === null) fence = marker;
      else if (lines[li].startsWith(fence)) fence = null;
      continue;
    }
    if (fence !== null) continue;
    cb(lines[li].replace(/`[^`]*`/g, '``'), li);
  }
}

// 生の `- [ ]` の行数（フェンス外）。デイリーの未転記タスク検出（VL-14）
function countPendingTasks(text) {
  let n = 0;
  forEachCodeFreeLine(text, line => { if (/^\s*- \[ \] /.test(line)) n++; });
  return n;
}

// files = [{path, text?}]（text は md のみ）・today = 'YYYY-MM-DD'（Inbox 棚卸し用。省略可）
// → { ok, issues, stats, warnings } / { ok:false, error }
function lint(files, today) {
  if (files.length > MAX_FILES) {
    return { ok: false, error: 'ファイル数が上限（20,000）を超えたため処理を中止しました' };
  }
  const warnings = [];
  const issues = { brokenLinks: [], missingAttachments: [], badNames: [], dupBasenames: [], inbox: [], closedIssues: [] };

  // インデックス（比較は NFC + 小文字化 — spec「リンク解決規則」）
  const mdByBase = new Map();
  const mdByPath = new Set();
  const otherByBase = new Set();
  let notes = 0;
  for (const f of files) {
    if (/\.md$/i.test(f.path)) {
      notes++;
      const base = nfcLower(basenameOf(f.path).replace(/\.md$/i, ''));
      if (!mdByBase.has(base)) mdByBase.set(base, []);
      mdByBase.get(base).push(f.path);
      mdByPath.add(nfcLower(f.path.replace(/\.md$/i, '')));
    } else {
      otherByBase.add(nfcLower(basenameOf(f.path)));
    }
  }

  // badNames: ファイル名とフォルダ名の両方（同じフォルダは1回だけ見る）
  const seenSeg = new Set();
  for (const f of files) {
    const parts = f.path.split('/');
    parts.forEach((seg, idx) => {
      const segPath = parts.slice(0, idx + 1).join('/');
      if (seenSeg.has(segPath)) return;
      seenSeg.add(segPath);
      for (const reason of nameReasons(seg, idx === parts.length - 1)) {
        issues.badNames.push({ path: segPath, reason });
      }
    });
  }

  const resolveNote = target => {
    const t = nfcLower(target.replace(/\.md$/i, ''));
    return target.includes('/') ? mdByPath.has(t) : mdByBase.has(t);
  };
  // 添付はベース名で解決（spec: 厳密な最短パス選択はしない）
  const resolveAttachment = target => otherByBase.has(nfcLower(basenameOf(target)));

  // リンク走査（wiki リンクと md 画像/添付リンク）
  let links = 0;
  // **パス修飾なしで指されたノート名**を集める（重複ベース名の実害判定に使う — VL-Q12）
  const linkedBare = new Set();
  const WIKI_RE = /(!?)\[\[([^\[\]]+)\]\]/g;
  const MDLINK_RE = /!\[[^\]]*\]\(([^)\s]+)\)/g;
  for (const f of files) {
    if (!/\.md$/i.test(f.path) || typeof f.text !== 'string') continue;
    if (f.text.length > MAX_MD_CHARS) {
      warnings.push(f.path + ' は上限（200万文字）を超えるためリンクを走査しませんでした');
      continue;
    }
    // コードフェンス内・インラインコード内は走査しない（VL-13。Obsidian はコード内の
    // リンクを解決しない — shell の [[ -f x ]] 等の誤検出を防ぐ）。未閉フェンスは末尾まで
    forEachCodeFreeLine(f.text, (line, li) => {
      let m;
      WIKI_RE.lastIndex = 0;
      while ((m = WIKI_RE.exec(line))) {
        links++;
        const embed = m[1] === '!';
        let inner = m[2].split('|')[0];               // エイリアスを剥がす
        const hashIdx = inner.indexOf('#');           // 見出し・ブロック（#^）を剥がす
        const target = (hashIdx >= 0 ? inner.slice(0, hashIdx) : inner).trim();
        if (target === '') continue;                  // [[#見出し]] = 自ファイル参照
        const isAttachment = embed && /\.[A-Za-z0-9]{1,8}$/.test(target) && !/\.md$/i.test(target);
        if (isAttachment) {
          if (!resolveAttachment(target)) issues.missingAttachments.push({ file: f.path, line: li + 1, target });
        } else {
          if (!target.includes('/')) linkedBare.add(nfcLower(target.replace(/\.md$/i, '')));
          if (!resolveNote(target)) issues.brokenLinks.push({ file: f.path, line: li + 1, target });
        }
      }
      MDLINK_RE.lastIndex = 0;
      while ((m = MDLINK_RE.exec(line))) {
        const raw = m[1];
        if (/^[a-z][a-z0-9+.-]*:/i.test(raw)) continue;   // http(s): data: obsidian: 等は対象外
        links++;
        let target;
        try { target = decodeURIComponent(raw); } catch (_) { target = raw; }
        if (!resolveAttachment(target)) issues.missingAttachments.push({ file: f.path, line: li + 1, target: raw });
      }
    });
  }

  /* dupBasenames（VL-Q12 で判定を変更・2026-09-24）:
     **同名であること自体は問題ではない。**問題は「パス修飾なしのリンクがその名前を指していて、
     どれに解決されるか決まらない」こと。旧実装は同名を全部出していたため、
     `.claude/commands` のミラーや 1on1 の人別フォルダなど**直してはいけないもの**が並び、
     実測では18件すべてが実害ゼロだった（パス無しリンク0件）。報告が読まれなくなる。
     → **実際に曖昧なリンクが存在するものだけ**を出す */
  for (const paths of mdByBase.values()) {
    if (paths.length < 2) continue;
    const base = basenameOf(paths[0]).replace(/\.md$/i, '');
    if (!linkedBare.has(nfcLower(base))) continue;
    issues.dupBasenames.push({ base: base, paths: paths.slice() });
  }

  // Inbox 棚卸し（VL-14）: 設定した Inbox フォルダ**直下**の純デイリーだけ。7日より古いものを候補に出す
  // （週次の成果物はノートとして残らないため「週次より古い」は判定できない — 日数ルール）。
  // トピックノートは件数のみ（内容判断はツールの領分外）。
  // **CFG.inboxDir が空なら検査自体をしない** — フォルダ構成は利用者ごとに違うため
  const DAILY_RE = /^(\d{4}-\d{2}-\d{2})\.md$/;
  const AGE_DAYS = 7;
  const dayOf = ymd => Date.UTC(+ymd.slice(0, 4), +ymd.slice(5, 7) - 1, +ymd.slice(8, 10)) / 86400000;
  let inboxOthers = 0;
  if (today && CFG.inboxDir) {
    const prefix = CFG.inboxDir + '/';
    for (const f of files) {
      if (!f.path.startsWith(prefix)) continue;
      const rest = f.path.slice(prefix.length);
      // 直下のみ対象（サブフォルダのノートは純デイリーとして扱わない）
      const m = rest.includes('/') ? null : DAILY_RE.exec(rest);
      if (!m) { if (/\.md$/i.test(f.path)) inboxOthers++; continue; }
      const age = dayOf(today) - dayOf(m[1]);
      if (age <= AGE_DAYS) continue;
      issues.inbox.push({ path: f.path, date: m[1], age, pending: countPendingTasks(f.text) });
    }
  }

  // 閉じたイシュー（VL-22・VL-Q13）: 設定した issueDir **直下**の md で frontmatter が status: closed のもの。
  // 閉じるのは Check Issue（status/closed を書く）、ここは片づけだけ。**issueDir が空なら検査自体をしない**
  if (CFG.issueDir) {
    const prefix = CFG.issueDir + '/';
    for (const f of files) {
      if (!f.path.startsWith(prefix) || !/\.md$/i.test(f.path) || typeof f.text !== 'string') continue;
      if (f.path.slice(prefix.length).includes('/')) continue;      // 直下のみ
      const fm = frontmatterOf(f.text);
      if (!fm || fm.status !== 'closed') continue;
      issues.closedIssues.push({ path: f.path, closed: fm.closed || '', verdict: fm.verdict || '' });
    }
  }

  return { ok: true, issues, stats: { files: files.length, notes, links, inboxOthers }, warnings };
}

// 先頭の frontmatter を key: value のスカラーだけ読む（status / closed / verdict で足りる）
function frontmatterOf(text) {
  const m = String(text || '').replace(/\r\n?/g, '\n').match(/^---\n([\s\S]*?)\n---(?:\n|$)/);
  if (!m) return null;
  const out = {};
  for (const l of m[1].split('\n')) {
    const k = l.match(/^([A-Za-z_][\w-]*):\s*(.*)$/);
    if (k) out[k[1]] = k[2].trim();
  }
  return out;
}

// 閉じたイシューの移動先: closedDir の {YYYY} を閉じた年（無ければ今年）に置き換える
function closedDirFor(closed) {
  const y = (closed && /^\d{4}/.test(closed)) ? closed.slice(0, 4) : todayStr().slice(0, 4);
  return CFG.closedDir.replace(/\{YYYY\}/g, y);
}

// アダプタ層の除外（UI/テスト経路の共通入口。FSA 走査は同じ集合をディレクトリ単位で飛ばす）
function excludeFiles(files) {
  const ex = excludeDirSet();
  let excluded = 0;
  const kept = [];
  for (const f of files) {
    if (f.path.split('/').some(seg => ex.has(seg))) { excluded++; continue; }
    kept.push(f);
  }
  return { kept, excluded };
}

/* ========== 修復エンジン（掟②「提案 → 承認 → 実行」の実装。VL-15〜19） ========== */

const REMOVE_LINE = Symbol('remove');
const LINK_ONLY_RE = /^\s*!?\[\[[^\[\]]+\]\]\s*$/;

// 行がそのリンクだけか（行削除を許すか — VL-16）
function canDeleteLine(files, path, lineNo) {
  const f = files.find(x => x.path === path);
  if (!f || typeof f.text !== 'string') return false;
  const line = f.text.split('\n')[lineNo - 1];
  return typeof line === 'string' && LINK_ONLY_RE.test(line);
}

// 選択された修復から変更計画を作る（**副作用なし** — 何をどう変えるかだけを返す）
function planFixes(files, selections) {
  const byPath = new Map(files.map(f => [f.path, f]));
  const texts = new Map();   // path -> 作業中テキスト（複数修復を同じファイルに重ねる）
  const getText = p => (texts.has(p) ? texts.get(p)
    : (byPath.has(p) && typeof byPath.get(p).text === 'string' ? byPath.get(p).text : null));
  const moves = [];
  const skipped = [];
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  const editLine = (path, lineNo, fn) => {
    const cur = getText(path);
    if (cur === null) { skipped.push({ path, reason: 'ファイルが見つかりません' }); return; }
    const lines = cur.split('\n');
    if (lineNo < 1 || lineNo > lines.length) {
      skipped.push({ path, reason: lineNo + '行目が見つかりません' });
      return;
    }
    const next = fn(lines[lineNo - 1]);
    if (next === null) return;   // fn 側で skipped 済み
    if (next === REMOVE_LINE) lines.splice(lineNo - 1, 1);
    else lines[lineNo - 1] = next;
    texts.set(path, lines.join('\n'));
  };

  // 行削除は行番号がずれるので最後に・大きい行番号から適用する
  const dels = selections.filter(s => s.type === 'deleteLine')
    .sort((a, b) => (a.file === b.file ? b.line - a.line : (a.file < b.file ? -1 : 1)));
  const rest = selections.filter(s => s.type !== 'deleteLine');

  for (const sel of rest) {
    if (sel.type === 'textify') {
      // [[x]]→x・[[x|別名]]→別名（内容は失わない — 既定の修復）
      editLine(sel.file, sel.line, line => line.replace(/(!?)\[\[([^\[\]]+)\]\]/g, (all, bang, inner) => {
        const pipe = inner.indexOf('|');
        const head = pipe >= 0 ? inner.slice(0, pipe) : inner;
        const t = head.split('#')[0].trim();
        if (t !== sel.target) return all;
        return pipe >= 0 ? inner.slice(pipe + 1).trim() : t;
      }));
    } else if (sel.type === 'removeAttachment') {
      // 参照トークンだけ除去（行は残す。隣接する片側の空白も1つ除去 — VL-17）
      editLine(sel.file, sel.line, line => {
        const core = '(?:!\\[\\[' + escRe(sel.target) + '\\]\\]|!\\[[^\\]]*\\]\\(' + escRe(sel.target) + '\\))';
        const next = line.replace(new RegExp(' ' + core + '|' + core + ' |' + core), '');
        return /\S/.test(next) ? next : '';
      });
    } else if (sel.type === 'rename') {
      planRename(sel, byPath, moves, skipped, getText, texts, files);
    } else if (sel.type === 'archiveDaily') {
      if (!CFG.archiveDir) {
        skipped.push({ path: sel.from, reason: 'アーカイブ先フォルダが未設定です' });
        continue;
      }
      const to = CFG.archiveDir + '/' + basenameOf(sel.from);
      if (byPath.has(to) || moves.some(mv => mv.to === to)) {
        skipped.push({ path: sel.from, reason: '移動先に同名があります: ' + to });
      } else {
        moves.push({ from: sel.from, to });
      }
    } else if (sel.type === 'archiveIssue') {
      // 閉じたイシュー（VL-Q13）: closedDir の {YYYY} を閉じた年に。フォルダは適用側が階層ごとに作る
      if (!CFG.closedDir) {
        skipped.push({ path: sel.from, reason: '閉じたイシューの移動先が未設定です' });
        continue;
      }
      const to = closedDirFor(sel.closed) + '/' + basenameOf(sel.from);
      if (byPath.has(to) || moves.some(mv => mv.to === to)) {
        skipped.push({ path: sel.from, reason: '移動先に同名があります: ' + to });
      } else {
        moves.push({ from: sel.from, to });
      }
    }
  }
  for (const sel of dels) {
    editLine(sel.file, sel.line, line => {
      if (LINK_ONLY_RE.test(line)) return REMOVE_LINE;
      skipped.push({ path: sel.file, reason: sel.line + '行目にリンク以外の内容があるため削除しません' });
      return null;
    });
  }

  const writes = [];
  for (const [path, after] of texts) {
    const before = byPath.get(path).text;
    if (after !== before) writes.push({ path, before, after });
  }
  return { writes, moves, skipped,
    summary: { writes: writes.length, moves: moves.length, skipped: skipped.length } };
}

// リネーム＋リンク元の追随（フェンス内は触らない — VL-18）
function planRename(sel, byPath, moves, skipped, getText, texts, files) {
  if (byPath.has(sel.to) || moves.some(mv => mv.to === sel.to)) {
    skipped.push({ path: sel.from, reason: 'リネーム先が既に存在します: ' + sel.to });
    return;
  }
  moves.push({ from: sel.from, to: sel.to });
  const oldKey = nfcLower(basenameOf(sel.from).replace(/\.md$/i, ''));
  const newBase = basenameOf(sel.to).replace(/\.md$/i, '');
  for (const f of files) {
    if (!/\.md$/i.test(f.path) || typeof f.text !== 'string') continue;
    const lines = getText(f.path).split('\n');
    let fence = null;
    let changed = false;
    for (let i = 0; i < lines.length; i++) {
      const fm = /^(```+|~~~+)/.exec(lines[i]);
      if (fm) {
        const marker = fm[1][0] === '`' ? '```' : '~~~';
        if (fence === null) fence = marker;
        else if (lines[i].startsWith(fence)) fence = null;
        continue;
      }
      if (fence !== null) continue;
      const next = lines[i].replace(/(!?)\[\[([^\[\]]+)\]\]/g, (all, bang, inner) => {
        const pipe = inner.indexOf('|');
        const head = pipe >= 0 ? inner.slice(0, pipe) : inner;
        const tail = pipe >= 0 ? inner.slice(pipe) : '';
        const hash = head.indexOf('#');
        const pathPart = (hash >= 0 ? head.slice(0, hash) : head).trim();
        const hashPart = hash >= 0 ? head.slice(hash) : '';
        const slash = pathPart.lastIndexOf('/');
        const base = slash >= 0 ? pathPart.slice(slash + 1) : pathPart;
        if (nfcLower(base.replace(/\.md$/i, '')) !== oldKey) return all;
        const prefix = slash >= 0 ? pathPart.slice(0, slash + 1) : '';
        return bang + '[[' + prefix + newBase + hashPart + tail + ']]';
      });
      if (next !== lines[i]) { lines[i] = next; changed = true; }
    }
    if (changed) texts.set(f.path, lines.join('\n'));
  }
}

// 計画をアダプタ経由で適用。**書き込み直前に再読して読み込み時点と NFC 比較**（VL-19。
// taskboard の外部変更検知と同じ考え方 — 外部で変わっていたらそのファイルはスキップして報告）
async function applyFixes(files, plan, adapter) {
  const orig = new Map(files.map(f => [f.path, typeof f.text === 'string' ? f.text : null]));
  const results = { written: [], moved: [], skipped: plan.skipped.slice() };
  for (const w of plan.writes) {
    const now = await adapter.read(w.path);
    const was = orig.get(w.path);
    if (now === null || was === null || now.normalize('NFC') !== was.normalize('NFC')) {
      results.skipped.push({ path: w.path, reason: 'スキャン後に外部で変更されています（再スキャンしてください）' });
      continue;
    }
    await adapter.write(w.path, w.after);
    results.written.push(w.path);
  }
  for (const mv of plan.moves) {
    try {
      await adapter.move(mv.from, mv.to);
      results.moved.push(mv);
    } catch (e) {
      results.skipped.push({ path: mv.from, reason: '移動に失敗しました: ' + (e && e.message ? e.message : String(e)) });
    }
  }
  return results;
}

// リネームの提案名（罠の文字を除去。空ベース名・変化なしは提案できない → null）
function renameSuggestion(path, byPath) {
  if (!byPath.has(path)) return null;   // フォルダは対象外（影響が大きすぎる — spec）
  const slash = path.lastIndexOf('/');
  const dir = slash >= 0 ? path.slice(0, slash + 1) : '';
  const name = path.slice(slash + 1);
  const dot = name.lastIndexOf('.');
  if (dot <= 0) return null;            // 空ベース名（.md）等は自動提案しない
  const ext = name.slice(dot);
  const stem = name.slice(0, dot)
    .replace(/\u00A0/g, ' ').replace(/\u3000/g, ' ').replace(/ {2,}/g, ' ').trim();
  if (stem === '' || stem + ext === name) return null;
  const to = dir + stem + ext;
  return byPath.has(to) ? null : to;    // 既存と衝突する提案は出さない
}

/* ========== FSA 走査（Chrome 系限定・読み取り専用） ========== */

let dirHandle = null;

async function scanVault(handle) {
  const files = [];
  let excluded = 0;
  const ex = excludeDirSet();   // 走査開始時に固定（途中で設定が変わっても1回の走査は一貫させる）
  async function walk(h, prefix) {
    for await (const entry of h.values()) {
      if (entry.kind === 'directory') {
        if (ex.has(entry.name)) { excluded++; continue; }   // 読み込み自体しない
        await walk(entry, prefix + entry.name + '/');
      } else {
        const path = prefix + entry.name;
        if (/\.md$/i.test(entry.name)) {
          const file = await entry.getFile();
          files.push({ path, text: await file.text() });
        } else {
          files.push({ path });
        }
        if (files.length > MAX_FILES) return;   // lint 側のガードで理由を表示する
      }
    }
  }
  await walk(handle, '');
  return { files, excluded };
}

async function runScan() {
  showBanner('info', 'スキャン中…');
  try {
    const { files, excluded } = await scanVault(dirHandle);
    showBanner('info', '');
    render(lint(files, todayStr()), excluded, files);
    currentAdapter = fsaAdapter(dirHandle);
    // 二段階権限（最小権限）: 検査は read のまま、修復の実行時に初めて readwrite を要求する
    requestWrite = async () =>
      (await dirHandle.requestPermission({ mode: 'readwrite' })) === 'granted';
    rescanFn = runScan;
    el('rescan').hidden = false;
  } catch (e) {
    showBanner('error', 'スキャンに失敗しました: ' + (e && e.message ? e.message : String(e)));
  }
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
    '-' + String(d.getDate()).padStart(2, '0');
}

/* ---------- 修復の実行（掟②: 提案 → 承認 → 実行） ---------- */

let currentAdapter = null;   // FSA / テスト用メモリ
let requestWrite = null;     // 実行直前の権限昇格（FSA のみ）
let rescanFn = null;

async function getDirByPath(root, path, opts) {
  const parts = path.split('/');
  let dir = root;
  for (let i = 0; i < parts.length - 1; i++) dir = await dir.getDirectoryHandle(parts[i], opts);
  return { dir, name: parts[parts.length - 1] };
}

function fsaAdapter(root) {
  return {
    read: async p => {
      try {
        const { dir, name } = await getDirByPath(root, p);
        const fh = await dir.getFileHandle(name);
        return await (await fh.getFile()).text();
      } catch (_) { return null; }
    },
    write: async (p, text) => {
      const { dir, name } = await getDirByPath(root, p, { create: true });
      const fh = await dir.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(text);
      await w.close();
    },
    // 移動は「コピー → サイズ検証 → 元を削除」の順（バイナリ安全・失敗時に元が残る）
    move: async (from, to) => {
      const src = await getDirByPath(root, from);
      const srcFh = await src.dir.getFileHandle(src.name);
      const file = await srcFh.getFile();
      const dst = await getDirByPath(root, to, { create: true });
      const dstFh = await dst.dir.getFileHandle(dst.name, { create: true });
      const w = await dstFh.createWritable();
      await w.write(file);
      await w.close();
      const back = await dstFh.getFile();
      if (back.size !== file.size) throw new Error('コピー検証に失敗しました');
      await src.dir.removeEntry(src.name);
    },
  };
}

function memoryAdapter(disk) {
  return {
    read: async p => (disk.has(p) ? disk.get(p) : null),
    write: async (p, t) => { disk.set(p, t); },
    move: async (from, to) => {
      if (!disk.has(from)) throw new Error('見つかりません: ' + from);
      if (disk.has(to)) throw new Error('移動先に同名があります: ' + to);
      disk.set(to, disk.get(from));
      disk.delete(from);
    },
  };
}

function buildRunLogMd(plan, results) {
  const out = ['# vault-lint 実行ログ', '',
    '書き換え ' + results.written.length + '・移動 ' + results.moved.length +
    '・スキップ ' + results.skipped.length, ''];
  for (const mv of results.moved) out.push('- 移動: ' + mv.from + ' → ' + mv.to);
  for (const s of results.skipped) out.push('- スキップ: ' + (s.path || '') + ' — ' + s.reason);
  out.push('');
  // 変更前の内容を残す（git コミットが唯一の undo — 手元の復元素材として）
  for (const w of plan.writes) {
    if (!results.written.includes(w.path)) continue;
    out.push('## 変更前: ' + w.path, '', '```', w.before, '```', '');
  }
  return out.join('\n');
}

function renderRunLog(plan, results) {
  const host = el('runlog');
  host.textContent = '';
  host.hidden = false;
  const h = document.createElement('h2');
  h.textContent = '実行結果 — 書き換え ' + results.written.length + '・移動 ' +
    results.moved.length + '・スキップ ' + results.skipped.length;
  host.appendChild(h);
  const ul = document.createElement('ul');
  const li = t => {
    const e = document.createElement('li');
    e.textContent = t;
    ul.appendChild(e);
  };
  for (const p of results.written) li('書き換え: ' + p);
  for (const mv of results.moved) li('移動: ' + mv.from + ' → ' + mv.to);
  for (const s of results.skipped) li('スキップ: ' + (s.path || '') + ' — ' + s.reason);
  host.appendChild(ul);
  const copy = document.createElement('button');
  copy.type = 'button';
  copy.textContent = 'ログをコピー（変更前の内容つき）';
  const md = buildRunLogMd(plan, results);
  copy.addEventListener('click', () => {
    ToolUI.copy(md).then(ok => { if (ok) ToolUI.feedback(copy, '✓ コピーしました'); });
  });
  host.appendChild(copy);
}

async function executeFixes() {
  if (!lastScan || !currentAdapter) return;
  if (!el('commit-confirm').checked) {
    showBanner('warn', '実行前に obsidian-git でコミットし、「コミット済み」にチェックを入れてください（取り消し手段は git だけです）');
    return;
  }
  const selections = fixControls.map(c => c.get()).filter(Boolean);
  if (!selections.length) { showBanner('info', '修復が選択されていません（各行の「修復」列で選べます）'); return; }
  const plan = planFixes(lastScan.files, selections);
  const targets = plan.writes.map(w => '書き換え: ' + w.path)
    .concat(plan.moves.map(mv => '移動: ' + mv.from + ' → ' + mv.to));
  const ok = window.confirm('次の変更を実行します（書き換え ' + plan.writes.length + '・移動 ' +
    plan.moves.length + '・スキップ予定 ' + plan.skipped.length + '）:\n\n' +
    targets.slice(0, 20).join('\n') + (targets.length > 20 ? '\n…ほか ' + (targets.length - 20) + '件' : '') +
    '\n\n取り消しは git のみです。実行しますか？');
  if (!ok) return;
  if (requestWrite && !(await requestWrite())) {
    showBanner('error', '書き込み権限が得られませんでした');
    return;
  }
  showBanner('info', '実行中…');
  const results = await applyFixes(lastScan.files, plan, currentAdapter);
  renderRunLog(plan, results);
  showBanner('info', '');
  if (rescanFn) await rescanFn();
}

        inboxDir: ToolConfig.normDir(c.inboxDir),
        archiveDir: ToolConfig.normDir(c.archiveDir),
        issueDir: ToolConfig.normDir(c.issueDir),
        closedDir: ToolConfig.normDir(c.closedDir),
      });
    },
    // FSA を通さず、アダプタ層の除外 → lint → 描画 → （実行ボタンは）メモリ適用まで通す
    // （VL-U1〜U3・U5。today 省略時は Inbox 棚卸しなし。cfg 省略時は全て未設定）
    run(files, today, cfg) {
      window.vaultlint.test.setConfig(cfg);
      const disk = new Map(files.map(f => [f.path, typeof f.text === 'string' ? f.text : null]));
      const scan = () => {
        const fs = [...disk.entries()].map(([path, text]) => (text === null ? { path } : { path, text }));
        const { kept, excluded } = excludeFiles(fs);
        const res = lint(kept, today);
        render(res, excluded, kept);
        return res;
      };
      currentAdapter = memoryAdapter(disk);
      requestWrite = null;
      rescanFn = async () => { scan(); };
      return scan();
    },
  },
};

ToolLauncher.mount();   // ☰ ツール / Cmd+Ctrl+K で引き出しメニュー（lib/launcher.js）
</script>
</body>
