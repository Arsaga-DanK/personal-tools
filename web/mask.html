<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mask</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🫥%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../lib/ui.css">
<style>
  /* mask 固有: キャンバスとドロップ領域 */
  #drop {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 48px 16px;
    text-align: center;
    color: var(--muted);
    background: var(--panel);
  }
  #drop.dragover { border-color: var(--accent); color: var(--accent); }
  #canvas-wrap { position: relative; display: inline-block; max-width: 100%; }
  #canvas {
    display: block;
    max-width: 100%;
    height: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    cursor: crosshair;
    touch-action: none;
  }
  /* 選択枠のオーバーレイ。出力 PNG に混入させないため別キャンバス（MK-Q5） */
  #overlay {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
</style>
</head>
<body>
<main class="app-wide">
  <p class="tool-header"><a href="../index.html">← ツール一覧</a><span class="autosave-note">画像は保存されません（この画面の中だけ・機密画像を残さない）</span></p>
  <h1>Mask</h1>
  <p class="subtitle">スクショのマスキングと注釈 — 貼り付け → モザイク/黒塗り → 矢印・枠で説明 → 置いた図形は「選択」で移動・削除 → PNG コピー。ぼかしは復元リスクがあるため非搭載</p>

  <div class="toolbar" id="tools">
    <label class="toggle"><input type="radio" name="tool" value="select"> 選択</label>
    <label class="toggle"><input type="radio" name="tool" value="mosaic" checked> モザイク</label>
    <label class="toggle"><input type="radio" name="tool" value="fill"> 黒塗り</label>
    <label class="toggle"><input type="radio" name="tool" value="rect"> 枠</label>
    <label class="toggle"><input type="radio" name="tool" value="arrow"> 矢印</label>
    <label class="toggle"><input type="radio" name="tool" value="text"> テキスト</label>
    <label>粒度: <select id="mosaic-size">
      <option value="8">粗8</option>
      <option value="16" selected>標準16</option>
      <option value="24">粗い24</option>
    </select></label>
    <input type="text" id="text-input" placeholder="テキスト（クリックで配置）" size="18">
    <span class="spacer"></span>
    <button id="undo-btn">元に戻す</button>
    <button id="clear-btn">注釈をクリア</button>
    <button class="primary" id="copy-btn" title="Cmd/Ctrl+Enter">PNG をコピー</button>
    <button id="save-btn">PNG 保存</button>
    <label><input type="file" id="file-input" accept="image/*" hidden><button id="file-btn" type="button">画像を開く…</button></label>
  </div>

  <div class="banner" id="banner" hidden></div>

  <div id="drop">ここに画像を <b>Ctrl+V で貼り付け</b>、またはドラッグ＆ドロップ／［画像を開く…］</div>
  <div id="canvas-wrap">
    <canvas id="canvas" hidden></canvas>
    <canvas id="overlay" hidden></canvas>
  </div>
</main>

<script src="../lib/ui.js"></script>
<script>
'use strict';

const el = id => document.getElementById(id);
function showBanner(kind, text) { ToolUI.banner(el('banner'), kind, text); }

const MAX_SIDE = 6000;   // 取り込みガード（canvas メモリ保護。超過は中止して理由表示）
const RED = '#dd2222';   // 注釈色（枠・矢印・テキストで共通）

/* ========== 操作モデル（元画像 + ops。再描画 = 元画像から順に適用 — 非破壊） ========== */

const orig = document.createElement('canvas');   // 元画像の保持
let hasImage = false;
let ops = [];

/* Undo はスナップショット履歴（MK-Q6）: 変更（追加・移動・削除・クリア）の前に
   ops のコピーを積む。「ops を1つ pop」のままだと移動の取り消しが「図形ごと消える」になる */
let history = [];
const HISTORY_MAX = 200;
function snapshot() {
  history.push(ops.map(o => Object.assign({}, o)));
  if (history.length > HISTORY_MAX) history.shift();
}
function undo() {
  if (history.length === 0) return;
  ops = history.pop();
  selIndex = null;   // 戻した状態に対して古い添字を残さない
  redraw();
  drawOverlay();
}

let selIndex = null;   // 選択中の図形（ops の添字）。null = 未選択

const canvas = el('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const overlay = el('overlay');
const octx = overlay.getContext('2d');
const FONT = 'bold 20px -apple-system, "Hiragino Sans", sans-serif';

function applyOp(op) {
  if (op.type === 'fill') {
    ctx.fillStyle = '#000000';
    ctx.fillRect(op.x, op.y, op.w, op.h);
  } else if (op.type === 'mosaic') {
    // 縮小 → imageSmoothingEnabled:false で拡大（依存ゼロのピクセル化 — MK-02）
    const size = op.size || 16;
    const sw = Math.max(1, Math.ceil(op.w / size));
    const sh = Math.max(1, Math.ceil(op.h / size));
    const tmp = document.createElement('canvas');
    tmp.width = sw; tmp.height = sh;
    const tctx = tmp.getContext('2d');
    tctx.imageSmoothingEnabled = false;
    tctx.drawImage(canvas, op.x, op.y, op.w, op.h, 0, 0, sw, sh);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(tmp, 0, 0, sw, sh, op.x, op.y, op.w, op.h);
    ctx.imageSmoothingEnabled = true;
  } else if (op.type === 'rect') {
    ctx.strokeStyle = RED;
    ctx.lineWidth = 3;
    ctx.strokeRect(op.x, op.y, op.w, op.h);
  } else if (op.type === 'arrow') {
    ctx.strokeStyle = RED;
    ctx.fillStyle = RED;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(op.x1, op.y1);
    ctx.lineTo(op.x2, op.y2);
    ctx.stroke();
    // 矢印の頭（進行方向に向いた三角形）
    const ang = Math.atan2(op.y2 - op.y1, op.x2 - op.x1);
    const L = 12;
    ctx.beginPath();
    ctx.moveTo(op.x2, op.y2);
    ctx.lineTo(op.x2 - L * Math.cos(ang - 0.5), op.y2 - L * Math.sin(ang - 0.5));
    ctx.lineTo(op.x2 - L * Math.cos(ang + 0.5), op.y2 - L * Math.sin(ang + 0.5));
    ctx.closePath();
    ctx.fill();
  } else if (op.type === 'text') {
    ctx.fillStyle = RED;
    ctx.font = FONT;
    ctx.fillText(op.text, op.x, op.y);
  }
}

/* ========== 選択・編集（v2 — spec「選択・編集」） ========== */

function opBounds(op) {
  if (op.type === 'arrow') {
    return { x: Math.min(op.x1, op.x2) - 6, y: Math.min(op.y1, op.y2) - 6,
             w: Math.abs(op.x2 - op.x1) + 12, h: Math.abs(op.y2 - op.y1) + 12 };
  }
  if (op.type === 'text') {
    ctx.font = FONT;
    const w = ctx.measureText(op.text).width;
    return { x: op.x - 2, y: op.y - 20, w: w + 4, h: 26 };   // baseline が op.y・20px フォント
  }
  return { x: op.x, y: op.y, w: op.w, h: op.h };
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  const t = len2 === 0 ? 0 : Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function hitOp(op, x, y) {
  if (op.type === 'arrow') return distToSegment(x, y, op.x1, op.y1, op.x2, op.y2) <= 8;
  const b = opBounds(op);
  return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
}

// 最前面（後に置いた方）優先（MK-07）
function hitTest(x, y) {
  for (let i = ops.length - 1; i >= 0; i--) {
    if (hitOp(ops[i], x, y)) return i;
  }
  return null;
}

function moveOpBy(op, dx, dy) {
  if (op.type === 'arrow') { op.x1 += dx; op.y1 += dy; op.x2 += dx; op.y2 += dy; }
  else { op.x += dx; op.y += dy; }
}

// 選択枠はオーバーレイにだけ描く — メインキャンバス（= 出力 PNG）に混入させない（MK-Q5）
function drawOverlay() {
  octx.clearRect(0, 0, overlay.width, overlay.height);
  if (selIndex === null || !ops[selIndex]) return;
  const b = opBounds(ops[selIndex]);
  octx.strokeStyle = '#5e81ac';
  octx.lineWidth = 2;
  octx.setLineDash([6, 4]);
  octx.strokeRect(b.x - 3, b.y - 3, b.w + 6, b.h + 6);
  octx.setLineDash([]);
}

function deleteSelected() {
  if (selIndex === null || !ops[selIndex]) return false;
  snapshot();
  ops.splice(selIndex, 1);
  selIndex = null;
  redraw();
  drawOverlay();
  return true;
}

function redraw(previewOp) {
  if (!hasImage) return;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(orig, 0, 0);
  for (const op of ops) applyOp(op);
  if (previewOp) applyOp(previewOp);
}

// dataURL から取り込む。最大辺超過は中止（元画像は保持 — MK-U3）
function setImage(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      if (Math.max(img.width, img.height) > MAX_SIDE) {
        showBanner('warn', '画像の最大辺が上限（' + MAX_SIDE + 'px）を超えているため取り込みを中止しました');
        reject(new Error('画像の最大辺が上限（' + MAX_SIDE + 'px）を超えています'));
        return;
      }
      orig.width = img.width;
      orig.height = img.height;
      orig.getContext('2d').drawImage(img, 0, 0);
      canvas.width = img.width;
      canvas.height = img.height;
      overlay.width = img.width;
      overlay.height = img.height;
      hasImage = true;
      ops = [];
      history = [];
      selIndex = null;
      canvas.hidden = false;
      overlay.hidden = false;
      el('drop').hidden = true;
      showBanner('info', '');
      redraw();
      drawOverlay();
      resolve();
    };
    img.onerror = () => {
      showBanner('warn', '画像として読み込めませんでした');
      reject(new Error('画像として読み込めませんでした'));
    };
    img.src = dataUrl;
  });
}

/* ========== 入力（Ctrl+V / ドラッグ＆ドロップ / ファイル選択） ========== */

function loadBlob(blob) {
  const reader = new FileReader();
  reader.onload = () => { setImage(reader.result).catch(() => {}); };
  reader.readAsDataURL(blob);
}

document.addEventListener('paste', e => {
  const items = (e.clipboardData && e.clipboardData.items) || [];
  for (const it of items) {
    if (it.type && it.type.startsWith('image/')) {
      e.preventDefault();
      const f = it.getAsFile();
      if (f) loadBlob(f);
      return;
    }
  }
});
el('drop').addEventListener('dragover', e => { e.preventDefault(); el('drop').classList.add('dragover'); });
el('drop').addEventListener('dragleave', () => el('drop').classList.remove('dragover'));
el('drop').addEventListener('drop', e => {
  e.preventDefault();
  el('drop').classList.remove('dragover');
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadBlob(f);
});
el('file-btn').addEventListener('click', () => el('file-input').click());
el('file-input').addEventListener('change', () => {
  const f = el('file-input').files[0];
  if (f) loadBlob(f);
  el('file-input').value = '';
});

/* ========== マウス操作（ドラッグで矩形系・矢印、クリックでテキスト） ========== */

const toolOf = () => document.querySelector('input[name="tool"]:checked').value;
const scale = e => {
  const r = canvas.getBoundingClientRect();
  return {
    x: Math.round((e.clientX - r.left) * canvas.width / r.width),
    y: Math.round((e.clientY - r.top) * canvas.height / r.height),
  };
};
let dragStart = null;   // 新規図形のドラッグ
let moveDrag = null;    // 選択図形の移動ドラッグ { last: {x,y}, moved: bool }

function opFromDrag(tool, a, b) {
  if (tool === 'arrow') return { type: 'arrow', x1: a.x, y1: a.y, x2: b.x, y2: b.y };
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  const w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
  if (w < 2 || h < 2) return null;   // クリックだけの誤爆を防ぐ
  const op = { type: tool, x, y, w, h };
  if (tool === 'mosaic') op.size = Number(el('mosaic-size').value);
  return op;
}

canvas.addEventListener('pointerdown', e => {
  if (!hasImage) return;
  const p = scale(e);
  const tool = toolOf();
  if (tool === 'select') {
    // クリックで選択（空白なら解除）→ そのままドラッグで移動
    selIndex = hitTest(p.x, p.y);
    drawOverlay();
    if (selIndex !== null) {
      moveDrag = { last: p, moved: false };
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    }
    return;
  }
  if (tool === 'text') {
    const text = el('text-input').value.trim();
    if (text === '') { showBanner('info', 'テキスト欄に文字を入れてからクリックしてください'); return; }
    snapshot();
    ops.push({ type: 'text', x: p.x, y: p.y, text });
    redraw();
    return;
  }
  dragStart = p;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointermove', e => {
  if (moveDrag && selIndex !== null && ops[selIndex]) {
    const p = scale(e);
    const dx = p.x - moveDrag.last.x, dy = p.y - moveDrag.last.y;
    if (dx !== 0 || dy !== 0) {
      if (!moveDrag.moved) { snapshot(); moveDrag.moved = true; }   // 1ドラッグ = 1手（Undo 単位）
      moveOpBy(ops[selIndex], dx, dy);
      moveDrag.last = p;
      redraw();
      drawOverlay();
    }
    return;
  }
  if (dragStart) {
    const op = opFromDrag(toolOf(), dragStart, scale(e));
    redraw(op || undefined);
    return;
  }
  // 選択ツールで図形の上に来たらカーソルで移動可能と伝える
  if (toolOf() === 'select' && hasImage) {
    const p = scale(e);
    canvas.style.cursor = hitTest(p.x, p.y) !== null ? 'move' : 'default';
  }
});
canvas.addEventListener('pointerup', e => {
  if (moveDrag) { moveDrag = null; return; }
  if (!dragStart) return;
  const op = opFromDrag(toolOf(), dragStart, scale(e));
  dragStart = null;
  if (op) { snapshot(); ops.push(op); }
  redraw();
});

// ツールを切り替えたら選択を解除（破線が描画の邪魔にならない）＋カーソルを戻す
el('tools').addEventListener('change', e => {
  if (!e.target || e.target.name !== 'tool') return;
  selIndex = null;
  moveDrag = null;
  drawOverlay();
  canvas.style.cursor = toolOf() === 'select' ? 'default' : 'crosshair';
});

/* ========== 出力・操作ボタン ========== */

el('undo-btn').addEventListener('click', undo);
el('clear-btn').addEventListener('click', () => {
  if (ops.length === 0) return;
  snapshot();
  ops = [];
  selIndex = null;
  redraw();
  drawOverlay();
});

el('copy-btn').addEventListener('click', () => {
  if (!hasImage) { showBanner('info', '先に画像を貼り付けてください'); return; }
  // Safari 対策: ジェスチャ内で同期的に write するため Promise<Blob> を渡す（spec「出力」）
  const item = new ClipboardItem({
    'image/png': new Promise(res => canvas.toBlob(res, 'image/png')),
  });
  navigator.clipboard.write([item]).then(
    () => ToolUI.feedback(el('copy-btn'), '✓ コピーしました'),
    () => showBanner('warn', 'クリップボードへ書けませんでした — ［PNG 保存］を使ってください'));
});
el('save-btn').addEventListener('click', () => {
  if (!hasImage) { showBanner('info', '先に画像を貼り付けてください'); return; }
  const a = document.createElement('a');
  a.download = 'mask.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    el('copy-btn').click();
    return;
  }
  // Esc = 選択解除（非破壊なのでガード不要 — coding-rules「文字の扱い」）
  if (e.key === 'Escape' && selIndex !== null) {
    selIndex = null;
    drawOverlay();
    return;
  }
  // Delete/Backspace = 選択図形の削除（破壊的）。入力要素へのタイプと IME 変換中は無効
  if ((e.key === 'Delete' || e.key === 'Backspace') && selIndex !== null) {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
    if (e.isComposing) return;
    e.preventDefault();
    deleteSelected();
  }
});

/* ========== テスト用フック（UI と同一コードパス — spec） ========== */

window.mask = {
  setImage,
  addOp: op => { snapshot(); ops.push(op); redraw(); drawOverlay(); },
  undo,
  clearOps: () => { snapshot(); ops = []; selIndex = null; redraw(); drawOverlay(); },
  opsCount: () => ops.length,
  hitTest,
  selectAt: (x, y) => { selIndex = hitTest(x, y); drawOverlay(); return selIndex; },
  selectedIndex: () => selIndex,
  moveSelected: (dx, dy) => {
    if (selIndex === null || !ops[selIndex]) return false;
    snapshot();
    moveOpBy(ops[selIndex], dx, dy);
    redraw();
    drawOverlay();
    return true;
  },
  deleteSelected,
  size: () => ({ w: canvas.width, h: canvas.height }),
  pixelAt: (x, y) => Array.from(ctx.getImageData(x, y, 1, 1).data),
  countRed: (x, y, w, h) => {
    const d = ctx.getImageData(x, y, w, h).data;
    let n = 0;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i] >= 180 && d[i + 1] <= 90 && d[i + 2] <= 90) n++;
    }
    return n;
  },
};
</script>
</body>
</html>
