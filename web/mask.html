<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mask Image (mask)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🫥%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../lib/ui.css">
<style>
  /* mask 固有: キャンバスとドロップ領域 */
  #drop {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 48px 16px;
    text-align: center;
    color: var(--muted);
    background: var(--panel);
  }
  #drop.dragover { border-color: var(--accent); color: var(--accent); }
  #canvas-wrap { position: relative; display: block; width: fit-content; max-width: 100%; margin: 0 auto; }   /* 中央寄せ（v5） */
  #canvas {
    display: block;
    max-width: 100%;
    height: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    cursor: crosshair;
    touch-action: none;
  }
  /* 選択枠のオーバーレイ。出力 PNG に混入させないため別キャンバス（MK-Q5） */
  #overlay {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  /* v4: ツール群のセグメント化 — アイコン＋押下状態で現在ツールを明示（ラジオ構造は不変） */
  .tool-group { display: inline-flex; align-items: center; flex-wrap: wrap; }
  .tool-btn, .swatch { position: relative; display: inline-flex; }
  .tool-btn input, .swatch input {
    position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none;
  }
  .tool-btn .tb-face {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px; margin-left: -1px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    font-size: 13px; cursor: pointer; user-select: none; white-space: nowrap;
  }
  .tool-btn:first-child .tb-face { border-radius: 8px 0 0 8px; margin-left: 0; }
  .tool-btn:last-child .tb-face { border-radius: 0 8px 8px 0; }
  .tb-icon { font-size: 14px; line-height: 1; }
  .tool-btn input:checked + .tb-face {
    background: var(--accent); border-color: var(--accent); color: var(--accent-text);
  }
  .tool-btn input:focus-visible + .tb-face { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* 色パレット（注釈系のみに効く — MK-Q13） */
  .fmt-group { margin-left: 10px; gap: 6px; }
  .swatch .sw {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--border);
    cursor: pointer; display: inline-block;
  }
  .swatch input:checked + .sw { box-shadow: 0 0 0 2px var(--accent); }
  .swatch input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
  .grain { margin-left: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* テキストのその場編集（v3・MK-Q7）。位置・フォントは表示スケールに JS が追従させる */
  #text-editor {
    position: absolute;
    z-index: 2;
    margin: 0; padding: 0;
    min-height: 0;   /* lib/ui.css の textarea { min-height:220px }（変換ツール用）を上書き */
    box-sizing: border-box;
    border: 1px dashed #5e81ac;
    background: rgba(255, 255, 255, .88);
    color: #dd2222;
    resize: none; overflow: hidden;
    white-space: pre;
    outline: none;
  }
</style>
</head>
<body>
<main class="app-wide">
  <!-- 見出し2行（段5 — lib/ui.css の .app-head・.app-controls。coding-rules「見た目と操作の決まり」2）。説明は h1 の title -->
  <header class="app-head">
    <p class="tool-header"><a href="../index.html">← ツール一覧</a><span class="autosave-note">画像は保存されません（この画面の中だけ・機密画像を残さない）</span></p>
    <h1 title="スクショのマスキングと注釈 — モザイク/黒塗り/白塗りで隠す・枠/矢印/テキスト/番号で説明・切り抜き → 図形は選択で移動・サイズ変更・色変え → PNG コピー。ぼかしは復元リスクがあるため非搭載">Mask Image</h1>
  </header>

  <div class="app-controls" id="tools">
    <span class="tool-group" role="group" aria-label="ツール">
      <label class="tool-btn" title="図形をクリックで選択。ドラッグで移動・ハンドルでサイズ変更・Delete で削除"><input type="radio" name="tool" value="select"><span class="tb-face"><span class="tb-icon">⌖</span>選択</span></label>
      <label class="tool-btn" title="ドラッグした範囲をピクセル化して隠す"><input type="radio" name="tool" value="mosaic" checked><span class="tb-face"><span class="tb-icon">▦</span>モザイク</span></label>
      <label class="tool-btn" title="ドラッグした範囲を黒で塗りつぶして隠す"><input type="radio" name="tool" value="fill"><span class="tb-face"><span class="tb-icon">■</span>黒塗り</span></label>
      <label class="tool-btn" title="ドラッグした範囲を白で塗りつぶして隠す（書類の修正テープ）"><input type="radio" name="tool" value="white"><span class="tb-face"><span class="tb-icon">⬜</span>白塗り</span></label>
      <label class="tool-btn" title="ドラッグで注目箇所を枠で囲む"><input type="radio" name="tool" value="rect"><span class="tb-face"><span class="tb-icon">▢</span>枠</span></label>
      <label class="tool-btn" title="ドラッグで矢印を引く"><input type="radio" name="tool" value="arrow"><span class="tb-face"><span class="tb-icon">↗</span>矢印</span></label>
      <label class="tool-btn" title="クリックした場所に文字を直接入力（Esc か外側クリックで確定）"><input type="radio" name="tool" value="text"><span class="tb-face"><span class="tb-icon">T</span>テキスト</span></label>
      <label class="tool-btn" title="クリックで番号入りの丸を順に置く（手順の説明に）"><input type="radio" name="tool" value="badge"><span class="tb-face"><span class="tb-icon">①</span>番号</span></label>
      <label class="tool-btn" title="ドラッグで範囲を指定して画像を切り抜く（バナーのボタンで確定）"><input type="radio" name="tool" value="crop"><span class="tb-face"><span class="tb-icon">✂</span>切り抜き</span></label>
    </span>
    <span class="tool-group fmt-group" role="radiogroup" aria-label="色（枠・矢印・テキストに効く）">
      <label class="swatch" title="赤"><input type="radio" name="color" value="#dd2222" checked aria-label="赤"><span class="sw" style="background:#dd2222"></span></label>
      <label class="swatch" title="青"><input type="radio" name="color" value="#2563eb" aria-label="青"><span class="sw" style="background:#2563eb"></span></label>
      <label class="swatch" title="緑"><input type="radio" name="color" value="#16a34a" aria-label="緑"><span class="sw" style="background:#16a34a"></span></label>
      <label class="swatch" title="オレンジ"><input type="radio" name="color" value="#f59e0b" aria-label="オレンジ"><span class="sw" style="background:#f59e0b"></span></label>
      <label class="swatch" title="黒"><input type="radio" name="color" value="#111111" aria-label="黒"><span class="sw" style="background:#111111"></span></label>
      <label class="grain" title="モザイクの粒の大きさ">粒度 <select id="mosaic-size">
        <option value="8">細8</option>
        <option value="16" selected>標準16</option>
        <option value="24">粗24</option>
      </select></label>
      <label class="grain" title="枠・矢印の線の太さ">太さ <select id="line-width">
        <option value="2">細</option>
        <option value="3" selected>標準</option>
        <option value="5">太</option>
      </select></label>
    </span>
    <label class="toggle" title="オンの間は描画後もツールを維持（連続でマスクするとき）"><input type="checkbox" id="keep-tool"> 連続描画</label>
    <span class="spacer"></span>
    <button id="undo-btn">元に戻す</button>
    <button id="clear-btn">注釈をクリア</button>
    <button class="primary" id="copy-btn" title="Cmd/Ctrl+Enter">PNG をコピー</button>
    <button id="save-btn">PNG 保存</button>
    <label><input type="file" id="file-input" accept="image/*" hidden><button id="file-btn" type="button">画像を開く…</button></label>
  </div>

  <div class="banner" id="banner" hidden></div>

  <div id="drop">ここに画像を <b>Ctrl+V で貼り付け</b>、またはドラッグ＆ドロップ／［画像を開く…］</div>
  <div id="canvas-wrap">
    <canvas id="canvas" hidden></canvas>
    <canvas id="overlay" hidden></canvas>
    <textarea id="text-editor" hidden spellcheck="false" rows="1" aria-label="テキストを入力（Esc か外側クリックで確定）"></textarea>
  </div>
</main>

<script src="../lib/ui.js"></script>
<script src="../lib/tools.js"></script>
<script src="../lib/launcher.js"></script>
<script>
'use strict';

const el = id => document.getElementById(id);
function showBanner(kind, text) { ToolUI.banner(el('banner'), kind, text); }

const MAX_SIDE = 6000;   // 取り込みガード（canvas メモリ保護。超過は中止して理由表示）
const RED = '#dd2222';   // 注釈色（枠・矢印・テキストで共通）
const BADGE_R = 14;      // 番号スタンプの半径（v5）

/* ========== 操作モデル（元画像 + ops。再描画 = 元画像から順に適用 — 非破壊） ========== */

const orig = document.createElement('canvas');   // 元画像の保持
let hasImage = false;
let ops = [];

/* Undo はスナップショット履歴（MK-Q6）: 変更（追加・移動・削除・クリア）の前に
   ops のコピーを積む。「ops を1つ pop」のままだと移動の取り消しが「図形ごと消える」になる */
let history = [];
const HISTORY_MAX = 200;
let nudgeChain = false;   // 連続ナッジ（矢印キー）を1手にまとめる（MK-Q11。区切りはタイマーでなく他操作）
function snapshot(tag) {
  if (tag === 'nudge' && nudgeChain) return;
  history.push(ops.map(o => Object.assign({}, o)));
  if (history.length > HISTORY_MAX) history.shift();
  nudgeChain = tag === 'nudge';
}
function undo() {
  if (history.length === 0) return;
  ops = history.pop();
  selected = new Set();   // 戻した状態に対して古い添字を残さない
  nudgeChain = false;
  redraw();
  drawOverlay();
}

// 選択は集合（v6 で複数選択に一般化）。単一選択の挙動は selOnly() 経由で不変
let selected = new Set();
const selOnly = () => (selected.size === 1 ? selected.values().next().value : null);
const selList = () => Array.from(selected).sort((a, b) => a - b);

const canvas = el('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const overlay = el('overlay');
const octx = overlay.getContext('2d');
const FONT = 'bold 20px -apple-system, "Hiragino Sans", sans-serif';

function applyOp(op) {
  if (op.type === 'fill') {
    ctx.fillStyle = op.color || '#000000';   // 省略 = 黒塗り・'#ffffff' = 白塗り（v5・MK-Q15）
    ctx.fillRect(op.x, op.y, op.w, op.h);
  } else if (op.type === 'mosaic') {
    // 縮小 → imageSmoothingEnabled:false で拡大（依存ゼロのピクセル化 — MK-02）
    const size = op.size || 16;
    const sw = Math.max(1, Math.ceil(op.w / size));
    const sh = Math.max(1, Math.ceil(op.h / size));
    const tmp = document.createElement('canvas');
    tmp.width = sw; tmp.height = sh;
    const tctx = tmp.getContext('2d');
    tctx.imageSmoothingEnabled = false;
    tctx.drawImage(canvas, op.x, op.y, op.w, op.h, 0, 0, sw, sh);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(tmp, 0, 0, sw, sh, op.x, op.y, op.w, op.h);
    ctx.imageSmoothingEnabled = true;
  } else if (op.type === 'rect') {
    ctx.strokeStyle = op.color || RED;
    ctx.lineWidth = op.width || 3;
    ctx.strokeRect(op.x, op.y, op.w, op.h);
  } else if (op.type === 'arrow') {
    ctx.strokeStyle = op.color || RED;
    ctx.fillStyle = op.color || RED;
    ctx.lineWidth = op.width || 3;
    ctx.beginPath();
    ctx.moveTo(op.x1, op.y1);
    ctx.lineTo(op.x2, op.y2);
    ctx.stroke();
    // 矢印の頭（進行方向に向いた三角形）
    const ang = Math.atan2(op.y2 - op.y1, op.x2 - op.x1);
    const L = 4 * (op.width || 3);   // 頭は線幅に比例（標準3 → 従来の12 — v5）
    ctx.beginPath();
    ctx.moveTo(op.x2, op.y2);
    ctx.lineTo(op.x2 - L * Math.cos(ang - 0.5), op.y2 - L * Math.sin(ang - 0.5));
    ctx.lineTo(op.x2 - L * Math.cos(ang + 0.5), op.y2 - L * Math.sin(ang + 0.5));
    ctx.closePath();
    ctx.fill();
  } else if (op.type === 'text') {
    ctx.fillStyle = op.color || RED;
    ctx.font = FONT;
    const lines = String(op.text).split('\n');
    for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], op.x, op.y + i * 26);
  } else if (op.type === 'badge') {
    ctx.fillStyle = op.color || RED;
    ctx.beginPath();
    ctx.arc(op.x, op.y, BADGE_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px -apple-system, "Hiragino Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(op.n), op.x, op.y + 1);
    ctx.textAlign = 'left';        // 他の描画（text op）へ波及させない
    ctx.textBaseline = 'alphabetic';
  }
}

/* ========== 選択・編集（v2 — spec「選択・編集」） ========== */

function opBounds(op) {
  if (op.type === 'arrow') {
    return { x: Math.min(op.x1, op.x2) - 6, y: Math.min(op.y1, op.y2) - 6,
             w: Math.abs(op.x2 - op.x1) + 12, h: Math.abs(op.y2 - op.y1) + 12 };
  }
  if (op.type === 'badge') {
    return { x: op.x - BADGE_R - 2, y: op.y - BADGE_R - 2, w: BADGE_R * 2 + 4, h: BADGE_R * 2 + 4 };
  }
  if (op.type === 'text') {
    ctx.font = FONT;
    const lines = String(op.text).split('\n');
    let w = 0;
    for (const line of lines) w = Math.max(w, ctx.measureText(line).width);
    return { x: op.x - 2, y: op.y - 20, w: w + 4, h: 26 * lines.length };   // baseline が op.y・1行なら v2 と同一
  }
  return { x: op.x, y: op.y, w: op.w, h: op.h };
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  const t = len2 === 0 ? 0 : Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function hitOp(op, x, y) {
  if (op.type === 'arrow') return distToSegment(x, y, op.x1, op.y1, op.x2, op.y2) <= 8;
  const b = opBounds(op);
  return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
}

// 最前面（後に置いた方）優先（MK-07）
function hitTest(x, y) {
  for (let i = ops.length - 1; i >= 0; i--) {
    if (hitOp(ops[i], x, y)) return i;
  }
  return null;
}

function moveOpBy(op, dx, dy) {
  if (op.type === 'arrow') { op.x1 += dx; op.y1 += dy; op.x2 += dx; op.y2 += dy; }
  else { op.x += dx; op.y += dy; }
}

// 移動ドラッグは「開始時の座標＋開始点からの総移動量」で置く（累積誤差なし・Shift 軸ロックの土台）
function copyCoords(op) {
  return op.type === 'arrow' ? { x1: op.x1, y1: op.y1, x2: op.x2, y2: op.y2 } : { x: op.x, y: op.y };
}
function captureOrigs() {
  const map = new Map();
  for (const i of selected) if (ops[i]) map.set(i, copyCoords(ops[i]));
  return map;
}
function setOpPos(op, orig, dx, dy) {
  if (op.type === 'arrow') {
    op.x1 = orig.x1 + dx; op.y1 = orig.y1 + dy;
    op.x2 = orig.x2 + dx; op.y2 = orig.y2 + dy;
  } else {
    op.x = orig.x + dx; op.y = orig.y + dy;
  }
}

/* ========== リサイズハンドル（v3 — spec「リサイズハンドル」） ========== */

// 表示スケール = 1画面px あたりの canvas px（縮小表示中は > 1）。
// ハンドルの見た目と当たり判定を「画面上で常に約8px」にするための係数
function dispScale() {
  const r = canvas.getBoundingClientRect();
  return r.width > 0 ? canvas.width / r.width : 1;
}

const HANDLE_CURSORS = {
  nw: 'nwse-resize', se: 'nwse-resize', ne: 'nesw-resize', sw: 'nesw-resize',
  n: 'ns-resize', s: 'ns-resize', e: 'ew-resize', w: 'ew-resize',
  p1: 'move', p2: 'move',
};

// 角を先に並べる = handleAt の走査順が角優先になる（spec）
function getHandles(op) {
  if (op.type === 'text' || op.type === 'badge') return [];   // text/badge はハンドルなし（固定サイズ）
  if (op.type === 'arrow') {
    return [{ id: 'p1', x: op.x1, y: op.y1 }, { id: 'p2', x: op.x2, y: op.y2 }];
  }
  const corners = [
    { id: 'nw', x: op.x, y: op.y }, { id: 'ne', x: op.x + op.w, y: op.y },
    { id: 'sw', x: op.x, y: op.y + op.h }, { id: 'se', x: op.x + op.w, y: op.y + op.h },
  ];
  // 画面上 24px 未満の図形は辺ハンドルを間引く（判定域が本体を覆い move 不能になる — spec）
  const sc = dispScale();
  if (op.w / sc < 24 || op.h / sc < 24) return corners;
  return corners.concat([
    { id: 'n', x: op.x + op.w / 2, y: op.y }, { id: 's', x: op.x + op.w / 2, y: op.y + op.h },
    { id: 'w', x: op.x, y: op.y + op.h / 2 }, { id: 'e', x: op.x + op.w, y: op.y + op.h / 2 },
  ]);
}

function handleAt(x, y) {
  const i = selOnly();   // ハンドルは単独選択時のみ（MK-Q21）
  if (i === null || !ops[i]) return null;
  const tol = 6 * dispScale();   // 画面6px 相当
  for (const h of getHandles(ops[i])) {
    if (Math.abs(x - h.x) <= tol && Math.abs(y - h.y) <= tol) return h.id;
  }
  return null;
}

// クランプ方式（反転しない・最小2px）。arrow は長さ2px未満に潰さない — 変更せず false（spec）
function applyResize(op, handle, dx, dy) {
  if (op.type === 'text') return false;
  if (op.type === 'arrow') {
    if (handle !== 'p1' && handle !== 'p2') return false;
    const nx = (handle === 'p1' ? op.x1 : op.x2) + dx;
    const ny = (handle === 'p1' ? op.y1 : op.y2) + dy;
    const ox = handle === 'p1' ? op.x2 : op.x1;
    const oy = handle === 'p1' ? op.y2 : op.y1;
    if (Math.hypot(nx - ox, ny - oy) < 2) return false;
    if (handle === 'p1') { op.x1 = nx; op.y1 = ny; } else { op.x2 = nx; op.y2 = ny; }
    return true;
  }
  if (handle.includes('e')) op.w = Math.max(2, op.w + dx);
  if (handle.includes('s')) op.h = Math.max(2, op.h + dy);
  if (handle.includes('w')) {
    const nx = Math.min(op.x + dx, op.x + op.w - 2);
    op.w = op.x + op.w - nx;
    op.x = nx;
  }
  if (handle.includes('n')) {
    const ny = Math.min(op.y + dy, op.y + op.h - 2);
    op.h = op.y + op.h - ny;
    op.y = ny;
  }
  return true;
}

// 選択枠はオーバーレイにだけ描く — メインキャンバス（= 出力 PNG）に混入させない（MK-Q5）
function drawOverlay() {
  octx.clearRect(0, 0, overlay.width, overlay.height);
  if (cropPending) {   // 切り抜きプレビュー（オーバーレイのみ — 確定前の PNG に混入しない）
    const c = cropPending;
    const sc = dispScale();
    octx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    octx.fillRect(0, 0, overlay.width, c.y);
    octx.fillRect(0, c.y, c.x, c.h);
    octx.fillRect(c.x + c.w, c.y, overlay.width - c.x - c.w, c.h);
    octx.fillRect(0, c.y + c.h, overlay.width, overlay.height - c.y - c.h);
    octx.strokeStyle = '#ffffff';
    octx.lineWidth = 2 * sc;
    octx.setLineDash([6 * sc, 4 * sc]);
    octx.strokeRect(c.x, c.y, c.w, c.h);
    octx.setLineDash([]);
    return;
  }
  const sc = dispScale();   // 破線・ハンドルは画面上の太さを一定に（縮小表示でも見える）
  if (rubberRect) {   // ラバーバンド進行中の破線（v6。オーバーレイのみ — PNG 非混入）
    octx.strokeStyle = '#5e81ac';
    octx.lineWidth = 1.5 * sc;
    octx.setLineDash([5 * sc, 4 * sc]);
    octx.strokeRect(rubberRect.x, rubberRect.y, rubberRect.w, rubberRect.h);
    octx.setLineDash([]);
  }
  if (selected.size === 0) return;
  octx.strokeStyle = '#5e81ac';
  octx.lineWidth = 2 * sc;
  octx.setLineDash([6 * sc, 4 * sc]);
  for (const i of selected) {   // 選択中の各図形に破線枠
    if (!ops[i]) continue;
    const b = opBounds(ops[i]);
    octx.strokeRect(b.x - 3, b.y - 3, b.w + 6, b.h + 6);
  }
  octx.setLineDash([]);
  const only = selOnly();
  if (only === null || !ops[only]) return;   // ハンドルは単独選択時のみ（MK-Q21）
  const hs = 8 * sc;   // 画面上で常に約8px（spec）
  octx.fillStyle = '#ffffff';
  octx.lineWidth = 1.5 * sc;
  for (const h of getHandles(ops[only])) {
    octx.fillRect(h.x - hs / 2, h.y - hs / 2, hs, hs);
    octx.strokeRect(h.x - hs / 2, h.y - hs / 2, hs, hs);
  }
}

// バッジの採番: 既存の最大値 + 1（削除しても振り直さない — MK-Q16）
function nextBadgeN() {
  let n = 0;
  for (const op of ops) if (op.type === 'badge' && op.n > n) n = op.n;
  return n + 1;
}

/* ========== 切り抜き（v5 — spec「切り抜き」・MK-Q17: 確定式・Undo 対象外） ========== */

function normCropRect(a, b) {
  let x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  let w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
  x = Math.max(0, x); y = Math.max(0, y);
  w = Math.min(w, canvas.width - x);
  h = Math.min(h, canvas.height - y);
  return { x, y, w, h };
}

function cancelCrop() {
  if (!cropDrag && !cropPending) return;
  cropDrag = null;
  cropPending = null;
  showBanner('info', '');
  drawOverlay();
}

function offerCrop() {
  const b = ToolUI.banner(el('banner'), 'info',
    '選択した範囲に切り抜きますか？（切り抜きは元に戻せません — 必要なら先に PNG 保存を） ');
  const btn = document.createElement('button');
  btn.id = 'crop-confirm';
  btn.type = 'button';
  btn.textContent = '切り抜く';
  btn.addEventListener('click', confirmCrop);
  b.appendChild(btn);
}

function confirmCrop() {
  if (!cropPending) return;
  const { x, y, w, h } = cropPending;
  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  tmp.getContext('2d').drawImage(orig, x, y, w, h, 0, 0, w, h);
  orig.width = w; orig.height = h;
  orig.getContext('2d').drawImage(tmp, 0, 0);
  canvas.width = w; canvas.height = h;
  overlay.width = w; overlay.height = h;
  for (const op of ops) moveOpBy(op, -x, -y);   // 全 op を新原点へシフト
  history = [];        // Undo 対象外 — 画像履歴は機密画像の複製保持になる（MK-Q17）
  selected = new Set();
  cropPending = null;
  showBanner('info', '');
  redraw();
  drawOverlay();
}

function deleteSelected() {
  if (selected.size === 0) return false;
  snapshot();
  for (const i of selList().reverse()) ops.splice(i, 1);   // 降順で消す（添字ずれ防止）
  selected = new Set();
  redraw();
  drawOverlay();
  return true;
}

function redraw(previewOp) {
  if (!hasImage) return;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(orig, 0, 0);
  for (const op of ops) {
    if (editing && op === editing.op) continue;   // 編集中のテキストは描画から外す（v3）
    applyOp(op);
  }
  if (previewOp) applyOp(previewOp);
}

// dataURL から取り込む。最大辺超過は中止（元画像は保持 — MK-U3）
function setImage(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      if (Math.max(img.width, img.height) > MAX_SIDE) {
        showBanner('warn', '画像の最大辺が上限（' + MAX_SIDE + 'px）を超えているため取り込みを中止しました');
        reject(new Error('画像の最大辺が上限（' + MAX_SIDE + 'px）を超えています'));
        return;   // 中止 = 画像は変わらない → 編集中テキストも維持する（レビュー指摘3）
      }
      // 差し替え成功時のみ破棄 — 旧画像座標の op を新画像に確定させない（MK-Q9）
      discardEdit();
      cropDrag = null;
      cropPending = null;
      showBanner('info', '');
      orig.width = img.width;
      orig.height = img.height;
      orig.getContext('2d').drawImage(img, 0, 0);
      canvas.width = img.width;
      canvas.height = img.height;
      overlay.width = img.width;
      overlay.height = img.height;
      hasImage = true;
      ops = [];
      history = [];
      selected = new Set();
      canvas.hidden = false;
      overlay.hidden = false;
      el('drop').hidden = true;
      showBanner('info', '');
      redraw();
      drawOverlay();
      resolve();
    };
    img.onerror = () => {
      showBanner('warn', '画像として読み込めませんでした');
      reject(new Error('画像として読み込めませんでした'));
    };
    img.src = dataUrl;
  });
}

/* ========== 入力（Ctrl+V / ドラッグ＆ドロップ / ファイル選択） ========== */

function loadBlob(blob) {
  const reader = new FileReader();
  reader.onload = () => { setImage(reader.result).catch(() => {}); };
  reader.readAsDataURL(blob);
}

document.addEventListener('paste', e => {
  const items = (e.clipboardData && e.clipboardData.items) || [];
  for (const it of items) {
    if (it.type && it.type.startsWith('image/')) {
      e.preventDefault();
      const f = it.getAsFile();
      if (f) loadBlob(f);
      return;
    }
  }
});
el('drop').addEventListener('dragover', e => { e.preventDefault(); el('drop').classList.add('dragover'); });
el('drop').addEventListener('dragleave', () => el('drop').classList.remove('dragover'));
el('drop').addEventListener('drop', e => {
  e.preventDefault();
  el('drop').classList.remove('dragover');
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadBlob(f);
});
el('file-btn').addEventListener('click', () => el('file-input').click());
el('file-input').addEventListener('change', () => {
  const f = el('file-input').files[0];
  if (f) loadBlob(f);
  el('file-input').value = '';
});

/* ========== マウス操作（ドラッグで矩形系・矢印、クリックでテキスト） ========== */

const toolOf = () => document.querySelector('input[name="tool"]:checked').value;
const scale = e => {
  const r = canvas.getBoundingClientRect();
  return {
    x: Math.round((e.clientX - r.left) * canvas.width / r.width),
    y: Math.round((e.clientY - r.top) * canvas.height / r.height),
  };
};
let dragStart = null;   // 新規図形のドラッグ
let moveDrag = null;    // 選択図形の移動ドラッグ { start, last, moved }
let resizeDrag = null;  // ハンドルのドラッグ { handle, last, moved }

// パレットの現在色（注釈系にだけ使う — 黒塗りは黒固定 MK-Q13）
function currentColor() {
  const sw = document.querySelector('input[name="color"]:checked');
  return sw ? sw.value : RED;
}

function currentWidth() { return Number(el('line-width').value) || 3; }

function opFromDrag(tool, a, b, shift) {
  if (tool === 'arrow') {
    let x2 = b.x, y2 = b.y;
    if (shift) {   // 45°スナップ（長さは維持 — MK-Q18）
      const dx = b.x - a.x, dy = b.y - a.y;
      const snap = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
      const len = Math.hypot(dx, dy);
      x2 = Math.round(a.x + len * Math.cos(snap));
      y2 = Math.round(a.y + len * Math.sin(snap));
    }
    return { type: 'arrow', x1: a.x, y1: a.y, x2, y2, color: currentColor(), width: currentWidth() };
  }
  let w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
  if (shift) { const side = Math.max(w, h); w = side; h = side; }   // 正方形（開始点アンカー）
  if (w < 2 || h < 2) return null;   // クリックだけの誤爆を防ぐ
  const x = b.x >= a.x ? a.x : a.x - w;
  const y = b.y >= a.y ? a.y : a.y - h;
  const op = { type: tool === 'white' ? 'fill' : tool, x, y, w, h };
  if (tool === 'mosaic') op.size = Number(el('mosaic-size').value);
  if (tool === 'rect') { op.color = currentColor(); op.width = currentWidth(); }
  if (tool === 'white') op.color = '#ffffff';   // 白塗り = fill の白（MK-Q15）
  return op;
}

// プログラム的なツール切替 — 利用者の切替と違い選択を解除しない（MK-Q8）
function setToolQuiet(v) {
  document.querySelector('input[name="tool"][value="' + v + '"]').checked = true;
  canvas.style.cursor = v === 'select' ? 'default' : 'crosshair';
}

// 描画確定後: 自動選択し「選択」へ復帰（PPT 標準 — MK-Q8）。連続描画中はツール維持・選択なし
function finishDraw(index) {
  nudgeChain = false;
  if (el('keep-tool').checked) {
    selected = new Set();
  } else {
    selected = new Set([index]);
    setToolQuiet('select');
  }
  redraw();
  drawOverlay();
}

let pendingClick = null;   // 'text'|'badge' — クリック型ツールの配置は pointerup で（focus の奪い返し回避）
let rubberDrag = null;     // ラバーバンドの開始点＋additive（Shift）— v6
let rubberRect = null;     // 進行中のラバーバンド矩形（オーバーレイのみ）
let cropDrag = null;       // 切り抜きドラッグの開始点
let cropPending = null;    // 確定待ちの切り抜き範囲 {x,y,w,h}（プレビューはオーバーレイのみ — MK-Q17）

canvas.addEventListener('pointerdown', e => {
  if (!hasImage) return;
  const tool = toolOf();       // 確定より前に読む — 確定がツールを復帰させても、この操作は押下時のツールで解釈（レビュー指摘1）
  pendingClick = null;
  if (editing) commitEdit();   // 外側クリック確定 — pointerdown は blur より先に発火する（実測）
  if (cropPending && tool !== 'crop') cancelCrop();
  const p = scale(e);
  if (tool === 'select') {
    const h = handleAt(p.x, p.y);   // ハンドル > 図形本体 > 背後（spec。単独選択時のみ非 null）
    if (h !== null) {
      resizeDrag = { handle: h, last: p, moved: false, applied: false };
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      return;
    }
    const hit = hitTest(p.x, p.y);
    nudgeChain = false;
    if (e.shiftKey && hit !== null) {   // Shift+クリック = 追加/除外トグル（移動は開始しない — v6）
      if (selected.has(hit)) selected.delete(hit); else selected.add(hit);
      drawOverlay();
      return;
    }
    if (hit !== null) {
      if (!selected.has(hit)) selected = new Set([hit]);   // 群の一員なら群を維持（MK-Q22）
      drawOverlay();
      moveDrag = { start: p, origs: captureOrigs(), moved: false };
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      return;
    }
    // 空白: ラバーバンド開始（確定は pointerup。Shift なら既存選択に追加 — MK-Q20）
    rubberDrag = { start: p, additive: e.shiftKey };
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    return;
  }
  if (tool === 'text' || tool === 'badge') { pendingClick = tool; return; }   // 配置は pointerup で
  if (tool === 'crop') {
    cancelCrop();
    cropDrag = p;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    return;
  }
  dragStart = p;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointermove', e => {
  if (resizeDrag) {
    const i = selOnly();
    if (i === null || !ops[i]) return;
    const p = scale(e);
    const dx = p.x - resizeDrag.last.x, dy = p.y - resizeDrag.last.y;
    if (dx !== 0 || dy !== 0) {
      if (!resizeDrag.moved) { snapshot(); resizeDrag.moved = true; }   // 1ドラッグ = 1手
      if (applyResize(ops[i], resizeDrag.handle, dx, dy)) {
        resizeDrag.applied = true;
        resizeDrag.last = p;
        redraw();
        drawOverlay();
      }
    }
    return;
  }
  if (moveDrag && selected.size > 0) {
    const p = scale(e);
    let dx = p.x - moveDrag.start.x, dy = p.y - moveDrag.start.y;
    if (!moveDrag.moved) {
      // 画面3px の閾値 — ダブルクリック前の幻の微小移動を Undo 履歴に残さない（MK-Q12）
      if (Math.hypot(dx, dy) / dispScale() <= 3) return;
      snapshot();
      moveDrag.moved = true;
    }
    if (e.shiftKey) {   // 軸ロック（総移動量の大きい軸に固定 — MK-Q18）
      if (Math.abs(dx) >= Math.abs(dy)) dy = 0;
      else dx = 0;
    }
    for (const [i, orig] of moveDrag.origs) {   // 選択群を一括移動（v6・1手）
      if (ops[i]) setOpPos(ops[i], orig, dx, dy);
    }
    redraw();
    drawOverlay();
    return;
  }
  if (rubberDrag) {
    rubberRect = normCropRect(rubberDrag.start, scale(e));
    drawOverlay();
    return;
  }
  if (cropDrag) {
    cropPending = normCropRect(cropDrag, scale(e));
    drawOverlay();
    return;
  }
  if (dragStart) {
    const op = opFromDrag(toolOf(), dragStart, scale(e), e.shiftKey);
    redraw(op || undefined);
    return;
  }
  // 選択ツール: ホバー位置に応じたカーソル（ハンドル = 方向別 / 図形上 = move / 他 = default）
  if (toolOf() === 'select' && hasImage) {
    const p = scale(e);
    const h = handleAt(p.x, p.y);
    canvas.style.cursor = h !== null ? HANDLE_CURSORS[h]
      : (hitTest(p.x, p.y) !== null ? 'move' : 'default');
  }
});
canvas.addEventListener('pointerup', e => {
  if (resizeDrag) {
    // 1度も適用されなかったドラッグは履歴に何も残さない（無変化の1手を作らない — spec）
    if (resizeDrag.moved && !resizeDrag.applied) history.pop();
    resizeDrag = null;
    return;
  }
  if (moveDrag) { moveDrag = null; return; }
  if (rubberDrag) {
    const additive = rubberDrag.additive;
    const r = rubberRect;
    rubberDrag = null;
    rubberRect = null;
    if (r && (r.w > 2 || r.h > 2)) {
      const enclosed = [];   // 完全内包（PPT 準拠 — MK-Q20）
      for (let i = 0; i < ops.length; i++) {
        const b = opBounds(ops[i]);
        if (b.x >= r.x && b.y >= r.y && b.x + b.w <= r.x + r.w && b.y + b.h <= r.y + r.h) enclosed.push(i);
      }
      if (additive) for (const i of enclosed) selected.add(i);
      else selected = new Set(enclosed);
    } else if (!additive) {
      selected = new Set();   // ドラッグしない空白クリック = 全解除
    }
    drawOverlay();
    return;
  }
  if (cropDrag) {
    cropDrag = null;
    if (cropPending && cropPending.w >= 8 && cropPending.h >= 8) offerCrop();
    else cancelCrop();
    return;
  }
  if (pendingClick) {
    const kind = pendingClick;
    pendingClick = null;
    if (!hasImage) return;
    const p = scale(e);
    if (kind === 'text') {
      openEditor(null, p.x, p.y);   // クリック位置でその場編集（MK-Q7）
      return;
    }
    // badge: クリックで番号を置く（採番 = 最大値+1 — MK-Q16）
    snapshot();
    ops.push({ type: 'badge', x: p.x, y: p.y, n: nextBadgeN(), color: currentColor() });
    finishDraw(ops.length - 1);
    return;
  }
  if (!dragStart) return;
  const op = opFromDrag(toolOf(), dragStart, scale(e), e.shiftKey);
  dragStart = null;
  if (op) {
    snapshot();
    ops.push(op);
    finishDraw(ops.length - 1);
  } else {
    redraw();
  }
});

// 既存テキストはダブルクリックで再編集（text 以外は無視 — spec）
canvas.addEventListener('dblclick', e => {
  if (!hasImage || toolOf() !== 'select') return;
  const p = scale(e);
  const i = hitTest(p.x, p.y);
  if (i === null || ops[i].type !== 'text') return;
  moveDrag = null;
  resizeDrag = null;
  openEditor(ops[i]);
});

// 利用者によるツール切替: 強制確定 → 選択解除（プログラム的復帰 setToolQuiet と区別 — MK-Q8）
el('tools').addEventListener('change', e => {
  if (e.target && e.target.name === 'color') {
    // 書式は選択図形に効く（粒度と同じ規則・v6 で一括 = 1手）。注釈系のみ — マスク系には何もしない
    let touched = false;
    for (const i of selected) {
      const op = ops[i];
      if (op && (op.type === 'rect' || op.type === 'arrow' || op.type === 'text' || op.type === 'badge')) {
        if (!touched) { snapshot(); touched = true; }
        op.color = e.target.value;
      }
    }
    if (touched) { redraw(); drawOverlay(); }
    return;
  }
  if (!e.target || e.target.name !== 'tool') return;
  commitEdit(true);
  cancelCrop();
  selected = new Set();
  moveDrag = null;
  resizeDrag = null;
  pendingClick = null;
  rubberDrag = null;
  rubberRect = null;
  nudgeChain = false;
  drawOverlay();
  canvas.style.cursor = toolOf() === 'select' ? 'default' : 'crosshair';
});

/* ========== テキストのその場編集（v3 — spec「テキストのその場編集」） ==========
   状態機械: editing = null | { op: 既存op|null, x, y }。
   確定(commit)は blur / Esc / canvas pointerdown / グローバル操作の先頭から同期的に呼ぶ。
   画像取り込みだけは discard（旧画像座標の op を作らない）。 */

const editor = el('text-editor');
let editing = null;

function sizeEditor() {
  const r = canvas.getBoundingClientRect();
  const sc = canvas.width > 0 ? r.width / canvas.width : 1;   // canvas px → 画面 px
  // 下限 12px — 極端な縮小表示では WYSIWYG が崩れる（位置は正しい。spec 注記）
  const font = Math.max(12, 20 * sc);
  editor.style.font = '700 ' + font + 'px -apple-system, "Hiragino Sans", sans-serif';
  editor.style.lineHeight = (font * 1.3) + 'px';
  editor.style.left = (editing.x - 2) * sc + 'px';
  editor.style.top = (editing.y - 20) * sc + 'px';
  ctx.font = FONT;
  const lines = editor.value.split('\n');
  let w = 0;
  for (const line of lines) w = Math.max(w, ctx.measureText(line).width);
  // 幅はクランプ後の実フォント比で計算 — 位置スケールのままだと下限適用時に文字が見切れる（UX指摘）
  const k = font / 20;
  editor.style.width = Math.max(80, w * k + 24) + 'px';
  editor.style.height = (lines.length * font * 1.3 + 8) + 'px';
  editor.scrollLeft = 0;
}

function openEditor(op, x, y) {
  if (editing) commitEdit(true);
  editing = op ? { op, x: op.x, y: op.y, color: op.color || RED }
               : { op: null, x, y, color: currentColor() };
  editor.style.color = editing.color;   // 編集ボックスの文字色もパレットに追従（v4）
  selected = new Set();      // 編集中は選択枠を出さない（spec）
  nudgeChain = false;
  redraw();             // 編集中の op を描画から外す
  drawOverlay();
  editor.value = op ? op.text : '';
  editor.hidden = false;
  sizeEditor();
  editor.focus();
  editor.setSelectionRange(editor.value.length, editor.value.length);
  // 新規はエディタを開いた時点でツール復帰（Excalidraw と同一）。確定時に復帰させると
  // 同じクリックの途中でツールが変わり pointerdown の後半が誤解釈される（レビュー指摘1）
  if (!op && !el('keep-tool').checked) setToolQuiet('select');
}

// quiet: プログラム的な確定（コピー・保存・Undo・クリア・ツール切替）— 自動選択・ツール復帰をしない
function commitEdit(quiet) {
  if (!editing) return;
  const cur = editing;
  const text = editor.value.replace(/\n+$/, '');   // 末尾の改行のみ除去（spec）
  editing = null;
  editor.hidden = true;
  editor.value = '';
  if (cur.op) {
    const idx = ops.indexOf(cur.op);
    if (idx === -1) { redraw(); drawOverlay(); return; }   // 編集中に消えた（防御）
    if (text === '') {
      snapshot();                 // 空で確定 = 削除（1手として Undo 可能 — spec）
      ops.splice(idx, 1);
      selected = new Set();
    } else {
      if (text !== cur.op.text) { snapshot(); cur.op.text = text; }
      if (!quiet) selected = new Set([idx]);
    }
    redraw();
    drawOverlay();
    return;
  }
  if (text !== '') {
    snapshot();
    ops.push({ type: 'text', x: cur.x, y: cur.y, text, color: cur.color });
    if (quiet) { redraw(); drawOverlay(); }
    else finishDraw(ops.length - 1);
    return;
  }
  redraw();
  drawOverlay();
}

function discardEdit() {
  if (!editing) return;
  editing = null;
  editor.hidden = true;
  editor.value = '';
}

editor.addEventListener('input', () => { if (editing) sizeEditor(); });
editor.addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return;   // IME 変換中は編集操作に使わない（Excalidraw と同型）
  if (e.key === 'Escape') {
    e.preventDefault();
    e.stopPropagation();   // document 側の「選択解除」へ連鎖させない（2段階 Esc — spec）
    commitEdit();
  }
});
editor.addEventListener('blur', () => commitEdit());

/* ========== 出力・操作ボタン ========== */

el('undo-btn').addEventListener('click', () => { commitEdit(true); cancelCrop(); undo(); });
el('clear-btn').addEventListener('click', () => {
  commitEdit(true);
  cancelCrop();
  if (ops.length === 0) return;
  snapshot();
  ops = [];
  selected = new Set();
  redraw();
  drawOverlay();
});

el('copy-btn').addEventListener('click', () => {
  commitEdit(true);   // 編集中テキストが写らない PNG を無言で作らない（MK-Q9）
  if (!hasImage) { showBanner('info', '先に画像を貼り付けてください'); return; }
  // Safari 対策: ジェスチャ内で同期的に write するため Promise<Blob> を渡す（spec「出力」）
  const item = new ClipboardItem({
    'image/png': new Promise(res => canvas.toBlob(res, 'image/png')),
  });
  navigator.clipboard.write([item]).then(
    () => ToolUI.feedback(el('copy-btn'), '✓ コピーしました'),
    () => showBanner('warn', 'クリップボードへ書けませんでした — ［PNG 保存］を使ってください'));
});
el('save-btn').addEventListener('click', () => {
  commitEdit(true);
  if (!hasImage) { showBanner('info', '先に画像を貼り付けてください'); return; }
  const a = document.createElement('a');
  a.download = 'mask.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});
// テキスト入力系の要素か（ラジオ・チェック・ボタンは含めない — フォーカスが残っていても
// 図形が選択されていれば矢印/Delete は図形操作を優先する。UX ウォークスルー指摘）
function isTextEntryTarget(t) {
  if (!t || !t.tagName) return false;
  if (t.tagName === 'TEXTAREA' || t.tagName === 'SELECT') return true;
  if (t.tagName !== 'INPUT') return false;
  return !(t.type === 'radio' || t.type === 'checkbox' || t.type === 'button' || t.type === 'file');
}

document.addEventListener('keydown', e => {
  const inField = isTextEntryTarget(e.target);
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    el('copy-btn').click();   // コピーは先頭で強制確定する（MK-Q9）
    return;
  }
  // Cmd/Ctrl+D = 複製（+10,+10・複製側を選択 — MK-Q19。v6 で一括対応・1手）。
  // 未選択なら何もしない（既定動作も抑止しない）
  if ((e.metaKey || e.ctrlKey) && (e.key === 'd' || e.key === 'D')) {
    if (inField || selected.size === 0) return;
    e.preventDefault();
    snapshot();
    const clones = [];
    for (const i of selList()) {
      if (!ops[i]) continue;
      const clone = Object.assign({}, ops[i]);
      moveOpBy(clone, 10, 10);
      if (clone.type === 'badge') clone.n = nextBadgeN();   // push 済みを見るので順に次番号（MK-Q19）
      ops.push(clone);
      clones.push(ops.length - 1);
    }
    selected = new Set(clones);
    nudgeChain = false;
    redraw();
    drawOverlay();
    return;
  }
  // Cmd/Ctrl+A = 全選択（v6）
  if ((e.metaKey || e.ctrlKey) && (e.key === 'a' || e.key === 'A')) {
    if (inField || !hasImage || ops.length === 0) return;
    e.preventDefault();
    selected = new Set(ops.map((_, i) => i));
    nudgeChain = false;
    drawOverlay();
    return;
  }
  // Cmd/Ctrl+Z = Undo。Shift 付きでは発火しない（Redo と誤解した操作で逆走させない — spec）。
  // 入力要素フォーカス中はブラウザのテキスト undo に任せる
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
    if (inField) return;
    e.preventDefault();
    undo();
    return;
  }
  // Esc: 切り抜きの確定待ちがあればキャンセル（選択解除より優先）
  if (e.key === 'Escape' && (cropPending || cropDrag)) {
    cancelCrop();
    return;
  }
  // Esc = 選択解除（非破壊なのでガード不要 — coding-rules「文字の扱い」。編集中の Esc は
  // エディタ側が stopPropagation して確定に使う = 2段階）
  if (e.key === 'Escape' && selected.size > 0) {
    selected = new Set();
    drawOverlay();
    return;
  }
  // Delete/Backspace = 選択図形の削除（破壊的）。入力要素へのタイプと IME 変換中は無効
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected.size > 0) {
    if (inField || e.isComposing) return;
    e.preventDefault();
    deleteSelected();
    return;
  }
  // 矢印キー = 1px 移動（Shift で 10px）。連続ナッジは1手（MK-Q11）
  if (e.key.startsWith('Arrow') && selected.size > 0) {
    if (inField || e.isComposing) return;
    e.preventDefault();
    const step = e.shiftKey ? 10 : 1;
    const dx = e.key === 'ArrowRight' ? step : e.key === 'ArrowLeft' ? -step : 0;
    const dy = e.key === 'ArrowDown' ? step : e.key === 'ArrowUp' ? -step : 0;
    if (dx === 0 && dy === 0) return;
    snapshot('nudge');
    for (const i of selected) if (ops[i]) moveOpBy(ops[i], dx, dy);   // 一括ナッジ（v6）
    redraw();
    drawOverlay();
  }
});

// 太さセレクトは選択中の枠・矢印にも適用（色・粒度と同じ「書式は選択に効く」規則 — v5）
el('line-width').addEventListener('change', () => {
  let touched = false;
  for (const i of selected) {
    const op = ops[i];
    if (op && (op.type === 'rect' || op.type === 'arrow')) {
      if (!touched) { snapshot(); touched = true; }
      op.width = Number(el('line-width').value);
    }
  }
  if (touched) { redraw(); drawOverlay(); }
});

// 粒度セレクトは選択中のモザイクにも適用 — 書式コントロールは選択図形に効く（PPT と同じ・UX指摘）
el('mosaic-size').addEventListener('change', () => {
  let touched = false;
  for (const i of selected) {
    const op = ops[i];
    if (op && op.type === 'mosaic') {
      if (!touched) { snapshot(); touched = true; }
      op.size = Number(el('mosaic-size').value);
    }
  }
  if (touched) { redraw(); drawOverlay(); }
});

/* ========== テスト用フック（UI と同一コードパス — spec） ========== */

window.mask = {
  setImage,
  addOp: op => { snapshot(); ops.push(op); redraw(); drawOverlay(); },
  undo,
  clearOps: () => { snapshot(); ops = []; selected = new Set(); redraw(); drawOverlay(); },
  opsCount: () => ops.length,
  hitTest,
  handleAt,
  selectAt: (x, y) => {
    const hit = hitTest(x, y);
    selected = hit === null ? new Set() : new Set([hit]);
    nudgeChain = false;
    drawOverlay();
    return hit;
  },
  selectedIndex: () => selOnly(),          // 単独選択時のみ index（既存互換）
  selectedIndices: () => selList(),        // 複数選択（v6・昇順）
  resizeSelected: (handle, dx, dy) => {
    const i = selOnly();
    if (i === null || !ops[i]) return false;
    snapshot();
    const ok = applyResize(ops[i], handle, dx, dy);
    if (!ok) history.pop();   // 拒否時は無変更 — 積んだスナップショットを捨てる
    redraw();
    drawOverlay();
    return ok;
  },
  moveSelected: (dx, dy) => {
    if (selected.size === 0) return false;
    snapshot();
    for (const i of selected) if (ops[i]) moveOpBy(ops[i], dx, dy);
    redraw();
    drawOverlay();
    return true;
  },
  deleteSelected,
  size: () => ({ w: canvas.width, h: canvas.height }),
  pixelAt: (x, y) => Array.from(ctx.getImageData(x, y, 1, 1).data),
  countRed: (x, y, w, h) => {
    const d = ctx.getImageData(x, y, w, h).data;
    let n = 0;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i] >= 180 && d[i + 1] <= 90 && d[i + 2] <= 90) n++;
    }
    return n;
  },
  opAt: i => (ops[i] ? Object.assign({}, ops[i]) : null),
  countColor: (x, y, w, h, range) => {   // [rLo,rHi, gLo,gHi, bLo,bHi]
    const d = ctx.getImageData(x, y, w, h).data;
    let n = 0;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i] >= range[0] && d[i] <= range[1]
        && d[i + 1] >= range[2] && d[i + 1] <= range[3]
        && d[i + 2] >= range[4] && d[i + 2] <= range[5]) n++;
    }
    return n;
  },
};

ToolLauncher.mount();   // ☰ ツール / Cmd+Ctrl+K で引き出しメニュー（lib/launcher.js）
</script>
</body>
</html>
