<style>
  /* issue 固有: 判定一覧（warn は目立たせ、info は控えめ） */

  .field { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }

  .wz-u { display: flex; gap: 6px; align-items: center; margin: 0 0 6px; flex-wrap: wrap; }
  .wz-c { display: flex; gap: 6px; align-items: center; margin: 0 0 6px; flex-wrap: wrap; }
  .wz-c-text { flex: 2 1 200px; min-width: 0; }

  /* 一覧カード（IS-Q10）。**論点の一行を一番大きく**する — 眺めるだけで頭に入るのが狙い */
  #cards { display: flex; flex-direction: column; gap: 10px; margin: 4px 0 18px; }
  .issue-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; box-shadow: var(--shadow);
  }
  .issue-card.is-closed { opacity: .72; }
  .ic-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .ic-title { font-size: 14px; font-weight: 700; margin: 0; }
  .ic-due { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .ic-due.is-over { color: var(--error); font-weight: 600; }
  .ic-issue { font-size: 15px; line-height: 1.55; margin: 8px 0 10px; overflow-wrap: anywhere; }
  .ic-issue.is-empty { color: var(--muted); font-size: 13px; font-style: italic; }
  .ic-meta { list-style: none; margin: 0 0 10px; padding: 0; display: flex;
    flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .ic-meta li { overflow-wrap: anywhere; }
  .ic-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ic-warn { font-size: 12px; color: var(--error); border-color: var(--warn-border); background: var(--warn-bg); }
  .ic-ok { font-size: 12px; color: var(--success); }
  .ic-obsidian { font-size: 12px; color: var(--accent); text-decoration: none;
    border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; }
  .ic-obsidian:hover { border-color: var(--accent); }
  .ic-close { font-size: 12px; margin-left: auto; }
  .ic-verdicts { list-style: none; margin: 10px 0 0; padding: 0;
    display: flex; flex-direction: column; gap: 4px; }
  .ic-verdicts li { font-size: 12px; padding: 4px 8px; border-radius: 6px;

  .ic-verdicts .v-warn { background: var(--warn-bg); border-color: var(--warn-border); }
  .ic-verdicts .v-info { color: var(--muted); }
  .ic-empty { font-size: 13px; color: var(--muted); padding: 18px 4px; }
  #paste-box > summary { cursor: pointer; color: var(--accent); font-size: 13px; padding: 4px 0; }
  .paste-inner { padding-top: 6px; }
  .paste-inner textarea { min-height: 180px; }
  /* ウィザードの欄は「散文を1〜3行」。lib/ui.css の textarea 既定（min-height:220px・等幅）は
     2ペインの編集欄向けなので、ここだけ外して rows どおりの高さにする */
  #wz-body textarea { min-height: 0; font-family: inherit; font-size: 13px; }
  #wz-body input[type="text"], #wz-body input[type="date"] { font-size: 13px; }
</style>

<script>
'use strict';

/* ========== 純関数（フックと UI が同一コードパス） ========== */

/* 5ステップの見出し。表記の揺れを許容する（docs/specs/issue.md「5ステップの見出し認識」）:
   "## 1. ゴール" / "## ゴール" / "**2. 論点**" / "3. 不明点：" / "#### リスク" */
const HEAD_RE = /^\s*(?:#{1,6}\s*)?(?:\*\*)?\s*(?:[1-9][.．、)]?\s*)?(ゴール|論点|イシュー|絵コンテ|サブイシュー|不明点|リスク|次の一手|分かったこと|結論|掘ったログ)\s*(?:\*\*)?\s*[:：]?\s*$/;
const KEY_OF = {
  'ゴール': 'goal', '論点': 'issue', 'イシュー': 'issue',
  '絵コンテ': 'picture',
  // 旧「不明点」は同じ枠へ（既存ノートを壊さない）
  'サブイシュー': 'subs', '不明点': 'subs',
  'リスク': 'risks',              // 旧枠。新規では作らないが内容は保持する
  '次の一手': 'next',
  '分かったこと': 'found', '結論': 'conclusion',
  '掘ったログ': 'rest',
};

function nfc(s) { return String(s == null ? '' : s).normalize('NFC'); }

// 行頭の箇条書き記号を落とす。**タスク記法（- [ ]）はそのまま残す**（次の一手で使うため）
function stripBullet(raw) {
  const s = nfc(raw).replace(/\s+$/, '');
  if (/^\s*[-*+]\s+\[[^\]]\]\s/.test(s)) return s.trim();
  return s.replace(/^\s*(?:[-*+]|\d+[.)])\s+/, '').trim();
}

function parseSections(text) {
  const out = { title: '', goal: [], issue: [], picture: [], subs: [], risks: [],
                next: [], found: [], conclusion: [], rest: [] };
  const lines = nfc(text).replace(/\r\n?/g, '\n').split('\n');
  let cur = null;                       // null = rest（どの見出しにも属さない部分）
  for (const raw of lines) {
    const m = raw.match(HEAD_RE);
    if (m) { cur = KEY_OF[m[1]]; continue; }
    // 未知の見出し行はセクションを閉じる（次の行から rest へ戻す）。
    // 最初の1本だけは title として拾う（ノートの H1 になる）
    const h = raw.match(/^\s*#{1,6}\s+(.+?)\s*$/);
    if (h) {
      if (out.title === '') out.title = h[1].trim();
      cur = null;
      continue;
    }
    const body = stripBullet(raw);
    if (body === '') continue;
    out[cur === null ? 'rest' : cur].push(body);
  }
  return out;
}

/* 判定（IS-Q5: 警告であって拒否ではない）。見るのは**論点の1行目**と締切・不明点の有無。
   掘削ログの「なぜ？」は対象外 — WHY を避けるのはイシュー文の書き方だけ（IssueDriven.md） */
function judge(line, opts) {
  const o = opts || {};
  const arr = Array.isArray(line) ? line : (line == null ? [] : [line]);
  // 「> 答えが出たら」「（見送った候補）」などの注記行は論点として数えない
  const lines = arr.map(x => nfc(x).trim())
    .filter(x => x !== '' && !/^[>（(]/.test(x));
  const first = lines[0] || '';
  const out = [];
  const add = (id, level, msg, fix) => out.push({ id: id, level: level, msg: msg, fix: fix });

  if (first === '') {
    add('empty', 'warn', '論点が書かれていない',
      'ゴールから「で、答えを出すべき問いは何か」を一行で書く');
  } else {
    if (/(について|の件|まとめ|整理)\s*[。．.]?$/.test(first))
      add('about', 'warn', '「〜について」で止まっている',
        '動詞を足してスタンスを取る（本: 「〜について」で止めない）');
    if (/(整理|確認|検討|調査|把握|対応|共有)(する|します|を行う|を実施|をする)/.test(first))
      add('worktheme', 'warn', '作業テーマであって論点ではない',
        '「整理する・確認する」は犬の道の症状。答えが出たら何が変わるかを問いにする');
    if (/^(なぜ|何故|どうして|why)/i.test(first))
      add('why', 'warn', 'WHY で始まっている',
        '「どこを / 何を / どう」に置き換える（本: WHY ではなく WHERE・WHAT・HOW）');
    if (!/[はが]/.test(first))
      add('subject', 'info', '主語が見えない', '「◯◯は〜」の形にする（言語化のコツ①）');
    if (!/(ではなく|じゃなく|ではなくて|より|それとも|vs)/i.test(first))
      add('compare', 'info', '比較の形になっていない',
        '「〜ではなく〜」でスタンスを取ると仮説になる（言語化のコツ③）');
    if (lines.length > 1)
      add('multiline', 'info', '論点が複数行ある', '一行に絞る。残りはサブイシューへ');
  }
  if (!o.deadline)
    add('deadline', 'warn', 'いつ白黒がつくかが決まっていない',
      '締切を入れる（よいイシューの条件③ 答えを出せる）');
  if (!(o.unknowns && o.unknowns.length))
    add('evidence', 'warn', '何を見れば白黒つくかが無い',
      'サブイシューを1つ以上書き、聞く / 調べる / 試す を振る');
  // 本で最も強い検算: 欲しい絵が描けないなら、まだイシューが定まっていない（第3章）
  if (nfc(o.picture || '').trim() === '')
    add('picture', 'warn', '答えが出たとき何を出すかが決まっていない',
      '絵コンテを描く — 描けないなら、まだイシューが定まっていない');
  // 候補を渡されたときだけ見る（貼った文章には候補の概念が無い）
  if (Array.isArray(o.candidates)
      && o.candidates.filter(c => nfc(c).trim() !== '').length < 2)
    add('alternatives', 'info', '論点の候補が1つだけ',
      '解ける問題の中から選ぶ。もう1つ立てて並べてみる（イシュー度）');
  return out;
}

// 不明点の本文から解消手段を検出して表の2列目に入れる
function wayOf(s) {
  const t = nfc(s);
  if (/聞く|訊く|確認を取る|依頼/.test(t)) return '聞く';
  if (/調べ|洗い出|一覧|確認する/.test(t)) return '調べる';
  if (/試す|検証|流して|再現/.test(t)) return '試す';
  return '';
}

/* ---------- 一覧のための解析（04_Issues のノートを読む） ---------- */

/* frontmatter は「先頭の --- で挟まれた単純な key: value」だけを読む。
   Obsidian の配列記法（tags:\n  - issue）は値が空になるが、一覧で使うのは
   deadline / status / verdict のスカラーだけなので足りる */
function parseFrontmatter(text) {
  const t = nfc(text).replace(/\r\n?/g, '\n');
  const m = t.match(/^---\n([\s\S]*?)\n---\n?/);
  const data = {};
  if (!m) return { data: data, body: t, has: false };
  const ls = m[1].split('\n');
  for (let i = 0; i < ls.length; i++) {
    const kv = ls[i].match(/^([A-Za-z_][\w-]*):\s*(.*)$/);
    if (kv) data[kv[1]] = kv[2].trim();
  }
  return { data: data, body: t.slice(m[0].length), has: true };
}

/* frontmatter のキーだけを差し替える（無ければ frontmatter の末尾に足す）。
   **本文は1文字も変えない。** frontmatter が無いノート（手書き）には何もしない */
function setFrontmatter(text, patch) {
  const t = nfc(text).replace(/\r\n?/g, '\n');
  const m = t.match(/^---\n([\s\S]*?)\n---\n?/);
  if (!m) return t;
  let ls = m[1].split('\n');
  const keys = Object.keys(patch || {});
  for (let i = 0; i < keys.length; i++) {
    const key = keys[i];
    const re = new RegExp('^' + key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ':');
    let found = false;
    ls = ls.map(function (l) {
      if (!re.test(l)) return l;
      found = true;
      return key + ': ' + patch[key];
    });
    if (!found) ls.push(key + ': ' + patch[key]);
  }
  return '---\n' + ls.join('\n') + '\n---\n' + t.slice(m[0].length);
}

// 指定の見出しの節の末尾に1行足す。節が無ければノートの末尾に作る
function appendToSection(text, heading, line) {
  const t = nfc(text).replace(/\r\n?/g, '\n');
  const ls = t.split('\n');
  let idx = -1;
  for (let i = 0; i < ls.length; i++) { if (ls[i].trim() === heading) { idx = i; break; } }
  if (idx === -1) return t.replace(/\s*$/, '') + '\n\n' + heading + '\n\n' + line + '\n';
  let end = idx + 1;
  while (end < ls.length && !/^#{1,6}\s/.test(ls[end])) end++;
  let ins = end;
  while (ins > idx + 1 && ls[ins - 1].trim() === '') ins--;
  ls.splice(ins, 0, line);
  return ls.join('\n');
}

/* サブイシューの行 → { what, way }。**表の見出し行と区切り行は落とす**
   （toNote が組む表をそのまま読み返すため） */
function subRows(lines) {
  const out = [];
  for (let i = 0; i < (lines || []).length; i++) {
    const l = nfc(lines[i]).trim();
    if (l === '') continue;
    if (/^\|\s*-{2,}/.test(l)) continue;
    if (/^\|/.test(l)) {
      const cells = l.replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); });
      if (cells[0] === '' || cells[0] === '分からないこと') continue;
      out.push({ what: cells[0], way: cells[1] || '' });
    } else {
      out.push({ what: l, way: wayOf(l) });
    }
  }
  return out;
}

// カード1枚分の要約。**判定（judge）も同じ純関数を通す**ので、一覧と入力で基準がずれない
function summarize(text, fileName) {
  const fm = parseFrontmatter(text);
  const p = parseSections(fm.body);
  const name = String(fileName || '').replace(/\.md$/i, '');
  const rows = subRows(p.subs);
  const ways = { '聞く': 0, '調べる': 0, '試す': 0 };
  for (let i = 0; i < rows.length; i++) {
    if (Object.prototype.hasOwnProperty.call(ways, rows[i].way)) ways[rows[i].way]++;
  }
  const pic = (p.picture || []).filter(function (x) { return nfc(x).trim() !== ''; });
  const verdicts = judge(p.issue, {
    deadline: fm.data.deadline || '',
    unknowns: rows.map(function (x) { return x.what; }),
    picture: pic.join(' '),
  });
  const issueLine = (p.issue || []).map(function (x) { return nfc(x).trim(); })
    .filter(function (x) { return x !== '' && !/^[>（(]/.test(x); })[0] || '';
  return {
    file: String(fileName || ''), name: name,
    title: (p.title || name),
    issue: issueLine,
    picture: pic[0] || '',
    subs: rows.length, ways: ways, rows: rows,
    next: (p.next || [])[0] || '',
    deadline: fm.data.deadline || '',
    status: fm.data.status || 'open',
    verdict: fm.data.verdict || '',
    hasFrontmatter: fm.has,
    warn: verdicts.filter(function (v) { return v.level === 'warn'; }).length,
    verdicts: verdicts,
  };
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
    + '-' + String(d.getDate()).padStart(2, '0');
}

/* ノートのファイル名（vault-rules の命名規則 `YYYY-MM-DD_トピック.md`）。
   Obsidian / ファイルシステムで使えない文字は `-` に置換する */
function noteFileName(title, today) {
  const t = nfc(title).replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, ' ').trim();
  return (today || todayStr()) + '_' + (t === '' ? '無題' : t) + '.md';
}

/* 04_Issues 用の md。**空のセクションも見出しは残す**（後でノート側で埋めるため）。
   器は 99_Templates/issue.md と同じ5ステップ */
function toNote(parsed, opts) {
  const o = opts || {};
  const p = parsed || parseSections('');
  const L = [];
  const bullets = arr => {
    if (!arr || arr.length === 0) { L.push('- '); } else {
      // 既に記号（箇条書き・表・引用）で始まる行はそのまま通す
      for (const a of arr) L.push(/^\s*[-*+|>]/.test(a) ? a : '- ' + a);
    }
    L.push('');
  };
  const sec = (head, arr) => { L.push(head); L.push(''); bullets(arr); };
  L.push('---');
  L.push('created: ' + (o.today || todayStr()));
  L.push('deadline: ' + (o.deadline || ''));
  L.push('status: open');
  L.push('verdict: ');            // 閉じるとき「当たり / 外れ / 未決」を書く（振り返りの素材）
  L.push('tags: [issue]');
  L.push('---');
  L.push('# ' + ((o.title || p.title || '').trim() || '無題'));
  L.push('');
  L.push('→ [[IssueDriven]] ｜ [[イシューの書き方と記入例]]');
  L.push('');
  sec('## 1. ゴール', p.goal);
  sec('## 2. 論点', p.issue);
  sec('## 3. 絵コンテ', p.picture);
  L.push('## 4. サブイシュー');
  L.push('');
  L.push('| 分からないこと | 聞く / 調べる / 試す | 誰に・どこで | いつまでに |');
  L.push('| --- | --- | --- | --- |');
  const rows = (p.subs && p.subs.length) ? p.subs : [''];
  // ウィザードが組んだ表の行はそのまま通す（二重に表を組まない — IS-18）
  for (const u of rows) L.push(/^\s*\|/.test(u) ? u : '| ' + u + ' | ' + wayOf(u) + ' |  |  |');
  L.push('');
  L.push('## 5. 次の一手');
  L.push('');
  if (!p.next || p.next.length === 0) { L.push('- [ ] '); } else {
    for (const n of p.next) L.push(/^\s*[-*+]\s+\[/.test(n) ? n : '- [ ] ' + n);
  }
  L.push('');
  // 旧枠。既存ノートに書かれていた内容は落とさない（新規では空なので出ない）
  if (p.risks && p.risks.length) sec('## リスク', p.risks);
  L.push('---');
  L.push('');
  sec('## 分かったこと', p.found);
  // **ここが無いとイシューを閉じられず、振り返りの素材が残らない**（A5）
  sec('## 結論', p.conclusion);
  if (p.rest && p.rest.length) {
    L.push('## 掘ったログ');
    L.push('');
    for (const x of p.rest) L.push(x);
    L.push('');
  }
  return L.join('\n');
}

/* ウィザードの下書き → 5ステップの md。**ウィザードは md を作るだけ**で、
   判定・出力・書き込みは既存の経路（parseSections → judge / toNote）をそのまま通る。
   実装を二重に持たないための設計（IS-Q8） */
function buildMd(d0) {
  const d = d0 || {};
  const one = v => nfc(v).trim().replace(/\s*\n+\s*/g, ' ');
  const L = [];
  const sec = (head, lines) => {
    L.push(head); L.push('');
    if (lines.length === 0) L.push('- '); else for (const x of lines) L.push(x);
    L.push('');
  };
  const ms = one(d.milestone);
  sec('## 1. ゴール', ms === '' ? []
    : ['- ' + ms + (d.milestoneDue ? '（マイルストーン: ' + d.milestoneDue + '）' : '')]);

  // 論点: 選んだ1行＋注記（注記は「> 」で始めるので judge の行数に数えられない）
  const cands = (d.candidates || []).map(c => ({ text: one(c.text), effect: one(c.effect) }));
  const pick = cands[d.chosen || 0] || { text: '', effect: '' };
  const others = cands.filter((c, i) => i !== (d.chosen || 0) && c.text !== '').map(c => c.text);
  const issueLines = [];
  if (pick.text !== '') issueLines.push('- ' + pick.text);
  if (pick.effect !== '') issueLines.push('> 答えが出たら: ' + pick.effect);
  if (others.length) issueLines.push('> 見送った候補: ' + others.join(' ／ '));
  sec('## 2. 論点', issueLines);

  const pic = one(d.picture);
  sec('## 3. 絵コンテ', pic === '' ? []
    : ['- ' + (d.pictureKind ? '【' + d.pictureKind + '】' : '') + pic]);

  const subs = (d.subs || []).filter(u => u && one(u.what) !== '');
  sec('## 4. サブイシュー', subs.map(u =>
    '| ' + one(u.what) + ' | ' + one(u.way) + ' | ' + one(u.who) + ' | ' + one(u.due) + ' |'));

  const nx = one(d.next);
  L.push('## 5. 次の一手'); L.push('');
  L.push(nx === '' ? '- [ ] '
    : '- [ ] ' + nx + (d.nextDue ? ' \u{1F4C5} ' + d.nextDue : ''));
  L.push('');
  return L.join('\n');
}

// tasks.md 用の行（Obsidian Tasks 記法）。既に "- [ ]" なら二重に付けない
function toTasks(nextLines, opts) {
  const o = opts || {};
  const dl = o.deadline ? ' \u{1F4C5} ' + o.deadline : '';
  const arr = (nextLines || []).map(x => nfc(x).trim()).filter(x => x !== '');
  if (arr.length === 0) return '';
  return arr.map(x => {
    const has = /^[-*+]\s+\[[^\]]\]\s/.test(x);
    const body = has ? x : '- [ ] ' + x.replace(/^[-*+]\s+/, '');
    return /\u{1F4C5}/u.test(body) ? body : body + dl;
  }).join('\n');
}

/* ---------- 04_Issues への書き込み（File System Access・Chrome 系） ----------
   **フォルダ名をコードに書かない**（coding-rules「vault 連携」）— 利用者にピッカーで選ばせ、
   ハンドルを IndexedDB に覚える。既存ノートは書き換えない（同名なら止める — IS-Q2 改訂） */
const IDB_NAME = 'tools-issue';
const IDB_STORE = 'handles';
const IDB_KEY = 'issueDir';

function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  try {
    return await new Promise((res, rej) => {
      const g = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
      g.onsuccess = () => res(g.result);
      g.onerror = () => rej(g.error);
    });
  } finally { db.close(); }
}
async function idbSet(key, val) {
  const db = await idbOpen();
  try {
    await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(val, key);
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error);
    });
  } finally { db.close(); }
}

let dirHandle = null;

function fsaAvailable() { return typeof window.showDirectoryPicker === 'function'; }

// FSA 非対応（Safari / Firefox）では作成を無効にして理由を出す（Check Vault と同型）
function updateEnvNote() {
  const no = !fsaAvailable();
  $id('create-btn').disabled = no;
  $id('pick-btn').disabled = no;
  // **直接保存できるならコピーは要らない**（利用者「コピー用は必要ない。そのまま保存できるんだよね？」）。
  // 保存できない Safari / Firefox のときだけ、唯一の経路として出す
  $id('copy-btn').hidden = !no;
  const msg = no
    ? 'このブラウザでは直接作成できません（showDirectoryPicker が必要 — Chrome 系で開いてください）。下の［md をコピー］でノートに貼ってください'
    : '';
  $id('env-note').textContent = msg;
  $id('env-note').hidden = msg === '';
}

const errText = e => (e && e.message ? e.message : String(e));

async function ensureDir() {
  if (dirHandle) {
    const q = await dirHandle.queryPermission({ mode: 'readwrite' });
    if (q === 'granted') return dirHandle;
    if ((await dirHandle.requestPermission({ mode: 'readwrite' })) === 'granted') return dirHandle;
    dirHandle = null;   // 拒否された: 選び直させる
  }
  dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
  // ハンドルの保存は **best-effort**（できなくても毎回選べば動く — IS-Q7）
  try { await idbSet(IDB_KEY, dirHandle); } catch (_) { /* 構造化複製できない環境 */ }
  return dirHandle;
}

async function createNote() {
  settle();                                   // デバウンス中の古い md を書かない
  const name = noteFileName($id('title').value, todayStr());
  let dir;
  try {
    dir = await ensureDir();
  } catch (e) {
    if (e && e.name === 'AbortError') return;   // キャンセルは無言
    ToolUI.banner($id('banner'), 'error', 'フォルダを開けませんでした: ' + errText(e));
    return;
  }
  try {
    // **同名があれば上書きしない**（既存ノートは書き換えない — vault-rules の掟②）
    let exists = true;
    try {
      await dir.getFileHandle(name);
    } catch (e) {
      if (e && e.name === 'NotFoundError') exists = false;
      else throw e;
    }
    if (exists) {
      ToolUI.banner($id('banner'), 'warn',
        name + ' は既にあります — タイトルを変えてください（上書きはしません）');
      return;
    }
    const fh = await dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(noteMd());
    await w.close();
    ToolUI.banner($id('banner'), 'success', name + ' を作成しました');
    await loadIssues(false);          // 作った直後に一覧へ出す
  } catch (e) {
    ToolUI.banner($id('banner'), 'error', '作成できませんでした: ' + errText(e));
  }
}
$id('create-btn').addEventListener('click', createNote);

/* ---------- 一覧（IS-Q10。ここが画面の主） ----------
   `Plan Tasks` は開いた瞬間にタスクが並ぶので毎日開かれる。`Check Issue` は作るときにしか
   用が無く、それ以外の日は開く理由がゼロだった（利用者「今のままだと使わない」）。
   **04_Issues を読んでカードで並べる**ことで「見るために開く」道具にする */
const MAX_ISSUES = 200;
let issues = [];

function dayDiff(ymd) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(ymd || '')) return null;
  const a = new Date(todayStr() + 'T00:00:00');
  const b = new Date(ymd + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

function obsidianHref(name) {
  const v = (window.ToolConfig ? ToolConfig.get('vaultName') : '') || '';
  // vault 名が未設定なら**リンクを作らない**（押しても開かないリンクを作らない — coding-rules）
  if (!v) return '';
  return 'obsidian://open?vault=' + encodeURIComponent(v) + '&file=' + encodeURIComponent(name);
}

async function readDirIssues(dir) {
  const list = [];
  for await (const entry of dir.values()) {
    if (entry.kind !== 'file' || !/\.md$/i.test(entry.name)) continue;
    if (list.length >= MAX_ISSUES) return { over: true, list: list };
    const f = await entry.getFile();
    list.push({ name: entry.name, text: await f.text() });
  }
  return { over: false, list: list };
}

async function loadIssues(interactive) {
  if (!fsaAvailable()) return;
  let dir = dirHandle;
  if (interactive || !dir) {
    try { dir = await ensureDir(); } catch (e) {
      if (e && e.name === 'AbortError') return;
      ToolUI.banner($id('banner'), 'error', 'フォルダを開けませんでした: ' + errText(e));
      return;
    }
  }
  if (!dir) return;
  try {
    const res = await readDirIssues(dir);
    if (res.over) {
      ToolUI.banner($id('banner'), 'warn',
        'ノートが ' + MAX_ISSUES + ' 件を超えています。04_Issues 以外のフォルダを選んでいないか確認してください');
      return;
    }
    issues = res.list.map(function (f) {
      const sum = summarize(f.text, f.name);
      sum.text = f.text;
      return sum;
    });
    // 締切の早い順。締切なしは最後（決まっていないものを上に出しても行動が変わらない）
    issues.sort(function (a, b) {
      if (!a.deadline && !b.deadline) return a.name < b.name ? -1 : 1;
      if (!a.deadline) return 1;
      if (!b.deadline) return -1;
      return a.deadline < b.deadline ? -1 : (a.deadline > b.deadline ? 1 : 0);
    });
    $id('reload-btn').hidden = false;
    renderCards();
  } catch (e) {
    ToolUI.banner($id('banner'), 'error', '読み込みに失敗しました: ' + errText(e));
  }
}

function meta(parent, text) {
  if (!text) return;
  const li = document.createElement('li');
  li.textContent = text;
  parent.appendChild(li);
}

function card(it) {
  const art = document.createElement('article');
  art.className = 'issue-card' + (it.status === 'closed' ? ' is-closed' : '');
  art.dataset.file = it.file;

  const head = document.createElement('header');
  head.className = 'ic-head';
  const h = document.createElement('h2');
  h.className = 'ic-title';
  h.textContent = it.title;
  head.appendChild(h);
  const due = document.createElement('span');
  const d = dayDiff(it.deadline);
  due.className = 'ic-due' + (d !== null && d < 0 ? ' is-over' : '');
  due.textContent = it.deadline
    ? '📅 ' + it.deadline + (d === null ? '' : (d < 0 ? '（' + (-d) + '日超過）' : d === 0 ? '（今日）' : '（あと' + d + '日）'))
    : '📅 締切なし';
  head.appendChild(due);
  art.appendChild(head);

  const q = document.createElement('p');
  q.className = 'ic-issue';
  q.textContent = it.issue || '（論点が書かれていない）';
  if (!it.issue) q.classList.add('is-empty');
  art.appendChild(q);

  const ul = document.createElement('ul');
  ul.className = 'ic-meta';
  if (it.picture) meta(ul, '🎬 ' + it.picture);
  if (it.next) meta(ul, '▶ 次の一手  ' + it.next.replace(/^-\s*\[[^\]]\]\s*/, ''));
  if (it.subs) {
    const w = it.ways;
    const inner = ['聞く', '調べる', '試す'].filter(function (k) { return w[k]; })
      .map(function (k) { return k + w[k]; }).join('・');
    meta(ul, '🧩 サブイシュー ' + it.subs + '件' + (inner ? '（' + inner + '）' : ''));
  }
  if (it.status === 'closed') meta(ul, '✔ 閉じた' + (it.verdict ? '（' + it.verdict + '）' : ''));
  art.appendChild(ul);

  const acts = document.createElement('div');
  acts.className = 'ic-actions';
  const vlist = document.createElement('ul');
  vlist.className = 'ic-verdicts';
  vlist.hidden = true;

  if (it.warn > 0) {
    const wb = document.createElement('button');
    wb.type = 'button';
    wb.className = 'ic-warn';
    wb.textContent = '⚠ 引っかかり ' + it.warn + '件';
    wb.addEventListener('click', function () {
      vlist.hidden = !vlist.hidden;
      wb.setAttribute('aria-expanded', String(!vlist.hidden));
    });
    acts.appendChild(wb);
    for (let i = 0; i < it.verdicts.length; i++) {
      const v = it.verdicts[i];
      const li = document.createElement('li');
      li.className = 'v-' + v.level;
      li.dataset.id = v.id;
      li.textContent = (v.level === 'warn' ? '⚠ ' : '· ') + v.msg + ' — ' + v.fix;
      vlist.appendChild(li);
    }
  }
  if (it.warn === 0) {
    // 何も出ないと「判定されたのか」が分からない。通ったことも言う（IS-Q5 の2段表示と同じ考え）
    const ok = document.createElement('span');
    ok.className = 'ic-ok';
    ok.textContent = '✓ 引っかかりなし';
    acts.appendChild(ok);
  }
  const href = obsidianHref(it.name);
  if (href) {
    const a = document.createElement('a');
    a.className = 'ic-obsidian';
    a.href = href;
    a.textContent = 'Obsidian で開く';
    acts.appendChild(a);
  }
  if (it.status !== 'closed') {
    const cb = document.createElement('button');
    cb.type = 'button';
    cb.className = 'ic-close';
    cb.textContent = '閉じる…';
    cb.addEventListener('click', function () { openCloseModal(it); });
    acts.appendChild(cb);
  }
  art.appendChild(acts);
  art.appendChild(vlist);
  return art;
}

function visibleIssues() {
  const f = $id('f-status').value;
  return issues.filter(function (it) {
    if (f === 'all') return true;
    if (f === 'closed') return it.status === 'closed';
    return it.status !== 'closed';
  });
}

function renderCards() {
  const host = $id('cards');
  host.textContent = '';
  const list = visibleIssues();
  const label = { open: '開いているもの', all: 'すべて', closed: '閉じたもの' }[$id('f-status').value];
  $id('summary').textContent = issues.length === 0 ? '' : list.length + '件（' + label + '）';
  if (list.length === 0) {
    const p = document.createElement('p');
    p.className = 'ic-empty';
    p.textContent = issues.length === 0
      ? (fsaAvailable() ? '［📂 04_Issues を開く］でフォルダを選ぶと、イシューがここに並びます'
                        : 'このブラウザでは一覧を読み込めません（Chrome 系で開いてください）')
      : '該当なし';
    host.appendChild(p);
    return;
  }
  for (let i = 0; i < list.length; i++) host.appendChild(card(list[i]));
}

/* ---------- 閉じる = 振り返り（IS-Q2 再改訂） ---------- */
let closing = null;

function openCloseModal(it) {
  closing = it;
  $id('cm-target').textContent = it.title + (it.issue ? ' — ' + it.issue : '');
  $id('cm-note').value = '';
  $id('cm-err').hidden = true;
  $id('cm-err').textContent = '';
  const first = document.querySelector('input[name="cm-v"]');
  if (first) first.checked = true;
  $id('close-modal').hidden = false;
  $id('cm-note').focus();
}
function closeCloseModal() { $id('close-modal').hidden = true; closing = null; }

async function applyClose() {
  if (!closing || !dirHandle) return;
  const it = closing;
  if (!it.hasFrontmatter) {
    $id('cm-err').textContent = 'このノートには frontmatter が無いため書き換えません（Obsidian で直接閉じてください）';
    $id('cm-err').hidden = false;
    return;
  }
  const picked = document.querySelector('input[name="cm-v"]:checked');
  const verdict = picked ? picked.value : '未決';
  const note = nfc($id('cm-note').value).trim();
  try {
    const fh = await dirHandle.getFileHandle(it.file);
    const cur = await (await fh.getFile()).text();
    // **書き込む直前に再読して比較**（Plan Tasks の保存と同じ鮮度チェック）
    if (nfc(cur) !== nfc(it.text)) {
      $id('cm-err').textContent = 'Obsidian 側で変更されています。［再読込］してからもう一度お願いします（上書きは避けました）';
      $id('cm-err').hidden = false;
      return;
    }
    let next = setFrontmatter(cur, { status: 'closed', verdict: verdict });
    if (note !== '') next = appendToSection(next, '## 結論', '- ' + note);
    const w = await fh.createWritable();
    await w.write(next);
    await w.close();
    closeCloseModal();
    ToolUI.banner($id('banner'), 'success', it.title + ' を閉じました（' + verdict + '）');
    await loadIssues(false);
  } catch (e) {
    $id('cm-err').textContent = '書き込めませんでした: ' + errText(e);
    $id('cm-err').hidden = false;
  }
}

/* vault 名（lib/config.js）。効くのは Obsidian リンクだけで、読み書きには一切関係しない */
function applyVaultCfg() {
  if (!window.ToolConfig) return;
  $id('cfg-vault').value = ToolConfig.get('vaultName') || '';
}
$id('cfg-vault').addEventListener('change', function () {
  if (window.ToolConfig) ToolConfig.set({ vaultName: $id('cfg-vault').value });
  renderCards();
});

$id('pick-btn').addEventListener('click', function () { loadIssues(true); });
$id('reload-btn').addEventListener('click', function () { loadIssues(false); });
$id('f-status').addEventListener('change', renderCards);
$id('cm-cancel').addEventListener('click', closeCloseModal);
$id('cm-ok').addEventListener('click', applyClose);

/* ---------- 入力ウィザード（IS-Q8） ----------
   **ただの md 入力欄では Obsidian と同じ**という利用者の指摘への対処。
   5段は本の順（マイルストーン → イシューの選別 → 絵コンテ → 分解 → 最初の一手）。
   2026-09-24 に「リスク」を落として 選別・絵コンテ・分解 を入れた（本の3章分が欠けていたため）。
   ウィザードは **md を組み立てて既存の入力欄へ流すだけ** — 判定・出力・書き込みは
   parseSections → judge / toNote / createNote の既存経路をそのまま通る */
const WZ = [
  { title: 'いつまでに、何が達成されていればいい？',
    why: 'ここが決まらないと、何を問うかも決まらない。まずマイルストーンを置いて、そこから降りる（本: 最終形からたどる）' },
  { title: '答えを出すべき問いの候補を出して、1つ選ぶ',
    why: '解ける問題の中から、最もインパクトのあるものを選ぶ（本: イシュー度）。1つしか思いつかないときは、まだ選んでいない' },
  { title: '答えが出たとき、最後に何を出す？',
    why: '分析を始める前に、出したい形を先に決める。欲しい絵が描けないなら、まだイシューが定まっていない（本: 絵コンテ）' },
  { title: '答えが出る大きさまで割ると？',
    why: '崩れたら全部やり直しになるものを上に。大きいイシューのままでは答えが出ない（本: イシューの分解）' },
  { title: '最初に潰すのはどれ？',
    why: '一つを100%にするより、60%で全体を何周も回す（本: 回転数 × スピード）' },
];

const draft = {
  milestone: '', milestoneDue: '',
  candidates: [{ text: '', effect: '' }, { text: '', effect: '' }],
  chosen: 0, issueDue: '',
  pictureKind: '表', picture: '',
  subs: [], next: '', nextDue: '', title: '',
};
let wzStep = 0;

function mkText(id, val, ph) {
  const e = document.createElement('input');
  e.type = 'text'; if (id) e.id = id; e.value = val || ''; e.placeholder = ph || '';
  e.spellcheck = false; return e;
}
function mkDate(id, val) {
  const e = document.createElement('input');
  e.type = 'date'; if (id) e.id = id; e.value = val || ''; return e;
}
function mkArea(id, val, ph, rows) {
  const e = document.createElement('textarea');
  if (id) e.id = id; e.value = val || ''; e.placeholder = ph || '';
  e.rows = rows || 3; e.spellcheck = false; return e;
}
function wzField(label, el) {
  const l = document.createElement('label');
  l.className = 'mf';
  const s2 = document.createElement('span');
  s2.textContent = label;
  l.appendChild(s2); l.appendChild(el);
  return l;
}
function wzBind(el, key) {
  const on = () => { draft[key] = el.value; wzLive(); };
  el.addEventListener('input', on);
  el.addEventListener('change', on);
}
function pickedText() {
  const c = draft.candidates[draft.chosen];
  return c ? c.text : '';
}

// Step 2 の判定は本体と同じ純関数を通す（二重実装しない）
function wzLive() {
  if (wzStep !== 1) return;
  renderVerdict(judge([pickedText()], {
    deadline: draft.issueDue,
    unknowns: draft.subs.map(u => u.what).filter(x => nfc(x).trim() !== ''),
    picture: draft.picture,
    candidates: draft.candidates.map(c => c.text),
  }), $id('wz-judge'));
}

// --- Step 2: 論点の候補（選別） ---
function wzCands(list) {
  list.textContent = '';
  draft.candidates.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'wz-c';
    const radio = document.createElement('input');
    radio.type = 'radio'; radio.name = 'wz-cand'; radio.className = 'wz-c-pick';
    radio.checked = draft.chosen === i;
    radio.title = 'これを論点にする';
    radio.addEventListener('change', () => { if (radio.checked) { draft.chosen = i; wzLive(); } });
    const text = mkText('', c.text, '問いの候補（一行）');
    text.className = 'wz-c-text';
    text.addEventListener('input', () => { c.text = text.value; wzLive(); });
    const effect = mkText('', c.effect, '答えが出たら、誰の何が変わる？');
    effect.className = 'wz-c-effect';
    effect.addEventListener('input', () => { c.effect = effect.value; });
    const del = document.createElement('button');
    del.type = 'button'; del.textContent = '×'; del.title = 'この候補を削除';
    del.addEventListener('click', () => {
      if (draft.candidates.length <= 1) return;
      draft.candidates.splice(i, 1);
      if (draft.chosen >= draft.candidates.length) draft.chosen = draft.candidates.length - 1;
      wzCands(list); wzLive();
    });
    row.appendChild(radio); row.appendChild(text); row.appendChild(effect); row.appendChild(del);
    list.appendChild(row);
  });
}

// --- Step 4: サブイシュー ---
function wzSubs(list) {
  list.textContent = '';
  draft.subs.forEach((u, i) => {
    const row = document.createElement('div');
    row.className = 'wz-u';
    const what = mkText('', u.what, '答えが出る大きさまで割ったもの');
    what.className = 'wz-s-what';
    what.addEventListener('input', () => { u.what = what.value; });
    const way = document.createElement('select');
    way.className = 'wz-s-way';
    [['', '（未定）'], ['聞く', '聞く'], ['調べる', '調べる'], ['試す', '試す']].forEach(pair => {
      const o = document.createElement('option');
      o.value = pair[0]; o.textContent = pair[1];
      way.appendChild(o);
    });
    way.value = u.way || '';
    way.addEventListener('change', () => { u.way = way.value; });
    const who = mkText('', u.who, '誰に・どこで');
    who.className = 'wz-s-who';
    who.addEventListener('input', () => { u.who = who.value; });
    const due = mkDate('', u.due);
    due.className = 'wz-s-due';
    const setDue = () => { u.due = due.value; };
    due.addEventListener('input', setDue);
    due.addEventListener('change', setDue);
    const del = document.createElement('button');
    del.type = 'button'; del.textContent = '×'; del.title = 'この行を削除';
    del.addEventListener('click', () => { draft.subs.splice(i, 1); wzSubs(list); });
    row.appendChild(what); row.appendChild(way); row.appendChild(who);
    row.appendChild(due); row.appendChild(del);
    list.appendChild(row);
  });
}

function wzRender() {
  const body = $id('wz-body');
  body.textContent = '';
  $id('wz-step').textContent = 'Step ' + (wzStep + 1) + ' / ' + WZ.length;
  $id('wz-dots').textContent = WZ.map((_, i) => (i <= wzStep ? '●' : '○')).join('');
  $id('wz-title').textContent = WZ[wzStep].title;
  $id('wz-why').textContent = '💡 ' + WZ[wzStep].why;
  $id('wz-err').textContent = '';
  $id('wz-err').hidden = true;
  $id('wz-judge').textContent = '';
  $id('wz-judge').className = '';
  $id('wz-prev').disabled = wzStep === 0;
  $id('wz-next').hidden = wzStep === WZ.length - 1;
  $id('wz-create').hidden = wzStep !== WZ.length - 1;

  if (wzStep === 0) {
    const t = mkArea('wz-milestone', draft.milestone,
      '例: 運営チームが自分たちだけで本番を停止できる手順書が出ていて、「これで実行できます」と言われている', 3);
    wzBind(t, 'milestone');
    body.appendChild(wzField('達成されている状態', t));
    const d = mkDate('wz-milestone-due', draft.milestoneDue);
    wzBind(d, 'milestoneDue');
    body.appendChild(wzField('いつまでに', d));
  } else if (wzStep === 1) {
    const list = document.createElement('div');
    list.id = 'wz-cands';
    body.appendChild(list);
    wzCands(list);
    const add = document.createElement('button');
    add.type = 'button'; add.id = 'wz-add-cand'; add.textContent = '＋ 候補を追加';
    add.addEventListener('click', () => {
      draft.candidates.push({ text: '', effect: '' });
      wzCands(list); wzLive();
    });
    body.appendChild(add);
    const d = mkDate('wz-issue-due', draft.issueDue);
    wzBind(d, 'issueDue');
    body.appendChild(wzField('決着させる期限', d));
    wzLive();
  } else if (wzStep === 2) {
    const k = document.createElement('select');
    k.id = 'wz-pic-kind';
    ['表', 'グラフ', '一文', '画面'].forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      k.appendChild(o);
    });
    k.value = draft.pictureKind || '表';
    wzBind(k, 'pictureKind');
    body.appendChild(wzField('出す形', k));
    const t = mkArea('wz-picture', draft.picture,
      '例: 横軸＝手順書の粒度、縦軸＝運営チームが実行できたか の表。右上に集まれば仮説どおり。開発環境の実測で埋める', 3);
    wzBind(t, 'picture');
    body.appendChild(wzField('何を出す？', t));
  } else if (wzStep === 3) {
    const list = document.createElement('div');
    list.id = 'wz-subs';
    body.appendChild(list);
    if (draft.subs.length === 0) draft.subs.push({ what: '', way: '', who: '', due: '' });
    wzSubs(list);
    const add = document.createElement('button');
    add.type = 'button'; add.id = 'wz-add-sub'; add.textContent = '＋ 行を追加';
    add.addEventListener('click', () => {
      draft.subs.push({ what: '', way: '', who: '', due: '' });
      wzSubs(list);
    });
    body.appendChild(add);
  } else {
    const t = mkText('wz-next-what', draft.next, '例: 運営チームに求める完成度（粒度）を確認する');
    wzBind(t, 'next');
    body.appendChild(wzField('次の一手', t));
    const d = mkDate('wz-next-due', draft.nextDue);
    wzBind(d, 'nextDue');
    body.appendChild(wzField('期限', d));
    const n = mkText('wz-note-title', draft.title, '例: 本番停止手順書');
    wzBind(n, 'title');
    body.appendChild(wzField('ノートの名前', n));
  }
}

/* 必須は Step1（マイルストーン）・Step2（論点）・Step3（絵コンテ）。
   絵コンテを必須にしたのは、本で最も強い検算がここだから
   （描けない＝まだイシューが定まっていない）。候補が1つだけでも**進める**（info のみ） */
function wzValidate(step) {
  if (step === 0 && (nfc(draft.milestone).trim() === '' || !draft.milestoneDue))
    return 'マイルストーン（達成されている状態）と期限の両方を埋めてください — ここを飛ばすと、何を問うかが決まりません';
  if (step === 1 && (nfc(pickedText()).trim() === '' || !draft.issueDue))
    return '論点（選んだ候補）と、その問いを決着させる期限を埋めてください — いつ白黒つくか書けないものは、まだイシューではありません';
  if (step === 2 && nfc(draft.picture).trim() === '')
    return '答えが出たとき最後に何を出すかを書いてください — 欲しい絵が描けないなら、まだイシューが定まっていません';
  return '';
}
function wzError(msg) {
  $id('wz-err').textContent = msg;
  $id('wz-err').hidden = false;
}

function wzOpen() {
  $id('wizard').hidden = false;
  wzRender();
  const first = $id('wz-body').querySelector('textarea, input, select');
  if (first) first.focus();
}
function wzClose() { $id('wizard').hidden = true; }   // 下書きは残す（非破壊 = IME ガード不要）

$id('wizard-btn').addEventListener('click', wzOpen);
$id('wz-close').addEventListener('click', wzClose);
$id('wz-prev').addEventListener('click', () => { if (wzStep > 0) { wzStep--; wzRender(); } });
$id('wz-next').addEventListener('click', () => {
  const err = wzValidate(wzStep);
  if (err) { wzError(err); return; }
  if (wzStep < WZ.length - 1) { wzStep++; wzRender(); }
});
$id('wz-create').addEventListener('click', async () => {
  for (const st of [0, 1, 2]) {
    const err = wzValidate(st);
    if (err) { wzStep = st; wzRender(); wzError(err); return; }
  }
  $id('input').value = buildMd(draft);
  $id('deadline').value = draft.issueDue || '';
  $id('title').value = draft.title || '';
  updateSampleBtn();
  scheduleSave();
  wzClose();
  await createNote();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$id('close-modal').hidden) { e.preventDefault(); closeCloseModal(); return; }
  if (!$id('wizard').hidden) { e.preventDefault(); wzClose(); }
});

/* ---------- 起動（**すべての定義の後**に置く — 一覧の let issues より前だと TDZ で落ちる） ---------- */
restore();
run();
updateSampleBtn();
updateEnvNote();
applyVaultCfg();
renderCards();
/* 前回選んだフォルダを思い出して**自動で一覧を出す**（選び直させない）。
   権限が prompt のときはピッカーがジェスチャ必須なので読まず、［📂］に委ねる */
idbGet(IDB_KEY).then(async h => {
  if (!h) return;
  dirHandle = h;
  try {
    if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted') await loadIssues(false);
  } catch (_) { /* 権限の問い合わせ自体が失敗しても一覧が空になるだけ */ }
}).catch(() => {});
ToolStorage.mountWarning();

ToolEdit.tabIndent($id('input'), { mdList: true });   // md を書く欄（coding-rules）
ToolEdit.mountTodayShortcut();                        // Ctrl/Cmd+; = 今日（締切）
ToolUI.mountModeSwitch();        // Cmd/Ctrl+Shift+E でタスク ⇔ イシュー

// テスト用フック（docs/specs/issue.md）
window.issue = { parseSections: parseSections, judge: judge, toNote: toNote,
                 toTasks: toTasks, noteFileName: noteFileName, buildMd: buildMd,
                 parseFrontmatter: parseFrontmatter, setFrontmatter: setFrontmatter,
                 appendToSection: appendToSection, subRows: subRows, summarize: summarize,
                 load: () => loadIssues(false), list: () => issues };

ToolLauncher.mount();   // ☰ ツール / Cmd+Ctrl+K で引き出しメニュー（lib/launcher.js）
</script>
