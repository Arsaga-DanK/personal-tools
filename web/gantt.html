<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draw Gantt (gantt)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📊%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../lib/ui.css">
<style>
  /* gantt 固有: 出力ペインは白背景固定（出力 PNG と同じ見た目 — diagram と同じ） */
  #output {
    min-height: 220px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #ffffff;
    padding: 12px;
    overflow: auto;
  }
  #output svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<main class="app-wide">
  <p class="tool-header"><a href="../index.html">← ツール一覧</a><span class="autosave-note">入力とオプションは自動保存されます</span></p>
  <h1>Draw Gantt</h1>
  <p class="subtitle">タスクと期間の表 → ガントチャート画像（PNG コピー）— 管理はしない・資料貼り付け用。1行「タスク名、開始、終了か日数」・区切りのない行はセクション見出し</p>

  <div class="toolbar">
    <button class="primary" id="copy-btn" title="Cmd/Ctrl+Enter">PNG をコピー</button>
    <label class="toggle"><input type="checkbox" id="exclude-weekends" checked> 土日を除外</label>
    <span class="muted" style="font-size:12px">例: 基本設計⇥2026-08-18⇥2026-08-22（タブかカンマ区切り。日数は 5d / 5日）</span>
  </div>

  <div class="banner" id="banner" hidden></div>

  <div class="panes">
    <div class="pane">
      <p class="pane-title">タスク表<button type="button" class="sample-btn" id="sample-btn">サンプルを入れる</button></p>
      <textarea id="input" spellcheck="false" placeholder="設計フェーズ&#10;基本設計&#9;2026-08-18&#9;2026-08-22&#10;詳細設計&#9;2026-08-25&#9;5d"></textarea>
    </div>
    <div class="pane">
      <p class="pane-title">チャート（プレビュー）</p>
      <div id="output" aria-live="polite"></div>
    </div>
  </div>
</main>

<script src="../lib/ui.js"></script>
<script src="../lib/storage.js"></script>
<script src="../lib/edit.js"></script>
<script src="../lib/vendor/mermaid.min.js"></script>
<script src="../lib/mmd.js"></script>
<script>
'use strict';

const el = id => document.getElementById(id);
function showBanner(kind, text) { ToolUI.banner(el('banner'), kind, text); }

const TOOL = 'gantt';

/* ========== 純関数: 表テキスト → mermaid gantt DSL（spec「変換」） ========== */

// 'YYYY-MM-DD' に +n 日（内部は Date.UTC — TZ 事故防止。dates と同じ流儀）
function addDays(ymd, n) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd);
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]) + n * 86400000);
  return d.toISOString().slice(0, 10);
}

// 'YYYY-MM-DD' / 'YYYY/M/D' → 'YYYY-MM-DD'（それ以外は null）
function normDate(s) {
  const m = /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/.exec(String(s).trim());
  if (!m) return null;
  const mm = m[2].padStart(2, '0'), dd = m[3].padStart(2, '0');
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  if (d.getUTCMonth() !== +m[2] - 1 || d.getUTCDate() !== +m[3]) return null;   // 実在しない日付
  return m[1] + '-' + mm + '-' + dd;
}

// '5d' / '5日' → '5d'（それ以外は null）
function normDuration(s) {
  const m = /^(\d+)\s*(d|日)$/.exec(String(s).trim());
  return m ? m[1] + 'd' : null;
}

function isBusinessDay(ymd) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd);
  const w = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).getUTCDay();
  return w !== 0 && w !== 6;
}

// 開始日を1日目として N 営業日目の日付（mermaid の週末延長と実測2ケースで一致 — GN-Q7）
function walkBusinessDays(start, n, excludeWeekends) {
  if (!excludeWeekends) return addDays(start, n - 1);
  let d = start;
  let count = isBusinessDay(d) ? 1 : 0;
  while (count < n) {
    d = addDays(d, 1);
    if (isBusinessDay(d)) count++;
  }
  return d;
}

function nextStart(prevEnd, excludeWeekends) {
  let d = addDays(prevEnd, 1);
  if (excludeWeekends) while (!isBusinessDay(d)) d = addDays(d, 1);
  return d;
}

function buildDsl(text, opts) {
  const excludeWeekends = !opts || opts.excludeWeekends !== false;
  const warnings = [];
  const body = [];
  let taskN = 0;
  let prevEnd = null;   // 直前タスクの終了（含む）— チェーン入力の起点
  const lines = String(text == null ? '' : text).split('\n');
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const line = raw.trim();
    if (line === '' || line.startsWith('#')) continue;
    const parts = raw.includes('\t') ? raw.split('\t') : raw.split(',');
    if (parts.length === 1) {   // 区切りなし = セクション見出し
      body.push('section ' + line.replace(/:/g, '：'));
      continue;
    }
    if (parts.length < 3) {
      warnings.push((i + 1) + '行目: 「名前、開始、終了か日数」の3列が必要です');
      continue;
    }
    const name = parts[0].trim().replace(/:/g, '：');   // ':' は mermaid の区切りと衝突（spec）
    let start = normDate(parts[1]);
    // チェーン入力: 開始空欄 = 前のタスクの終了の翌営業日（spec「チェーン入力」）
    if (!start && parts[1].trim() === '') {
      if (prevEnd === null) {
        warnings.push((i + 1) + '行目: 開始がありません（先頭のタスクは開始必須）');
        continue;
      }
      start = nextStart(prevEnd, excludeWeekends);
    }
    let end = normDate(parts[2]) || normDuration(parts[2]);
    if (name === '' || !start || !end) {
      warnings.push((i + 1) + '行目: 解釈できません（開始は YYYY-MM-DD・終了は日付か 5d/5日）');
      continue;
    }
    if (/^\d{4}-/.test(end)) {
      // 終了日は「含む」— mermaid の排他仕様を +1 日で吸収（GN-Q4・2026-08-17 実測）
      if (end < start) {
        warnings.push((i + 1) + '行目: 終了が開始より前です（1日の棒に丸めました）');
        end = start;
      }
      prevEnd = end;
      end = addDays(end, 1);
    } else {
      prevEnd = walkBusinessDays(start, parseInt(end, 10), excludeWeekends);
    }
    taskN++;
    body.push(name + ' :t' + taskN + ', ' + start + ', ' + end);
  }
  if (taskN === 0) return { dsl: null, warnings };
  const head = ['gantt', 'dateFormat YYYY-MM-DD', 'axisFormat %m/%d'];
  if (excludeWeekends) head.push('excludes weekends');
  return { dsl: head.concat(body).join('\n'), warnings };
}

/* ========== 取り込み（貼るだけ — spec「取り込み」。純関数） ========== */

const TASK_RE = /^(\t*)- \[(.)\] (.*)$/;
const DATE_TOKEN = '(\\d{4}-\\d{2}-\\d{2})';

function pickDate(body, emoji) {
  const m = new RegExp(emoji + '\uFE0F? ' + DATE_TOKEN).exec(body);
  return m ? m[1] : null;
}

// tasks.md の本文からメタトークンを除去して表示名にする（タグは残す — spec 変換表）
function cleanTaskName(body) {
  return body
    .replace(/[🛫⏳📅✅❌]\uFE0F? \d{4}-\d{2}-\d{2}/g, '')
    .replace(/🆔\uFE0F? \S+/g, '')
    .replace(/⛔\uFE0F? \S+/g, '')
    .replace(/[🔺⏫🔼🔽⏬]\uFE0F?/g, '')
    .replace(/\[\[([^\]]+)\]\]/g, '$1')
    .replace(/\s+/g, ' ')
    .trim();
}

function importText(raw) {
  const text = String(raw == null ? '' : raw);
  const lines = text.split('\n');
  const first = lines[0] || '';
  // Excel用コピー形式（状態 が先頭列）は変換しない — 列順が違い全滅する（GN-Q8）
  if (/^状態\t内容\t/.test(first)) return { text: null, warnings: [], kind: 'excel' };
  // 「計画をコピー」形式（タイムライン）
  if (/^内容\t開始日\t期限\t日数\t状態\tセクション$/.test(first)) {
    const out = [];
    let done = 0;
    let section = null;
    for (const row of lines.slice(1)) {
      if (row.trim() === '') continue;
      const c = row.split('\t');
      if (c.length < 6) continue;
      const sec = c[5].trim();
      if (sec !== '' && sec !== section) {
        section = sec;
        out.push(section);
      }
      if (c[4] === '済' || c[4] === '中止') { done++; continue; }
      const start = normDate(c[1]);
      if (!start) continue;
      const due = normDate(c[2]);
      out.push(c[0] + '\t' + start + '\t' + (due || '1d'));
    }
    const warnings = done > 0 ? ['終わったタスク' + done + '件をスキップしました'] : [];
    return { text: '# 取り込み: ' + ToolEdit.today() + '\n' + out.join('\n'), warnings, kind: 'plan' };
  }
  // tasks.md（Obsidian Tasks 記法）
  if (!lines.some(l => TASK_RE.test(l))) return { text: null, warnings: [], kind: null };
  const out = [];
  let done = 0, dateless = 0;
  for (const l of lines) {
    const sec = /^## (.+?)\s*$/.exec(l);
    if (sec) { out.push(sec[1]); continue; }
    const m = TASK_RE.exec(l);
    if (!m) continue;   // メモ行などは捨てる（spec 変換表）
    if (m[2] === 'x' || m[2] === 'X' || m[2] === '-') { done++; continue; }
    const start = pickDate(m[3], '🛫');
    const due = pickDate(m[3], '📅');
    if (!start && !due) { dateless++; continue; }
    const name = '\u3000'.repeat(m[1].length) + cleanTaskName(m[3]);
    if (start && due) out.push(name + '\t' + start + '\t' + due);
    else out.push(name + '\t' + (start || due) + '\t1d');
  }
  const warnings = [];
  if (done > 0) warnings.push('終わったタスク' + done + '件をスキップしました');
  if (dateless > 0) warnings.push('日付のない' + dateless + '行をスキップしました');
  return { text: '# 取り込み: ' + ToolEdit.today() + '\n' + out.join('\n'), warnings, kind: 'tasks' };
}

/* ========== 描画（フックと UI が同一コードパス。前回の図を保持 — diagram と同じ） ========== */

let lastSvg = null;
let renderSeq = 0;

async function render(text) {
  const seq = ++renderSeq;
  const value = String(text == null ? '' : text);
  if (value.trim() === '') {
    lastSvg = null;
    el('output').textContent = '';
    showBanner('info', '');
    return { ok: true, error: null };
  }
  const { dsl, warnings } = buildDsl(value, { excludeWeekends: el('exclude-weekends').checked });
  if (dsl === null) {
    lastSvg = null;
    el('output').textContent = '';
    showBanner('warn', 'タスクが1件もありません' + (warnings.length ? '（' + warnings.join(' / ') + '）' : ''));
    return { ok: false, error: 'タスクなし' };
  }
  try {
    const host = document.createElement('div');
    const svg = await ToolMmd.render(host, dsl);
    if (seq !== renderSeq) return { ok: true, error: null };
    lastSvg = svg;
    el('output').textContent = '';
    el('output').appendChild(svg);
    showBanner(warnings.length ? 'warn' : 'info', warnings.join(' / '));
    return { ok: true, error: null };
  } catch (e) {
    if (seq !== renderSeq) return { ok: false, error: String(e && e.message || e) };
    const msg = String(e && e.message || e).split('\n')[0];
    showBanner('warn', '描画できません: ' + msg + '（前回のチャートを表示しています）');
    return { ok: false, error: msg };
  }
}

/* ========== UI 配線 ========== */

let debounceTimer = null;
function scheduleRender() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { debounceTimer = null; render(el('input').value); }, 300);
}
function flushRender() {   // コピー時に確定（coding-rules）
  clearTimeout(debounceTimer);
  debounceTimer = null;
  return render(el('input').value);
}

const FIELD_LIMIT = 100000;
let saveTimer = null;
function savePayload() {
  const v = el('input').value;
  return {
    input: v.length > FIELD_LIMIT ? { omitted: true } : v,
    excludeWeekends: el('exclude-weekends').checked,
  };
}
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveTimer = null; ToolStorage.save(TOOL, savePayload()); }, 300);
}
function flushSave() {
  clearTimeout(saveTimer);
  saveTimer = null;
  ToolStorage.save(TOOL, savePayload());
}
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSave();
});

function restore() {
  const data = ToolStorage.load(TOOL);
  if (!data) return;
  if (typeof data.input === 'string') el('input').value = data.input;
  else if (data.input && data.input.omitted) {
    showBanner('info', '前回の内容は大きすぎたため復元されませんでした（保存上限 100KB）');
  }
  if (typeof data.excludeWeekends === 'boolean') el('exclude-weekends').checked = data.excludeWeekends;
}

function updateSampleBtn() { el('sample-btn').hidden = el('input').value !== ''; }

el('input').addEventListener('input', () => {
  scheduleRender();
  updateSampleBtn();
  scheduleSave();
});

// 貼り付けの自動変換（tasks.md / 計画をコピー → 表テキスト。Excel用コピーは案内 — spec「取り込み」）
el('input').addEventListener('paste', e => {
  const raw = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
  if (!raw) return;
  const r = importText(raw);
  if (r.kind === 'excel') {
    e.preventDefault();
    showBanner('warn', 'これは「Excel用コピー」の形式です — Plan Tasks のタイムライン表示にある「計画をコピー」を貼ってください');
    return;
  }
  if (!r.kind || !r.text) return;   // 知らない形式はブラウザの貼り付けに任せる
  e.preventDefault();
  const ta = el('input');
  const v = ta.value, st = ta.selectionStart, en = ta.selectionEnd;
  ta.value = v.slice(0, st) + r.text + v.slice(en);
  ta.selectionStart = ta.selectionEnd = st + r.text.length;
  updateSampleBtn();
  scheduleSave();
  flushRender().then(() => {
    if (r.warnings.length) showBanner('warn', r.warnings.join('・'));
  });
});
el('exclude-weekends').addEventListener('change', () => {
  scheduleRender();
  scheduleSave();
});

el('copy-btn').addEventListener('click', () => {
  // Safari 対策: ジェスチャ内で同期的に write するため Promise を渡す（mask / diagram と同型）
  const blobPromise = flushRender().then(() => {
    if (!lastSvg) throw new Error('チャートがありません');
    return ToolMmd.toPngBlob(lastSvg, 2);
  });
  const item = new ClipboardItem({ 'image/png': blobPromise });
  navigator.clipboard.write([item]).then(
    () => ToolUI.feedback(el('copy-btn'), '✓ コピーしました'),
    () => showBanner('warn', 'クリップボードへ書けませんでした'));
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    el('copy-btn').click();
  }
});

el('sample-btn').addEventListener('click', () => {
  el('input').value = '設計フェーズ\n基本設計\t2026-08-18\t2026-08-22\n詳細設計\t2026-08-25\t5d\n実装フェーズ\n実装\t2026-09-01\t10日\n結合テスト\t2026-09-16\t2026-09-19';
  render(el('input').value);
  updateSampleBtn();
  scheduleSave();
});

restore();
updateSampleBtn();
if (el('input').value !== '') render(el('input').value);
ToolStorage.mountWarning();

ToolEdit.tabIndent(el('input'));      // Tab=インデント（lib/edit.js — coding-rules）
ToolEdit.mountTodayShortcut();        // Ctrl/Cmd+; = 今日

// テスト用フック（docs/specs/gantt.md）
window.gantt = {
  buildDsl,
  importText,
  render,
  svgInfo: () => {
    const svg = el('output').querySelector('svg');
    return { present: !!svg, nodes: svg ? svg.querySelectorAll('g, rect, text').length : 0 };
  },
};
</script>
</body>
</html>
